[package]
name = "gotify-notifier"
version = "0.5.1"
description = "A Gotify notification client with liquid glass desktop widget"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "gotify_notifier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
cc = "1.10"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-notification = "2.7"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3"
url = "2.5"
image = { version = "0.24", default-features = false, features = ["png"] }
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.50"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
