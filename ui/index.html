<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gotify</title>
    <style>
        :root {
            /* 主题与液态玻璃变量 */
            --bg-primary: #0f1419;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-tertiary: #6b7280;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --widget-opacity: 0.70;
        }

        [data-theme="light"] {
            --bg-primary: #f5f7fa;
            --text-primary: #1a1a2e;
            --text-secondary: #4b5563;
            --text-tertiary: #9ca3af;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background: transparent !important;
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, sans-serif;
        }

        .container {
            width: 100vw;
            height: 100vh;
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            background: transparent !important;
            background-color: transparent !important;
            overflow: hidden;
            border: none !important;
            box-shadow: none !important;
        }

        /* 桌面小组件卡片：26px 苹果连续曲率圆角与 100% 纯原生 NSGlassEffectView 液态玻璃 */
        .desktop-widget-card {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 26px !important;
            overflow: hidden !important;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: transform;
            -webkit-backface-visibility: hidden;
            /* 100% 透出底层 macOS 原生 NSGlassEffectView (v11 水滴透镜等) 与动态高光反射边缘 */
            background: rgba(10, 14, 24, var(--glass-tint-alpha, 0)) !important;
            border: none !important;
            box-shadow: inset 0 calc(0.06 * var(--glass-arc-height, 20px) * var(--glass-highlight-mul, 1)) 0 rgba(255, 255, 255, calc(0.45 * var(--glass-highlight-mul, 1))),
                        inset 0 calc(-0.05 * var(--glass-arc-height, 20px) * var(--glass-highlight-mul, 1)) 0 rgba(255, 255, 255, calc(0.22 * var(--glass-highlight-mul, 1))),
                        inset 0 0 0 0.5px rgba(255, 255, 255, calc(0.18 * var(--glass-highlight-mul, 1))) !important;
            display: flex !important;
            flex-direction: column !important;
            box-sizing: border-box !important;
            color: #ffffff !important;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto !important;
            cursor: grab;
            transition: background 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .desktop-widget-card::before {
            display: none !important;
        }

        .os-windows .desktop-widget-card {
            backdrop-filter: blur(32px) !important;
            -webkit-backdrop-filter: blur(32px) !important;
            background: rgba(22, 28, 40, var(--widget-opacity, 0.45)) !important;
        }

        .desktop-widget-card.is-active,
        .desktop-widget-card.is-focused {
            background: rgba(10, 14, 24, var(--glass-tint-alpha, 0)) !important;
            border: none !important;
            box-shadow: inset 0 calc(0.06 * var(--glass-arc-height, 20px) * var(--glass-highlight-mul, 1)) 0 rgba(255, 255, 255, calc(0.45 * var(--glass-highlight-mul, 1))),
                        inset 0 calc(-0.05 * var(--glass-arc-height, 20px) * var(--glass-highlight-mul, 1)) 0 rgba(255, 255, 255, calc(0.22 * var(--glass-highlight-mul, 1))),
                        inset 0 0 0 0.5px rgba(255, 255, 255, calc(0.18 * var(--glass-highlight-mul, 1))) !important;
        }

        .os-windows .desktop-widget-card.is-active,
        .os-windows .desktop-widget-card.is-focused {
            background: rgba(22, 28, 40, var(--widget-active-opacity, 0.65)) !important;
        }

        /* 仅在主动切换形态或调节透明度时启用平滑过渡，避免常态背景刷新触发 0.35s 闪屏 */
        .desktop-widget-card.is-transitioning {
            transition: background 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] .desktop-widget-card {
            background: rgba(255, 255, 255, var(--glass-tint-alpha, 0)) !important;
            border: none !important;
            box-shadow: inset 0 calc(0.06 * var(--glass-arc-height, 20px) * var(--glass-highlight-mul, 1)) 0 rgba(255, 255, 255, calc(0.70 * var(--glass-highlight-mul, 1))),
                        inset 0 calc(-0.05 * var(--glass-arc-height, 20px) * var(--glass-highlight-mul, 1)) 0 rgba(0, 0, 0, calc(0.10 * var(--glass-highlight-mul, 1))),
                        inset 0 0 0 0.5px rgba(255, 255, 255, calc(0.40 * var(--glass-highlight-mul, 1))) !important;
            color: #111827 !important;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.65);
            transition: background 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .os-windows[data-theme="light"] .desktop-widget-card {
            background: rgba(245, 247, 252, var(--widget-opacity, 0.45)) !important;
        }

        [data-theme="light"] .desktop-widget-card.is-active,
        [data-theme="light"] .desktop-widget-card.is-focused {
            background: rgba(255, 255, 255, var(--glass-tint-alpha, 0)) !important;
            border: none !important;
            box-shadow: inset 0 calc(0.06 * var(--glass-arc-height, 20px) * var(--glass-highlight-mul, 1)) 0 rgba(255, 255, 255, calc(0.70 * var(--glass-highlight-mul, 1))),
                        inset 0 calc(-0.05 * var(--glass-arc-height, 20px) * var(--glass-highlight-mul, 1)) 0 rgba(0, 0, 0, calc(0.10 * var(--glass-highlight-mul, 1))),
                        inset 0 0 0 0.5px rgba(255, 255, 255, calc(0.40 * var(--glass-highlight-mul, 1))) !important;
        }

        .os-windows[data-theme="light"] .desktop-widget-card.is-active,
        .os-windows[data-theme="light"] .desktop-widget-card.is-focused {
            background: rgba(245, 247, 252, var(--widget-active-opacity, 0.75)) !important;
        }

        .widget-header {
            height: 42px;
            padding: 0 14px 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: none !important;
            flex-shrink: 0;
            pointer-events: auto !important;
            cursor: grab;
        }

        .widget-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: -0.2px;
            cursor: grab;
            user-select: none;
        }

        .widget-indicator {
            width: 7.5px;
            height: 7.5px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
            display: inline-block;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .widget-indicator.offline {
            background: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
        }

        .widget-title {
            font-size: 13px;
            font-weight: 600;
            opacity: 0.95;
            letter-spacing: -0.1px;
            cursor: grab;
        }

        .widget-badge {
            background: rgba(99, 102, 241, 0.3);
            border: 1px solid rgba(99, 102, 241, 0.5);
            color: #a5b4fc;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 10px;
            min-width: 16px;
            text-align: center;
            line-height: 1.2;
        }

        .widget-badge.hidden {
            display: none !important;
        }

        .widget-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            -webkit-app-region: no-drag !important;
        }

        .widget-btn {
            background: transparent;
            border: none;
            color: inherit;
            cursor: pointer;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.65;
            transition: all 0.15s ease;
            pointer-events: auto !important;
            user-select: none;
        }

        .widget-btn svg,
        .widget-btn path,
        .widget-btn circle,
        .widget-btn polyline,
        .widget-btn line {
            pointer-events: none !important;
        }

        .widget-btn:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] .widget-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .widget-btn.active {
            opacity: 1;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
        }

        /* 液态玻璃风格与透明度调节 Popover 弹窗 */
        /* 液态玻璃风格与透明度调节 Popover 弹窗 */
        .widget-opacity-popover {
            position: absolute;
            top: 40px;
            right: 8px;
            z-index: 1000;
            width: 278px;
            max-width: calc(100% - 16px);
            max-height: calc(100% - 48px);
            overflow-y: auto;
            background: rgba(18, 24, 38, 0.94);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 18px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            animation: popoverFadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            -webkit-user-select: none;
        }

        .widget-opacity-popover::-webkit-scrollbar {
            width: 4px;
        }

        .widget-opacity-popover::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
        }

        [data-theme="light"] .widget-opacity-popover {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(0, 0, 0, 0.12);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.05);
        }

        @keyframes popoverFadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .popover-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding-bottom: 2px;
        }

        .popover-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .opacity-val-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 5px;
            background: rgba(56, 189, 248, 0.14);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: #38bdf8;
            white-space: nowrap;
        }

        .glass-nav-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .glass-step-btn {
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: var(--text-primary);
            font-size: 10.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .glass-step-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .glass-style-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .glass-chip {
            padding: 6px 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.15s ease;
        }

        .glass-chip:hover {
            background: rgba(255, 255, 255, 0.16);
            color: var(--text-primary);
        }

        .glass-chip.active {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.92), rgba(99, 102, 241, 0.92));
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.55);
            box-shadow: 0 2px 10px rgba(14, 165, 233, 0.4);
        }

        .glass-desc-bar {
            font-size: 10.5px;
            color: var(--text-secondary);
            text-align: center;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            font-weight: 500;
        }

        .tuning-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .tuning-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tuning-label {
            font-size: 10.5px;
            color: var(--text-primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tuning-hint {
            font-size: 9px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .tuning-val {
            font-size: 10.5px;
            font-weight: 700;
            color: #38bdf8;
            font-family: ui-monospace, SFMono-Regular, monospace;
        }

        .popover-slider-row {
            display: flex;
            align-items: center;
            padding: 2px 0;
        }

        .popover-slider-row input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        [data-theme="light"] .popover-slider-row input[type="range"] {
            background: rgba(0, 0, 0, 0.12);
        }

        .popover-slider-row input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .popover-slider-row input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .popover-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        .preset-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 4px 2px;
            font-size: 9.5px;
            color: var(--text-secondary);
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        [data-theme="light"] .preset-chip {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.06);
            color: var(--text-secondary);
        }

        .preset-chip:hover {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            border-color: rgba(99, 102, 241, 0.3);
        }

        .preset-chip.active {
            background: rgba(99, 102, 241, 0.25);
            color: #818cf8;
            font-weight: 600;
            border-color: rgba(99, 102, 241, 0.6);
        }

        .widget-body {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 2px 10px 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
            cursor: default;
        }

        .widget-body::-webkit-scrollbar {
            width: 4px;
        }

        .widget-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }

        .widget-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0.55;
            padding: 20px 0;
            cursor: grab;
        }

        .widget-empty-icon-wrap {
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }

        .liquid-bell-icon {
            opacity: 0.75;
        }

        .widget-empty-text {
            font-size: 11.5px;
            color: inherit;
            cursor: grab;
        }

        .widget-item {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 100%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow:
                inset 0 1px 0.5px 0 rgba(255, 255, 255, 0.28),
                inset 0 -0.5px 0.5px 0 rgba(0, 0, 0, 0.12),
                0 2px 8px rgba(0, 0, 0, 0.10);
            border-radius: 11px;
            padding: 8px 10px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
            position: relative;
            user-select: text;
            -webkit-user-select: text;
        }

        [data-theme="light"] .widget-item {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.68) 0%, rgba(255, 255, 255, 0.42) 100%);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow:
                inset 0 1px 0.5px 0 rgba(255, 255, 255, 0.85),
                0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .widget-item:hover {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.20) 0%, rgba(255, 255, 255, 0.08) 100%);
            border-color: rgba(255, 255, 255, 0.26);
            box-shadow:
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.38),
                0 4px 12px rgba(0, 0, 0, 0.16);
            transform: translateY(-0.5px);
        }

        [data-theme="light"] .widget-item:hover {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.62) 100%);
            border-color: rgba(255, 255, 255, 0.88);
        }

        .widget-item.pinned {
            border-left: 2.5px solid #f59e0b !important;
            background: rgba(245, 158, 11, 0.06);
        }

        .widget-item.priority-high {
            border-left: 2.5px solid #ef4444;
        }

        .widget-item.priority-medium {
            border-left: 2.5px solid #f59e0b;
        }

        .widget-item.priority-low {
            border-left: 2.5px solid #10b981;
        }

        .widget-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 3px;
        }

        .widget-item-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .widget-item-meta {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: var(--text-tertiary);
            flex-shrink: 0;
        }

        .widget-pin-icon {
            font-size: 9px;
        }

        .widget-item-time {
            font-size: 10px;
            color: var(--text-tertiary);
        }

        .widget-item-desc {
            font-size: 11px;
            line-height: 1.4;
            color: var(--text-secondary);
            word-wrap: break-word;
            word-break: break-all;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .widget-item.expanded .widget-item-desc {
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
            max-height: 160px;
            overflow-y: auto;
            margin-top: 4px;
        }

        .widget-item-desc a {
            color: var(--accent);
            text-decoration: underline;
            cursor: pointer;
        }

        .widget-item-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        [data-theme="light"] .widget-item-actions {
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }

        .widget-mini-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: inherit;
            padding: 2px 7px;
            border-radius: 5px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        [data-theme="light"] .widget-mini-btn {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .widget-mini-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border-color: rgba(99, 102, 241, 0.4);
        }

        .widget-mini-btn.delete:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.4);
        }

        /* 右键菜单 */
        .context-menu {
            position: fixed;
            background: rgba(28, 33, 46, 0.95);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 4px;
            display: none;
            z-index: 9999;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            min-width: 160px;
            user-select: none;
            -webkit-user-select: none;
        }

        [data-theme="light"] .context-menu {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .context-menu-item {
            padding: 6px 10px;
            font-size: 12px;
            color: var(--text-primary);
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s ease;
        }

        .context-menu-item:hover {
            background: rgba(99, 102, 241, 0.25);
            color: #818cf8;
        }

        [data-theme="light"] .context-menu-item:hover {
            background: rgba(79, 70, 229, 0.1);
            color: #4f46e5;
        }

        /* ============================================================
           未读通知呼吸与流光动效系统
           ============================================================ */
        /* 1. 极光霓虹流光 */
        .unread-effect-aurora {
            animation: unreadAurora 3s ease-in-out infinite !important;
        }

        @keyframes unreadAurora {
            0% {
                box-shadow: 0 0 10px rgba(99, 102, 241, 0.5), inset 0 0 6px rgba(16, 185, 129, 0.3);
                border-color: rgba(99, 102, 241, 0.8);
            }
            33% {
                box-shadow: 0 0 12px rgba(16, 185, 129, 0.5), inset 0 0 8px rgba(245, 158, 11, 0.3);
                border-color: rgba(16, 185, 129, 0.8);
            }
            66% {
                box-shadow: 0 0 14px rgba(236, 72, 153, 0.5), inset 0 0 8px rgba(99, 102, 241, 0.3);
                border-color: rgba(236, 72, 153, 0.8);
            }
            100% {
                box-shadow: 0 0 10px rgba(99, 102, 241, 0.5), inset 0 0 6px rgba(16, 185, 129, 0.3);
                border-color: rgba(99, 102, 241, 0.8);
            }
        }

        /* 2. 呼吸脉动光晕 */
        .unread-effect-pulse {
            animation: unreadPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite !important;
        }

        @keyframes unreadPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0);
                border-color: rgba(99, 102, 241, 0.3);
            }
            50% {
                box-shadow: 0 0 12px 3px rgba(99, 102, 241, 0.55);
                border-color: rgba(99, 102, 241, 0.9);
            }
        }

        /* 3. 科技信标高亮 */
        .unread-effect-beacon {
            animation: unreadBeacon 2.5s ease-in-out infinite !important;
        }

        @keyframes unreadBeacon {
            0%, 100% {
                border-color: rgba(59, 130, 246, 0.3);
                background-color: rgba(59, 130, 246, 0.05);
            }
            50% {
                border-color: rgba(59, 130, 246, 0.85);
                background-color: rgba(59, 130, 246, 0.16);
                box-shadow: 0 0 16px rgba(59, 130, 246, 0.45);
            }
        }

        /* 4. 水波微澜涟漪 */
        .unread-effect-ripple {
            animation: unreadRipple 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite !important;
        }

        @keyframes unreadRipple {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
                border-color: rgba(16, 185, 129, 0.8);
            }
            70% {
                box-shadow: 0 0 0 7px rgba(16, 185, 129, 0);
                border-color: rgba(16, 185, 129, 0.4);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
                border-color: rgba(16, 185, 129, 0.2);
            }
        }

        /* 独立未读物理律动弹跳动效系统 */
        :root {
            --bounce-amp: -6px;
            --bounce-amp-sub: -2.5px;
            --bounce-amp-micro: -1px;
        }

        .unread-bounce-active {
            animation: unreadSpringBounce 2.2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite !important;
        }

        .unread-bounce-active.unread-effect-aurora {
            animation: unreadAurora 3s ease-in-out infinite, unreadSpringBounce 2.2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite !important;
        }

        .unread-bounce-active.unread-effect-pulse {
            animation: unreadPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite, unreadSpringBounce 2.2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite !important;
        }

        .unread-bounce-active.unread-effect-beacon {
            animation: unreadBeacon 2.5s ease-in-out infinite, unreadSpringBounce 2.2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite !important;
        }

        .unread-bounce-active.unread-effect-ripple {
            animation: unreadRipple 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite, unreadSpringBounce 2.2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite !important;
        }

        .unread-bounce-active.unread-effect-border_stream {
            animation: unreadBorderStream 3.5s linear infinite, unreadSpringBounce 2.2s cubic-bezier(0.28, 0.84, 0.42, 1) infinite !important;
        }

        @keyframes unreadSpringBounce {
            0%, 100% {
                transform: translateY(0);
            }
            16% {
                transform: translateY(var(--bounce-amp, -6px));
            }
            28% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(var(--bounce-amp-sub, -2.5px));
            }
            52% {
                transform: translateY(0);
            }
            62% {
                transform: translateY(var(--bounce-amp-micro, -1px));
            }
            70% {
                transform: translateY(0);
            }
        }

        /* 5. 跑马灯炫彩边框 */
        .unread-effect-border_stream {
            animation: unreadBorderStream 3.5s linear infinite !important;
        }

        @keyframes unreadBorderStream {
            0% {
                box-shadow: -6px -4px 14px rgba(236, 72, 153, 0.5), 6px 4px 14px rgba(59, 130, 246, 0.4);
                border-color: rgba(236, 72, 153, 0.8);
            }
            25% {
                box-shadow: 6px -4px 14px rgba(16, 185, 129, 0.5), -6px 4px 14px rgba(245, 158, 11, 0.4);
                border-color: rgba(16, 185, 129, 0.8);
            }
            50% {
                box-shadow: 6px 4px 14px rgba(59, 130, 246, 0.5), -6px -4px 14px rgba(236, 72, 153, 0.4);
                border-color: rgba(59, 130, 246, 0.8);
            }
            75% {
                box-shadow: -6px 4px 14px rgba(245, 158, 11, 0.5), 6px -4px 14px rgba(16, 185, 129, 0.4);
                border-color: rgba(245, 158, 11, 0.8);
            }
            100% {
                box-shadow: -6px -4px 14px rgba(236, 72, 153, 0.5), 6px 4px 14px rgba(59, 130, 246, 0.4);
                border-color: rgba(236, 72, 153, 0.8);
            }
        }

        /* 鼠标移入标记已阅后的平滑消退过度类 */
        .unread-marked-read {
            animation: none !important;
            box-shadow: none !important;
            border-color: rgba(128, 128, 128, 0.15) !important;
            transform: translateY(0) !important;
            transition: all 0.35s ease !important;
        }
    </style>
</head>

<body>
    <!-- 平台自适应检测 -->
    <script>
        (function () {
            var isWin = /windows|win32/i.test(navigator.userAgent) || (navigator.platform && navigator.platform.indexOf('Win') !== -1);
            if (isWin) {
                document.documentElement.classList.add('os-windows');
            }
        })();
    </script>
    <!-- Tauri API 初始化脚本 - 必须在所有脚本之前加载 -->
    <script src="lang.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Tauri v2 事件 API -->
    <script type="module">
        import { listen } from 'https://cdn.jsdelivr.net/npm/@tauri-apps/api@2/event.js';
        window.__TAURI_LISTEN__ = listen;
    </script>

    <div class="container">
        <!-- 桌面小组件卡片 (Desktop Widget Card) -->
        <div id="desktopWidgetView" class="desktop-widget-card"
            onmousedown="onWidgetMouseDown(event)">
            <div class="widget-header" onmousedown="onWidgetMouseDown(event)">
                <div class="widget-status" onmousedown="onWidgetMouseDown(event)">
                    <span id="widgetStatusDot" class="widget-indicator"></span>
                    <span class="widget-title">Gotify</span>
                    <span id="widgetBadge" class="widget-badge hidden">0</span>
                </div>
                <div class="widget-actions">
                    <!-- 玻璃透明度调节按钮 -->
                    <button id="widgetOpacityBtn" class="widget-btn" onmousedown="event.stopPropagation()" onclick="toggleOpacityPopover(event)"
                        title="调整玻璃透明度">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"></path>
                        </svg>
                    </button>
                    <!-- 清除通知按钮 -->
                    <button class="widget-btn" onmousedown="event.stopPropagation()" onclick="clearAllNotifications(event)" title="清除通知">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 液态玻璃风格与光学调优弹窗 -->
            <div id="widgetOpacityPopover" class="widget-opacity-popover" style="display: none;"
                onmousedown="event.stopPropagation()">
                <div class="popover-header">
                    <span class="popover-title">💧 液态玻璃 <span id="glassVariantBadge" class="opacity-val-badge">v11</span></span>
                    <div style="display:flex; gap:4px; align-items:center;">
                        <button class="glass-step-btn" id="glassPolarityBtn" onclick="toggleGlassPolarity(event)" title="切换亮色/暗色光学棱镜">☀️亮棱镜</button>
                        <button class="glass-step-btn" onclick="toggleOpacityPopover(event)" title="关闭面板">✕</button>
                    </div>
                </div>

                <!-- 4款精心雕琢的液态玻璃风格（全部基于v11纯正液态透镜引擎衍生） -->
                <div class="glass-style-grid" id="glassStyleGrid">
                    <button class="glass-chip active" data-variant="11" onclick="setGlassVariant(11, event)" title="原生水滴透镜：零模糊纯透折射，保留原生上下高光亮边">💧 晶透水滴</button>
                    <button class="glass-chip" data-variant="13" onclick="setGlassVariant(13, event)" title="深弧透镜：-76 超强折射曲率，28px 光学张力宽弧">🔍 深弧透镜</button>
                    <button class="glass-chip" data-variant="14" onclick="setGlassVariant(14, event)" title="浮光色散：水滴透镜边缘微弱彩虹色散光斑">🌈 浮光色散</button>
                    <button class="glass-chip" data-variant="15" onclick="setGlassVariant(15, event)" title="黑曜水晶：暗调高反差水晶质感，微光边框">💎 黑曜水晶</button>
                </div>

                <div class="glass-desc-bar" id="glassVariantDesc">💧 晶透水滴 · 原生纯正透镜</div>

                <!-- 5项高级光学参数微调 -->
                <div class="tuning-group">
                    <div class="tuning-row">
                        <div class="tuning-label">
                            <span>折射弧度</span>
                            <span class="tuning-hint">(凸透镜曲率)</span>
                        </div>
                        <span class="tuning-val" id="refractValBadge">-50</span>
                    </div>
                    <input type="range" class="opacity-slider" id="refractSlider" min="-90" max="-20" value="-50" step="1"
                        oninput="onRefractSliderInput(event)" onchange="onRefractSliderChange(event)">
                </div>

                <div class="tuning-group">
                    <div class="tuning-row">
                        <div class="tuning-label">
                            <span>磨砂柔焦</span>
                            <span class="tuning-hint">(背景柔和度)</span>
                        </div>
                        <span class="tuning-val" id="blurValBadge">0.0px</span>
                    </div>
                    <input type="range" class="opacity-slider" id="blurSlider" min="0" max="10" value="0" step="0.5"
                        oninput="onBlurSliderInput(event)" onchange="onBlurSliderChange(event)">
                </div>

                <div class="tuning-group">
                    <div class="tuning-row">
                        <div class="tuning-label">
                            <span>反光亮度</span>
                            <span class="tuning-hint">(上下镜面反射)</span>
                        </div>
                        <span class="tuning-val" id="highlightValBadge">100%</span>
                    </div>
                    <input type="range" class="opacity-slider" id="highlightSlider" min="0" max="200" value="100" step="5"
                        oninput="onHighlightSliderInput(event)" onchange="onHighlightSliderChange(event)">
                </div>

                <div class="tuning-group">
                    <div class="tuning-row">
                        <div class="tuning-label">
                            <span>反光厚度</span>
                            <span class="tuning-hint">(光弧纵深高度)</span>
                        </div>
                        <span class="tuning-val" id="arcHeightValBadge">20px</span>
                    </div>
                    <input type="range" class="opacity-slider" id="arcHeightSlider" min="8" max="36" value="20" step="1"
                        oninput="onArcHeightSliderInput(event)" onchange="onArcHeightSliderChange(event)">
                </div>

                <div class="tuning-group">
                    <div class="tuning-row">
                        <div class="tuning-label">
                            <span>底色浓度</span>
                            <span class="tuning-hint">(0%=100%纯原生)</span>
                        </div>
                        <span class="tuning-val" id="opacityValLabel">0%</span>
                    </div>
                    <input type="range" class="opacity-slider" id="widgetOpacitySlider" min="0" max="75" value="0" step="1"
                        oninput="onOpacitySliderInput(event)" onchange="onOpacitySliderChange(event)">
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
                    <button class="glass-step-btn" style="width:100%; text-align:center;" onclick="resetGlassToDefaults(event)">↺ 恢复当前风格默认值</button>
                </div>
            </div>

            <div id="widgetMessageList" class="widget-body" onmousedown="onWidgetMouseDown(event)">
                <div class="widget-empty" onmousedown="onWidgetMouseDown(event)">
                    <div class="widget-empty-icon-wrap" onmousedown="onWidgetMouseDown(event)">
                        <svg class="liquid-bell-icon" width="26" height="26" viewBox="0 0 24 24" fill="none">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor"
                                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="widget-empty-text" onmousedown="onWidgetMouseDown(event)">常驻桌面 · 暂无新通知</div>
                </div>
            </div>
        </div>

        <!-- 右键菜单 -->
        <div id="contextMenu" class="context-menu" onmousedown="event.stopPropagation()">
            <div class="context-menu-item" id="contextMenuPinItem" onclick="toggleWindowAlwaysOnTop(event)">
                <span id="contextMenuPinIcon">📌</span> <span id="contextMenuPinText">悬浮置顶 (前台)</span>
            </div>
            <div class="context-menu-item" onclick="toggleAppShelf(event)">
                <span>🗂️</span> <span>桌面应用盒</span>
            </div>
            <div class="context-menu-item" onclick="toggleOpacityPopover(event)">
                <span>💧</span> <span>液态玻璃调优与预设...</span>
            </div>
            <div class="context-menu-item" onclick="toggleTheme(event)">
                <span id="contextMenuThemeIcon">🌓</span> <span>切换文字深/浅色</span>
            </div>
            <div class="context-menu-item" onclick="snapWindowToEdge('right')">
                <span>👉</span> <span>贴靠屏幕右侧</span>
            </div>
            <div class="context-menu-item" onclick="snapWindowToEdge('left')">
                <span>👈</span> <span>贴靠屏幕左侧</span>
            </div>
            <div class="context-menu-item" onclick="openSettings()">⚙️ <span data-i18n="settings">设置</span></div>
            <div class="context-menu-item" onclick="openGotifyWeb()">🌐 <span data-i18n="openGotify">网页打开 Gotify</span>
            </div>
        </div>
    </div>

    <script>
        // 状态变量
        let notifications = [];
        let serverBaseUrl = '';
        let isWindowAlwaysOnTop = false;
        let floatingOpacity = 0.0;
        let desktopOpacity = 0.0;
        let currentWidgetOpacity = 0.0;
        let currentUnreadEffect = localStorage.getItem('gotify_unread_effect') || 'aurora';
        let unreadBounceConfig = { enabled: true, amplitude: 6 };

        // 4款精心雕琢的液态玻璃风格（全部基于v11纯正液态透镜引擎衍生）
        const GLASS_VARIANTS = [
            { id: 11, label: '💧 晶透水滴', tag: 'v11 水滴', desc: '原生水滴透镜 · 零模糊纯粹清透 (原汁原味)', defaultRefract: -50, defaultBlur: 0.0, defaultHighlight: 100, defaultArcHeight: 20 },
            { id: 13, label: '🔍 深弧透镜', tag: 'v13 深弧', desc: '-76 强力深弧折射 · 凸透镜光学张力', defaultRefract: -76, defaultBlur: 0.0, defaultHighlight: 120, defaultArcHeight: 28 },
            { id: 14, label: '🌈 浮光色散', tag: 'v14 色散', desc: '水滴透镜 · 边缘微弱彩虹色散光斑', defaultRefract: -58, defaultBlur: 0.0, defaultHighlight: 110, defaultArcHeight: 22 },
            { id: 15, label: '💎 黑曜水晶', tag: 'v15 水晶', desc: '深调水晶质感 · 高对比边缘反光', defaultRefract: -65, defaultBlur: 1.5, defaultHighlight: 130, defaultArcHeight: 24 }
        ];

        let currentGlassVariant = (() => {
            const saved = parseInt(localStorage.getItem('liquid_glass_variant'), 10);
            return (Number.isNaN(saved) || saved < 11 || saved > 15 || saved === 12) ? 11 : saved;
        })();

        // 默认使用 Aqua 亮色光学棱镜（isGlassDark = false），使 v11 呈现晶莹剔透的亮白水滴边缘
        let isGlassDark = localStorage.getItem('liquid_glass_dark') === 'true';

        let currentRefract = (() => {
            const saved = parseFloat(localStorage.getItem('liquid_glass_refract'));
            return Number.isNaN(saved) ? null : saved;
        })();

        let currentBlur = (() => {
            const saved = parseFloat(localStorage.getItem('liquid_glass_blur'));
            return Number.isNaN(saved) ? null : saved;
        })();

        let currentHighlight = (() => {
            const saved = parseFloat(localStorage.getItem('liquid_glass_highlight'));
            return Number.isNaN(saved) ? null : saved;
        })();

        let currentArcHeight = (() => {
            const saved = parseFloat(localStorage.getItem('liquid_glass_arc_height'));
            return Number.isNaN(saved) ? null : saved;
        })();

        function getCurrentVariantInfo() {
            return GLASS_VARIANTS.find(v => v.id === currentGlassVariant) || GLASS_VARIANTS[0];
        }

        function updateGlassVariantUI() {
            const info = getCurrentVariantInfo();
            const badge = document.getElementById('glassVariantBadge');
            if (badge) badge.textContent = info.tag || `v${info.id}`;
            const desc = document.getElementById('glassVariantDesc');
            if (desc) desc.textContent = info.desc;
            const polBtn = document.getElementById('glassPolarityBtn');
            if (polBtn) polBtn.textContent = isGlassDark ? '🌙暗棱镜' : '☀️亮棱镜';

            document.querySelectorAll('#glassStyleGrid .glass-chip').forEach(btn => {
                const vid = parseInt(btn.getAttribute('data-variant'), 10);
                if (vid === currentGlassVariant) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // 更新滑块与当前值
            const effectiveRefract = currentRefract !== null ? currentRefract : info.defaultRefract;
            const effectiveBlur = currentBlur !== null ? currentBlur : info.defaultBlur;
            const effectiveHighlight = currentHighlight !== null ? currentHighlight : info.defaultHighlight;
            const effectiveArcHeight = currentArcHeight !== null ? currentArcHeight : (info.defaultArcHeight || 20);

            const rSlider = document.getElementById('refractSlider');
            if (rSlider) rSlider.value = effectiveRefract;
            const rBadge = document.getElementById('refractValBadge');
            if (rBadge) rBadge.textContent = effectiveRefract;

            const bSlider = document.getElementById('blurSlider');
            if (bSlider) bSlider.value = effectiveBlur;
            const bBadge = document.getElementById('blurValBadge');
            if (bBadge) bBadge.textContent = `${effectiveBlur.toFixed(1)}px`;

            const hSlider = document.getElementById('highlightSlider');
            if (hSlider) hSlider.value = effectiveHighlight;
            const hBadge = document.getElementById('highlightValBadge');
            if (hBadge) hBadge.textContent = `${effectiveHighlight}%`;
            document.documentElement.style.setProperty('--glass-highlight-mul', (effectiveHighlight / 100.0).toString());

            const aSlider = document.getElementById('arcHeightSlider');
            if (aSlider) aSlider.value = effectiveArcHeight;
            const aBadge = document.getElementById('arcHeightValBadge');
            if (aBadge) aBadge.textContent = `${effectiveArcHeight}px`;
            document.documentElement.style.setProperty('--glass-arc-height', `${effectiveArcHeight}px`);
        }

        function setGlassVariant(variantId, e) {
            if (e) e.stopPropagation();
            currentGlassVariant = variantId;
            localStorage.setItem('liquid_glass_variant', String(variantId));
            currentRefract = null;
            currentBlur = null;
            currentHighlight = null;
            currentArcHeight = null;
            localStorage.removeItem('liquid_glass_refract');
            localStorage.removeItem('liquid_glass_blur');
            localStorage.removeItem('liquid_glass_highlight');
            localStorage.removeItem('liquid_glass_arc_height');
            updateGlassVariantUI();
            syncNativeLiquidGlass();
            syncGlassTuning();
        }

        function toggleGlassPolarity(e) {
            if (e) e.stopPropagation();
            isGlassDark = !isGlassDark;
            localStorage.setItem('liquid_glass_dark', String(isGlassDark));
            updateGlassVariantUI();
            syncNativeLiquidGlass();
        }

        function onRefractSliderInput(e) {
            currentRefract = parseFloat(e.target.value);
            localStorage.setItem('liquid_glass_refract', String(currentRefract));
            const rBadge = document.getElementById('refractValBadge');
            if (rBadge) rBadge.textContent = currentRefract;
            syncGlassTuning();
        }

        function onRefractSliderChange(e) {
            currentRefract = parseFloat(e.target.value);
            localStorage.setItem('liquid_glass_refract', String(currentRefract));
            syncGlassTuning();
        }

        function onBlurSliderInput(e) {

        function onHighlightSliderInput(e) {

        function onHighlightSliderChange(e) {
            currentHighlight = parseFloat(e.target.value);
            localStorage.setItem('liquid_glass_highlight', String(currentHighlight));
            syncGlassTuning();

        function onArcHeightSliderInput(e) {
            currentArcHeight = parseFloat(e.target.value);

            document.documentElement.style.setProperty('--glass-arc-height', `${currentArcHeight}px`);
