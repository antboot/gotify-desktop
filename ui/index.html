<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gotify 通知</title>
    <style>
        :root {
            /* 日间模式颜色变量 */
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #e8ecf1;
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --border-color: #e5e7eb;
            --shadow: rgba(0, 0, 0, 0.05);
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --empty-text: #9ca3af;
        }

        [data-theme="dark"] {
            /* 夜间模式颜色变量 */
            --bg-primary: #0f1419;
            --bg-secondary: #16181d;
            --bg-gradient-start: #0f1419;
            --bg-gradient-end: #1a1d24;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-tertiary: #6b7280;
            --border-color: #2d3748;
            --shadow: rgba(0, 0, 0, 0.3);
            --accent: #6366f1;
            --accent-hover: #7c3aed;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --card-bg: #1a1d24;
            --header-bg: #16181d;
            --empty-text: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, sans-serif;
            background: var(--bg-primary);
            padding: 0;
            margin: 0;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            padding: 0;
            max-width: 100%;
            position: relative;
            min-height: 100vh;
        }

        .notifications-container {
            display: grid;
            gap: 10px;
            padding: 12px;
            padding-bottom: 70px;
            /* 留出空间给右下角按钮 */
        }

        .theme-toggle {
            position: fixed;
            left: 16px;
            bottom: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px var(--shadow);
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        /* 跟随系统主题时的特殊样式 */
        .theme-toggle.following-system {
            border: 2px solid var(--accent) !important;
            box-shadow: 0 0 8px var(--accent) !important;
            animation: pulse-system-theme 2s infinite;
        }

        @keyframes pulse-system-theme {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        .clear-all-btn {
            position: fixed;
            bottom: 70px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--danger);
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .clear-all-btn:hover {
            background: #dc2626;
            transform: scale(1.1);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .clear-all-btn:active {
            transform: scale(0.95);
        }

        .clear-all-btn.visible {
            display: flex;
        }


        .notification-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 1px 3px var(--shadow);
            animation: slideIn 0.3s ease-out;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .notification-card.pinned {
            background: linear-gradient(135deg, var(--card-bg) 0%, var(--card-bg) 100%);
            border: 2px solid var(--accent);
            box-shadow: 0 2px 8px var(--shadow);
        }

        .notification-card.pinned::after {
            content: '📌';
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 12px;
            opacity: 0.5;
        }

        .notification-card:hover {
            box-shadow: 0 4px 12px var(--shadow);
            transform: translateY(-2px);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .notification-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--accent);
        }

        .notification-card.priority-high::before {
            background: var(--danger);
        }

        .notification-card.priority-medium::before {
            background: var(--warning);
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            padding-left: 20px;
            /* 为置顶图标留出空间 */
        }

        .notification-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            padding-right: 8px;
            line-height: 1.4;
        }

        .notification-time {
            font-size: 12px;
            color: var(--text-tertiary);
            white-space: nowrap;
        }

        .notification-message {
            color: var(--text-secondary);
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 13px;
        }

        .notification-meta {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .notification-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .action-btn.delete:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .priority-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .priority-badge.high {
            background: var(--danger);
            color: white;
        }

        .priority-badge.medium {
            background: var(--warning);
            color: white;
        }

        .priority-badge.low {
            background: var(--success);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--empty-text);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.6;
        }

        .empty-state-text {
            font-size: 14px;
            font-weight: 500;
        }

        .new-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--danger);
            color: white;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* 响应式布局 - 适配更窄的窗口 */
        @media (max-width: 400px) {
            .header h1 {
                font-size: 14px;
            }

            .theme-toggle {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }

            .notification-card {
                padding: 12px;
            }
        }

        /* 滚动条优化 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }
    </style>
</head>

<body>
    <!-- Tauri API 初始化脚本 - 必须在所有脚本之前加载 -->
    <script src="tauri-api.js"></script>
    
    <!-- Tauri v2 事件 API -->
    <script type="module">
        import { listen } from 'https://cdn.jsdelivr.net/npm/@tauri-apps/api@2/event.js';
        window.__TAURI_LISTEN__ = listen;
    </script>



    <div class="container">
        <div id="notifications" class="notifications-container">
            <div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <div class="empty-state-text">暂无通知</div>
            </div>
        </div>

        <!-- 主题切换按钮 - 固定在右下角 -->
        <button class="theme-toggle" onclick="toggleTheme()" title="切换主题 (双击跟随系统)" ondblclick="toggleSystemThemeFollow()">
            <span id="theme-icon">🌙</span>
        </button>

        <!-- 清除全部按钮 -->
        <button id="clearAllBtn" class="clear-all-btn" onclick="clearAllNotifications()" title="清除所有（保留置顶）">
            🗑️
        </button>

    </div>

    <script>
        let notifications = [];
        const notificationsContainer = document.getElementById('notifications');

        // 初始化主题
        function initTheme() {
            // 首先尝试从localStorage获取用户保存的主题偏好
            const savedTheme = localStorage.getItem('theme');

            if (savedTheme) {
                // 如果用户有保存的偏好，使用保存的主题
                document.documentElement.setAttribute('data-theme', savedTheme);
                updateThemeIcon(savedTheme);
                console.log('🎨 使用保存的主题偏好:', savedTheme);
            } else {
                // 如果没有保存的偏好，检测系统主题并设置默认跟随系统
                localStorage.setItem('follow-system-theme', 'true');
                detectSystemTheme();
            }
        }

        // 检测系统主题
        async function detectSystemTheme() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') {
                console.warn('⚠️ Tauri API 不可用，使用默认浅色主题');
                document.documentElement.setAttribute('data-theme', 'light');
                updateThemeIcon('light');
                return;
            }

            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                const systemTheme = await invoke('get_system_theme');
                console.log('🎨 检测到系统主题:', systemTheme);

                document.documentElement.setAttribute('data-theme', systemTheme);
                updateThemeIcon(systemTheme);
            } catch (error) {
                console.error('❌ 获取系统主题失败:', error);
                // 降级到默认浅色主题
                document.documentElement.setAttribute('data-theme', 'light');
                updateThemeIcon('light');
            }
        }

        // 监听系统主题变化
        async function initSystemThemeListener() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') {
                console.warn('⚠️ Tauri API 不可用，无法监听系统主题变化');
                return;
            }

            try {
                console.log('🔄 初始化系统主题监听器...');

                // 使用 Tauri v2 的事件监听 API
                const listen = window.__TAURI_LISTEN__;
                if (typeof listen === 'function') {

                    await listen('tauri://theme-changed', (event) => {
                        console.log('🎨 系统主题已更改:', event.payload);

                        const newTheme = event.payload.theme;
                        const shouldFollowSystem = localStorage.getItem('follow-system-theme') !== 'false';

                        if (shouldFollowSystem) {
                            document.documentElement.setAttribute('data-theme', newTheme);
                            updateThemeIcon(newTheme);
                            console.log('✅ 自动切换到系统主题:', newTheme);
                        } else {
                            console.log('ℹ️ 用户选择不跟随系统主题，忽略系统主题变化');
                        }
                    });

                    console.log('✅ 系统主题监听器已注册');
                } else {
                    console.warn('⚠️ Tauri 事件 API 不可用，无法监听系统主题变化');
                }
            } catch (error) {
                console.error('❌ 初始化系统主题监听器失败:', error);
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            // 保存用户手动切换的主题偏好
            localStorage.setItem('theme', newTheme);
            localStorage.setItem('follow-system-theme', 'false'); // 用户手动切换后，不再跟随系统

            document.documentElement.setAttribute('data-theme', newTheme);
            updateThemeIcon(newTheme);

            console.log('🎨 用户手动切换主题:', newTheme);
        }

        // 启用/禁用系统主题跟随
        function toggleSystemThemeFollow() {
            const shouldFollow = localStorage.getItem('follow-system-theme') !== 'false';

            if (shouldFollow) {
                // 禁用跟随系统主题
                localStorage.setItem('follow-system-theme', 'false');
                console.log('🔄 停止跟随系统主题');

                // 使用当前主题作为自定义主题
                const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
                localStorage.setItem('theme', currentTheme);
            } else {
                // 启用跟随系统主题
                localStorage.setItem('follow-system-theme', 'true');
                localStorage.removeItem('theme'); // 清除自定义主题偏好
                detectSystemTheme(); // 立即应用系统主题
                console.log('🔄 开始跟随系统主题');
            }

            // 更新按钮状态
            updateThemeIcon(document.documentElement.getAttribute('data-theme') || 'light');
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('theme-icon');
            const themeButton = document.querySelector('.theme-toggle');
            const shouldFollowSystem = localStorage.getItem('follow-system-theme') !== 'false';

            if (icon && themeButton) {
                // 根据主题和跟随状态设置图标
                if (shouldFollowSystem) {
                    // 跟随系统主题
                    icon.textContent = theme === 'light' ? '☀️' : '🌙';
                    themeButton.title = `跟随系统主题 (${theme === 'light' ? '浅色' : '深色'}) - 单击切换主题`;
                    themeButton.classList.add('following-system');
                } else {
                    // 用户自定义主题
                    icon.textContent = theme === 'light' ? '🌙' : '☀️';
                    themeButton.title = `自定义主题 (${theme === 'light' ? '浅色' : '深色'}) - 单击切换，双击跟随系统`;
                    themeButton.classList.remove('following-system');
                }
            }
        }

        // 页面加载时初始化主题
        initTheme();

        // 添加右键菜单功能
        function initContextMenu() {
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault(); // 阻止默认右键菜单

                // 显示设置窗口
                showSettingsWindow();

                console.log('🖱️ 右键菜单触发，打开设置界面');
            });
        }

        // 初始化右键菜单
        initContextMenu();



        function isSavedPositionValid(position) {
            if (!position) return false;

            const screenWidth = window.screen?.width || 0;
            const screenHeight = window.screen?.height || 0;

            const offscreenThreshold = -10000;
            const exceedsScreen = screenWidth && screenHeight && (position.x > screenWidth * 2 || position.y > screenHeight * 2);

            return position.x > offscreenThreshold && position.y > offscreenThreshold && !exceedsScreen;
        }

        async function restoreWindowPosition() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') {
                console.warn('⚠️ Tauri API 不可用，无法恢复窗口位置');
                return;
            }

            try {
                const savedPosition = localStorage.getItem('windowPosition');
                if (!savedPosition) {
                    console.log('ℹ️ 没有保存的窗口位置');
                    return;
                }

                const position = JSON.parse(savedPosition);
                const { getCurrentWindow } = window.__TAURI_INTERNALS__.window;
                const appWindow = getCurrentWindow();

                if (!isSavedPositionValid(position)) {
                    console.warn('⚠️ 保存的窗口位置无效，重置到默认位置');
                    localStorage.removeItem('windowPosition');
                    await appWindow.center();
                    await appWindow.setSize({ width: 380, height: 600 });
                    await appWindow.unminimize();
                    await appWindow.show();
                    return;
                }

                const { LogicalPosition } = window.__TAURI_INTERNALS__.window;
                await appWindow.setPosition(new LogicalPosition(position.x, position.y));
                await appWindow.unminimize();
                await appWindow.show();

                console.log('📍 窗口位置已恢复:', position);
            } catch (error) {
                console.error('恢复窗口位置失败:', error);
            }
        }

        // 等待 DOM 和 Tauri 完全加载
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('========================================');
            console.log('DOM 已加载，开始初始化 Tauri 监听器');
            console.log('========================================');

            // 等待一小段时间确保 Tauri API 完全初始化
            await new Promise(resolve => setTimeout(resolve, 100));

            console.log('检查 Tauri API 可用性:');
            console.log('  window.__TAURI__:', typeof window.__TAURI__);
            console.log('  window.__TAURI_INTERNALS__:', typeof window.__TAURI_INTERNALS__);

            // 调试：打印 __TAURI_INTERNALS__ 的所有属性
            if (typeof window.__TAURI_INTERNALS__ !== 'undefined') {
                console.log('🔍 __TAURI_INTERNALS__ 的所有属性:', Object.keys(window.__TAURI_INTERNALS__));
                console.log('🔍 完整对象:', window.__TAURI_INTERNALS__);

                // 检查是否有 invoke 函数
                console.log('🔍 检查全局 invoke:', typeof window.__TAURI_IPC__);
                console.log('🔍 检查全局对象:', {
                    __TAURI__: typeof window.__TAURI__,
                    __TAURI_INTERNALS__: typeof window.__TAURI_INTERNALS__,
                    __TAURI_IPC__: typeof window.__TAURI_IPC__,
                    __TAURI_INVOKE__: typeof window.__TAURI_INVOKE__,
                    ipc: typeof window.ipc
                });

                // 打印 window 上所有以 __TAURI 开头的属性
                const tauriProps = Object.keys(window).filter(k => k.startsWith('__TAURI'));
                console.log('🔍 所有 __TAURI 相关属性:', tauriProps);
                tauriProps.forEach(prop => {
                    console.log(`  ${prop}:`, typeof window[prop]);
                });
            }

            if (typeof window.__TAURI_INTERNALS__ !== 'undefined') {
                console.log('✅ 使用 Tauri v2 API (__TAURI_INTERNALS__)');

                try {
                    // 等待 Tauri v2 事件 API 加载
                    let listen = window.__TAURI_LISTEN__;
                    let retries = 0;
                    while (!listen && retries < 10) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        listen = window.__TAURI_LISTEN__;
                        retries++;
                    }
                    
                    if (typeof listen !== 'function') {
                        console.error('❌ listen 不是函数，类型:', typeof listen);
                        throw new Error('window.__TAURI_LISTEN__ 不可用');
                    }

                    console.log('✅ 成功获取 listen 函数');

                    // 注册 gotify-message 监听器
                    console.log('正在注册 gotify-message 监听器...');
                    const unlisten1 = await listen('gotify-message', (event) => {
                        console.log('🎉🎉🎉 收到 gotify-message 事件！');
                        console.log('事件对象:', event);
                        console.log('事件 payload:', event.payload);
                        console.log('事件 payload 类型:', typeof event.payload);
                        
                        // 确保 payload 存在
                        if (event.payload) {
                            addNotification(event.payload);
                        } else {
                            console.warn('⚠️ 事件 payload 为空');
                        }
                    });
                    console.log('✅ gotify-message 监听器注册成功！');
                    console.log('✅ 监听器已激活，等待接收消息...');

                    // 注册 show-settings 监听器
                    console.log('正在注册 show-settings 监听器...');
                    const unlisten3 = await listen('show-settings', (event) => {
                        console.log('🖥️ 收到 show-settings 事件');
                        showSettingsWindow();
                    });
                    console.log('✅ show-settings 监听器注册成功！');

                    console.log('========================================');
                    console.log('🎊 所有监听器注册完成！等待接收消息...');
                    console.log('========================================');

                    // 在 Tauri API 确认可用后，恢复窗口位置和启动追踪
                    await restoreWindowPosition();
                    await initWindowPositionTracking();

                    // 初始化系统主题监听器
                    await initSystemThemeListener();

                } catch (error) {
                    console.error('❌❌❌ 注册监听器时出错:');
                    console.error('错误对象:', error);
                    console.error('错误消息:', error.message);
                    console.error('错误堆栈:', error.stack);
                    
                    // 即使监听器注册失败，也要显示界面
                    console.log('⚠️ 尝试恢复窗口位置和初始化主题...');
                    try {
                        await restoreWindowPosition();
                        await initWindowPositionTracking();
                        await initSystemThemeListener();
                    } catch (e) {
                        console.error('恢复失败:', e);
                    }
                }
            } else if (typeof window.__TAURI__ !== 'undefined') {
                console.log('⚠️ 检测到 Tauri v1 API，尝试使用 v1 方式');

                try {
                    const { listen } = window.__TAURI__.event;

                    await listen('gotify-message', (event) => {
                        console.log('📬 收到消息 (v1):', event);
                        addNotification(event.payload);
                    });

                    console.log('✅ v1 监听器已设置');
                } catch (error) {
                    console.error('❌❌❌ 注册监听器时出错 (v1):', error);
                }
            } else {
                console.error('❌❌❌ Tauri API 完全不可用！');
                console.error('这不应该发生，请检查是否在浏览器中打开了文件');
            }
        });

        function formatTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;

            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (days > 0) return `${days}天前`;
            if (hours > 0) return `${hours}小时前`;
            if (minutes > 0) return `${minutes}分钟前`;
            return '刚刚';
        }

        function getPriorityClass(priority) {
            if (priority >= 8) return 'high';
            if (priority >= 5) return 'medium';
            return 'low';
        }

        function getPriorityLabel(priority) {
            if (priority >= 8) return '高';
            if (priority >= 5) return '中';
            return '低';
        }

        function renderNotifications() {
            const clearAllBtn = document.getElementById('clearAllBtn');

            if (notifications.length === 0) {
                notificationsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-text">暂无通知</div>
                    </div>
                `;
                if (clearAllBtn) clearAllBtn.classList.remove('visible');
                return;
            }

            // 显示清除按钮
            if (clearAllBtn) clearAllBtn.classList.add('visible');

            // 分离置顶和非置顶通知
            const pinnedNotifs = notifications.filter(n => n.pinned);
            const unpinnedNotifs = notifications.filter(n => !n.pinned);
            const sortedNotifs = [...pinnedNotifs, ...unpinnedNotifs];

            const html = sortedNotifs.map((notif, index) => {
                const priorityClass = getPriorityClass(notif.priority);
                const priorityLabel = getPriorityLabel(notif.priority);
                const timeAgo = formatTime(notif.date);
                const isNew = index === 0 && !notif.pinned && notifications.length > 1;
                const pinnedClass = notif.pinned ? 'pinned' : '';

                return `
                    <div class="notification-card priority-${priorityClass} ${pinnedClass}" data-id="${notif.id}">
                        ${isNew ? '<div class="new-badge">NEW</div>' : ''}
                        <div class="notification-header">
                            <div class="notification-title">${escapeHtml(notif.title)}</div>
                            <div class="notification-time">${timeAgo}</div>
                        </div>
                        <div class="notification-message">${escapeHtml(notif.message)}</div>
                        <div class="notification-meta">
                            <div>
                                <span class="priority-badge ${priorityClass}">优先级: ${priorityLabel}</span>
                                <span style="margin-left: 8px;">ID: ${notif.id}</span>
                            </div>
                            <div class="notification-actions">
                                <button class="action-btn" onclick="togglePin(${notif.id}, event)" title="${notif.pinned ? '取消置顶' : '置顶'}">
                                    ${notif.pinned ? '📍' : '📌'}
                                </button>
                                <button class="action-btn delete" onclick="deleteNotification(${notif.id}, event)" title="删除">
                                    ✖️
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            notificationsContainer.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addNotification(notif) {
            console.log('📨 收到通知:', notif);
            // 添加 pinned 属性，默认为 false
            notif.pinned = false;
            notifications.unshift(notif);

            // 只保留最近50条
            if (notifications.length > 50) {
                notifications = notifications.slice(0, 50);
            }

            renderNotifications();

            // 播放声音（可选）
            // new Audio('notification.mp3').play();
        }

        // 置顶/取消置顶通知
        function togglePin(id, event) {
            event.stopPropagation();
            const notif = notifications.find(n => n.id === id);
            if (notif) {
                notif.pinned = !notif.pinned;
                renderNotifications();
                console.log(`📌 通知 ${id} ${notif.pinned ? '已置顶' : '取消置顶'}`);
            }
        }

        // 删除单条通知
        function deleteNotification(id, event) {
            event.stopPropagation();
            const index = notifications.findIndex(n => n.id === id);
            if (index !== -1) {
                notifications.splice(index, 1);
                console.log(`🗑️ 通知 ${id} 已删除`);
            }
        }

        // 清除所有通知（保留置顶）
        function clearAllNotifications() {
            const pinnedNotifs = notifications.filter(n => n.pinned);
            notifications = pinnedNotifs;
            renderNotifications();
            console.log('🗑️ 已清除所有非置顶通知');
            return;
        }

        // 显示设置窗口
        async function showSettingsWindow() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') {
                console.warn('⚠️ Tauri API 不可用，无法显示设置窗口');
                return;
            }

            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('show_settings_window');
                console.log('✅ 设置窗口已显示');
            } catch (error) {
                console.error('❌ 显示设置窗口失败:', error);
            }
        }

        // 窗口位置跟踪
        let savePositionTimeout;

        async function initWindowPositionTracking() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;

            try {
                console.log('🪟 初始化窗口位置跟踪...');

                // 使用 Tauri v2 的事件监听 API
                const listen = window.__TAURI_LISTEN__;
                if (typeof listen === 'function') {

                    // 监听窗口移动事件
                    await listen('tauri://move', (event) => {
                        console.log('🪟 窗口移动事件');
                        saveWindowPositionDebounced();
                    });

                    // 监听窗口调整大小事件
                    await listen('tauri://resize', (event) => {
                        console.log('🪟 窗口调整大小事件');
                        saveWindowPositionDebounced();
                    });

                    console.log('✅ 窗口事件监听器已注册');
                } else {
                    console.warn('⚠️ Tauri 事件 API 不可用，仅在关闭时保存');
                }

                // 页面关闭时保存
                window.addEventListener('beforeunload', saveWindowPosition);

                console.log('✅ 窗口位置跟踪已初始化');
            } catch (error) {
                console.error('初始化窗口位置跟踪失败:', error);
            }
        }

        // 防抖保存函数
        function saveWindowPositionDebounced() {
            clearTimeout(savePositionTimeout);
            savePositionTimeout = setTimeout(() => {
                console.log('💾 防抖保存窗口位置');
                saveWindowPosition();
            }, 1000); // 1秒后保存
        }

        async function saveWindowPosition() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;

            try {
                const { invoke } = window.__TAURI_INTERNALS__;

                console.log('💾 自动保存窗口位置...');

                // 让后端直接获取窗口位置
                await invoke('save_window_position_auto');

                console.log('✅ 窗口位置保存完成');
            } catch (error) {
                console.error('❌ 保存窗口位置失败:', error);
            }
        }

        // 每分钟更新一次时间显示
        setInterval(() => {
            const timeElements = document.querySelectorAll('.notification-time');
            notifications.forEach((notif, index) => {
                if (timeElements[index]) {
                    timeElements[index].textContent = formatTime(notif.date);
                }
            });
        }, 60000);

        // 重新连接WebSocket
        async function reconnectWebSocket() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;

            try {
                const { invoke } = window.__TAURI_INTERNALS__;

                // 停止当前连接
                await invoke('stop_websocket');

                // 重新启动连接
                await invoke('start_websocket');

                console.log('🔄 WebSocket 重新连接完成');
            } catch (error) {
                console.error('❌ 重新连接失败:', error);
            }
        }

        // 监听配置保存事件
        window.addEventListener('message', async (event) => {
            if (event.data === 'config-saved') {
                console.log('📝 配置已保存，重新连接...');
                await reconnectWebSocket();
            }
        });
    </script>
</body>

</html>
