        function onArcHeightSliderChange(e) {
            currentArcHeight = parseFloat(e.target.value);
            localStorage.setItem('liquid_glass_arc_height', String(currentArcHeight));
            syncGlassTuning();
        }

        function resetGlassToDefaults(e) {
            if (e) e.stopPropagation();
            currentRefract = null;
            currentBlur = null;
            currentHighlight = null;
            currentArcHeight = null;
            localStorage.removeItem('liquid_glass_refract');
            localStorage.removeItem('liquid_glass_blur');
            localStorage.removeItem('liquid_glass_highlight');
            localStorage.removeItem('liquid_glass_arc_height');
            updateGlassVariantUI();
            syncNativeLiquidGlass();
            syncGlassTuning();
        }

        // 同步 macOS 原生液态玻璃调优参数（折射曲率、柔焦高斯模糊、反光亮度、反光厚度）
        const syncGlassTuning = () => {
            const info = getCurrentVariantInfo();
            const r = currentRefract !== null ? currentRefract : info.defaultRefract;
            const b = currentBlur !== null ? currentBlur : info.defaultBlur;
            const h = (currentHighlight !== null ? currentHighlight : info.defaultHighlight) / 100.0;
            const a = currentArcHeight !== null ? currentArcHeight : (info.defaultArcHeight || 20);
            document.documentElement.style.setProperty('--glass-highlight-mul', h.toString());
            document.documentElement.style.setProperty('--glass-arc-height', `${a}px`);
            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    window.__TAURI_INTERNALS__.invoke('tune_widget_glass', {
                        refraction: r,
                        blur: b,
                        highlight: h,
                        arcHeight: a
                    }).catch(() => {});
                }
            } catch (_) {}
        };

        try {
            const storedBounce = localStorage.getItem('gotify_unread_bounce');
            if (storedBounce) {
                const parsed = JSON.parse(storedBounce);
                if (parsed && typeof parsed.enabled === 'boolean') unreadBounceConfig.enabled = parsed.enabled;
                if (parsed && typeof parsed.amplitude === 'number') unreadBounceConfig.amplitude = parsed.amplitude;
            }
        } catch (_) {}

        // 窗口置顶 vs 常驻桌面 UI 更新
        function updatePinButtonUI(pinned) {
            isWindowAlwaysOnTop = !!pinned;
            const contextPinIcon = document.getElementById('contextMenuPinIcon');
            const contextPinText = document.getElementById('contextMenuPinText');
            if (contextPinText) {
                contextPinText.textContent = isWindowAlwaysOnTop ?
                    ((typeof t === 'function' ? t('unpinWindow') : null) || '常驻桌面 (底层)') :
                    ((typeof t === 'function' ? t('pinWindow') : null) || '悬浮置顶 (前台)');
            }
            if (contextPinIcon) {
                contextPinIcon.textContent = isWindowAlwaysOnTop ? '🖥️' : '📌';
            }

            const savedTint = localStorage.getItem('widget_glass_tint_alpha');
            const targetOpacity = savedTint !== null ? parseFloat(savedTint) : 0.0;
            setWidgetOpacity(Number.isNaN(targetOpacity) ? 0.0 : targetOpacity, false, true);
        }

        async function initWindowAlwaysOnTop() {
            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    const pinned = await window.__TAURI_INTERNALS__.invoke('get_window_always_on_top');
                    updatePinButtonUI(pinned);
                    console.log('📌 初始窗口置顶/常驻状态:', pinned);
                }
            } catch (e) {
                console.warn('⚠️ 获取初始窗口置顶状态失败:', e);
            }
        }

        async function toggleWindowAlwaysOnTop(event) {
            if (event) {
                if (typeof event.preventDefault === 'function') event.preventDefault();
                if (typeof event.stopPropagation === 'function') event.stopPropagation();
            }
            const menu = document.getElementById('contextMenu');
            if (menu) menu.style.display = 'none';

            const targetState = !isWindowAlwaysOnTop;
            updatePinButtonUI(targetState);

            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    const result = await window.__TAURI_INTERNALS__.invoke('set_window_always_on_top', { alwaysOnTop: targetState });
                    updatePinButtonUI(result);
                    console.log('📌 窗口置顶/常驻状态已切换:', result);
                }
            } catch (e) {
                console.error('❌ 切换窗口置顶失败:', e);
                updatePinButtonUI(!targetState);
            }
        }

        async function toggleAppShelf(event) {
            if (event) {
                if (typeof event.preventDefault === 'function') event.preventDefault();
                if (typeof event.stopPropagation === 'function') event.stopPropagation();
            }
            const menu = document.getElementById('contextMenu');
            if (menu) menu.style.display = 'none';

            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    await window.__TAURI_INTERNALS__.invoke('toggle_app_shelf_window');
                }
            } catch (e) {
                console.error('❌ 切换应用盒失败:', e);
            }
        }

        // 桌面小组件窗口拖拽与点击激活处理
        let isWidgetMouseDown = false;
        let widgetDragStartX = 0;
        let widgetDragStartY = 0;
        const WIDGET_DRAG_THRESHOLD = 4;

        // 点击小组件任意区域时，立即将窗口提升至前台并持续保持磨砂半透明状态（至少 3 秒）
        let activeHoldTimer = null;
        let isMouseInsideCard = false;
        let glassEnabled = true;

        const syncNativeLiquidGlass = (activeOverride) => {
            const nextGlass = typeof activeOverride === 'boolean' ? activeOverride : glassEnabled;
            glassEnabled = nextGlass;
            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    window.__TAURI_INTERNALS__.invoke('set_widget_glass', {
                        enabled: nextGlass,
                        opacity: currentWidgetOpacity,
                        isDark: isGlassDark,
                        variant: currentGlassVariant
                    }).catch(() => {});
                }
            } catch (_) {}
            syncGlassTuning();
        };

        const updateGlassSpecularPoint = (x, y) => {
            const card = document.getElementById('desktopWidgetView');
            if (!card || typeof x !== 'number' || typeof y !== 'number' || x < 0 || y < 0) return;
            card.style.setProperty('--glass-mouse-x', `${Math.round(x)}px`);
            card.style.setProperty('--glass-mouse-y', `${Math.round(y)}px`);
        };

        const setWidgetActiveState = (active) => {
            const card = document.getElementById('desktopWidgetView');
            if (!card) return;
            if (active) {
                card.classList.add('is-active', 'is-focused');
            } else {
                card.classList.remove('is-active', 'is-focused');
                // 空闲后主动沉降回桌面底层（小组件窗口不再成为 key 窗口，依赖不到失焦事件）
                try {
                    if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                        window.__TAURI_INTERNALS__.invoke('deactivate_widget_window').catch(() => {});
                    }
                } catch (_) {}
                // 回到平态时重新下发用户的液态玻璃调优参数（反光亮度等）：
                // 激活瞬间 Apple 会用默认高光覆盖原生玻璃的镜面层，需要在这里写回
                syncGlassTuning();
            }
        };

        const keepActive = (duration = 3000) => {
            setWidgetActiveState(true);
            clearTimeout(activeHoldTimer);
            activeHoldTimer = setTimeout(() => {
                if (!isMouseInsideCard) {
                    setWidgetActiveState(false);
                }
            }, duration);
        };

        const activateWidgetWindow = () => {
            keepActive(3000);
            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    window.__TAURI_INTERNALS__.invoke('activate_widget_window').catch(() => {});
                }
            } catch (_) {}
        };

        window.addEventListener('mousedown', activateWidgetWindow, true);
        window.addEventListener('pointerdown', activateWidgetWindow, true);

        // 鼠标移入小组件时更新焦散光斑
        window.addEventListener('mouseenter', (e) => {
            isMouseInsideCard = true;
            if (e) updateGlassSpecularPoint(e.clientX, e.clientY);
            keepActive(3000);
        });
        window.addEventListener('mousemove', (e) => {
            if (!isMouseInsideCard) {
                isMouseInsideCard = true;
            }
            if (e) updateGlassSpecularPoint(e.clientX, e.clientY);
        });
        window.addEventListener('mouseleave', () => {
            isMouseInsideCard = false;
            // 鼠标移出后，再保持 3 秒才恢复平态
            keepActive(3000);
        });

        // 窗口真实焦点变化由后端逐窗口精确派发
        const onWindowFocusChanged = (focused) => {
            if (focused) {
                keepActive(3000);
            } else {
                clearTimeout(activeHoldTimer);
                activeHoldTimer = setTimeout(() => {
                    if (!isMouseInsideCard) {
                        setWidgetActiveState(false);
                    }
                }, 3000);
            }
        };

        function onWidgetMouseDown(event) {
            if (!event || event.button !== 0) return;
            // 点击空白处时若菜单打开，立即关闭右键菜单
            const menu = document.getElementById('contextMenu');
            if (menu && menu.style.display !== 'none' && !menu.contains(event.target)) {
                menu.style.display = 'none';
            }
            // 排除交互控件：只排除真正的按钮、滑块、弹窗、右键菜单及通知条目展开
            if (event.target.closest('button') ||
                event.target.closest('.widget-btn') ||
                event.target.closest('.widget-mini-btn') ||
                event.target.closest('#widgetOpacityPopover') ||
                event.target.closest('#contextMenu') ||
                event.target.closest('.context-menu') ||
                event.target.closest('.context-menu-item') ||
                event.target.closest('.widget-item')
            ) {
                return;
            }

            activateWidgetWindow();
            isWidgetMouseDown = true;
            widgetDragStartX = event.screenX;
            widgetDragStartY = event.screenY;
        }

        window.addEventListener('mousemove', (event) => {
            if (!isWidgetMouseDown) return;
            if ((event.buttons & 1) !== 1) {
                isWidgetMouseDown = false;
                return;
            }
            const dx = Math.abs(event.screenX - widgetDragStartX);
            const dy = Math.abs(event.screenY - widgetDragStartY);
            if (dx >= WIDGET_DRAG_THRESHOLD || dy >= WIDGET_DRAG_THRESHOLD) {
                isWidgetMouseDown = false;
                try {
                    if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                        window.__TAURI_INTERNALS__.invoke('start_dragging_window').catch(() => {});
                    }
                } catch (e) {
                    console.warn('拖动小组件失败:', e);
                }
            }
        });

        window.addEventListener('mouseup', () => {
            isWidgetMouseDown = false;
        });

        // 底色叠加浓度管理 (0.0 = 100% 纯原生 NSGlassEffectView)
        function setWidgetOpacity(opacity, persist = true, animate = false) {
            const parsed = parseFloat(opacity);
            const val = Math.max(0.0, Math.min(0.85, Number.isNaN(parsed) ? 0.0 : parsed));
            currentWidgetOpacity = val;
            if (isWindowAlwaysOnTop) {
                floatingOpacity = val;
            } else {
                desktopOpacity = val;
            }

            if (animate) {
                const card = document.querySelector('.desktop-widget-card');
                if (card) {
                    card.classList.add('is-transitioning');
                    clearTimeout(card._transTimer);
                    card._transTimer = setTimeout(() => {
                        card.classList.remove('is-transitioning');
                    }, 400);
                }
            }

            document.documentElement.style.setProperty('--glass-tint-alpha', val.toString());
            document.documentElement.style.setProperty('--widget-opacity', val.toString());

            // 同步更新 macOS 原生 NSGlassEffectView 的风格与色调参数
            syncNativeLiquidGlass();

            const percent = Math.round(val * 100);
            const label = document.getElementById('opacityValLabel');
            if (label) label.textContent = `${percent}%`;

            const slider = document.getElementById('widgetOpacitySlider');
            if (slider) slider.value = percent;

            document.querySelectorAll('.preset-chip').forEach(btn => {
                btn.classList.remove('active');
            });
            const matchedChip = Array.from(document.querySelectorAll('.preset-chip')).find(btn => {
                return btn.textContent.includes(`${percent}%`);
            });
            if (matchedChip) matchedChip.classList.add('active');

            if (persist) {
                localStorage.setItem('widget_glass_tint_alpha', String(val));
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    const mode = isWindowAlwaysOnTop ? 'floating' : 'desktop';
                    window.__TAURI_INTERNALS__.invoke('set_widget_mode_opacity', { mode, opacity: val }).catch(err => {
                        console.warn('保存模式透明度失败:', err);
                    });
                }
            }
        }

        function toggleOpacityPopover(event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById('contextMenu');
            if (menu) menu.style.display = 'none';
            const popover = document.getElementById('widgetOpacityPopover');
            const btn = document.getElementById('widgetOpacityBtn');
            if (!popover) return;
            const isVisible = popover.style.display !== 'none';
            if (isVisible) {
                popover.style.display = 'none';
                if (btn) btn.classList.remove('active');
            } else {
                updateGlassVariantUI();
                popover.style.display = 'flex';
                if (btn) btn.classList.add('active');
            }
        }

        function onOpacitySliderInput(event) {
            const percent = parseInt(event.target.value, 10);
            setWidgetOpacity((Number.isNaN(percent) ? 0 : percent) / 100, false, false);
        }

        function onOpacitySliderChange(event) {
            const percent = parseInt(event.target.value, 10);
            setWidgetOpacity((Number.isNaN(percent) ? 0 : percent) / 100, true, false);
        }

        function applyOpacityPreset(val) {
            setWidgetOpacity(val, true, true);
        }

        function cycleWidgetOpacity(event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById('contextMenu');
            if (menu) menu.style.display = 'none';

            const levels = [0.0, 0.20, 0.45, 0.75];
            let nextIndex = 0;
            for (let i = 0; i < levels.length; i++) {
                if (Math.abs(currentWidgetOpacity - levels[i]) < 0.08) {
                    nextIndex = (i + 1) % levels.length;
                    break;
                }
            }
            setWidgetOpacity(levels[nextIndex], true, true);
        }

        window.addEventListener('mousedown', (e) => {
            const popover = document.getElementById('widgetOpacityPopover');
            const btn = document.getElementById('widgetOpacityBtn');
            if (popover && popover.style.display !== 'none') {
                if (!popover.contains(e.target) && (!btn || !btn.contains(e.target))) {
                    popover.style.display = 'none';
                    if (btn) btn.classList.remove('active');
                }
            }
        });

        function copyNotificationText(id, event) {
            if (event) event.stopPropagation();
            const notif = notifications.find(n => n.id === id);
            if (notif && notif.message) {
                navigator.clipboard.writeText(notif.message).then(() => {
                    console.log('✅ 已复制通知内容');
                }).catch(err => {
                    console.warn('复制失败:', err);
                });
            }
        }

        // 未读通知特效与独立律动弹跳
        function applyBounceAmplitude(amp) {
            const a = Math.max(2, Math.min(24, parseInt(amp, 10) || 6));
            document.documentElement.style.setProperty('--bounce-amp', `-${a}px`);
            document.documentElement.style.setProperty('--bounce-amp-sub', `-${Math.round(a * 0.42)}px`);
            document.documentElement.style.setProperty('--bounce-amp-micro', `-${Math.max(1, Math.round(a * 0.16))}px`);
        }

        async function initUnreadBounce() {
            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    const cfg = await window.__TAURI_INTERNALS__.invoke('get_unread_bounce');
                    if (cfg) {
                        if (typeof cfg.enabled === 'boolean') unreadBounceConfig.enabled = cfg.enabled;
                        if (typeof cfg.amplitude === 'number') unreadBounceConfig.amplitude = cfg.amplitude;
                        localStorage.setItem('gotify_unread_bounce', JSON.stringify(unreadBounceConfig));
                    }
                }
            } catch (e) {
                console.warn('获取未读弹跳失败:', e);
            }

            applyBounceAmplitude(unreadBounceConfig.amplitude);

            window.addEventListener('storage', (e) => {
                if (e.key === 'gotify_unread_bounce' && e.newValue) {
                    try {
                        const parsed = JSON.parse(e.newValue);
                        setUnreadBounce(parsed.enabled, parsed.amplitude);
                    } catch (_) {}
                }
            });
        }

        function setUnreadBounce(enabled, amplitude) {
            unreadBounceConfig = {
                enabled: typeof enabled === 'boolean' ? enabled : true,
                amplitude: typeof amplitude === 'number' ? amplitude : 6
            };
            applyBounceAmplitude(unreadBounceConfig.amplitude);
            renderWidgetNotifications();
        }

        async function initUnreadEffect() {
            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    const effect = await window.__TAURI_INTERNALS__.invoke('get_unread_effect');
                    if (effect) {
                        currentUnreadEffect = effect;
                        localStorage.setItem('gotify_unread_effect', effect);
                    }
                }
            } catch (e) {
                console.warn('获取未读特效失败:', e);
            }

            window.addEventListener('storage', (e) => {
                if (e.key === 'gotify_unread_effect' && e.newValue) {
                    setUnreadEffect(e.newValue);
                }
            });
        }

        function setUnreadEffect(effect) {
            currentUnreadEffect = effect || 'aurora';
            localStorage.setItem('gotify_unread_effect', currentUnreadEffect);
            renderWidgetNotifications();
        }

        function markNotificationRead(id, el) {
            const notif = notifications.find(n => n.id === id);
            if (!notif || !notif.unread) return;

            notif.unread = false;

            const card = el || document.querySelector(`.widget-item[data-id="${id}"]`);
            if (card) {
                card.classList.add('unread-marked-read');
                setTimeout(() => {
                    const effectClasses = [
                        'unread-effect-aurora',
                        'unread-effect-pulse',
                        'unread-effect-beacon',
                        'unread-effect-ripple',
                        'unread-effect-border_stream',
                        'unread-bounce-active'
                    ];
                    card.classList.remove(...effectClasses);
                }, 350);
            }
        }

        // 渲染小组件通知列表
        function renderWidgetNotifications() {
            const listEl = document.getElementById('widgetMessageList');
            const badgeEl = document.getElementById('widgetBadge');
            if (!listEl) return;

            if (badgeEl) {
                if (typeof notifications !== 'undefined' && notifications && notifications.length > 0) {
                    badgeEl.textContent = notifications.length;
                    badgeEl.classList.remove('hidden');
                } else {
                    badgeEl.classList.add('hidden');
                }
            }

            if (typeof notifications === 'undefined' || !notifications || notifications.length === 0) {
                if (listEl.querySelector('.widget-empty')) {
                    // 若已处于暂无通知状态，无需重复销毁重建 DOM，避免触发 WebKit 重排与合成层刷新
                    return;
                }
                listEl.innerHTML = `
                    <div class="widget-empty" onmousedown="onWidgetMouseDown(event)">
                        <div class="widget-empty-icon-wrap" onmousedown="onWidgetMouseDown(event)">
                            <svg class="liquid-bell-icon" width="26" height="26" viewBox="0 0 24 24" fill="none">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div class="widget-empty-text">常驻桌面 · 暂无新通知</div>
                    </div>
                `;
                return;
            }

            const sortedNotifs = [...notifications].sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return new Date(b.date) - new Date(a.date);
            });

            listEl.innerHTML = sortedNotifs.map(notif => {
                const timeAgo = formatTime(notif.date);
                const priorityClass = getPriorityClass(notif.priority);
                const pinnedClass = notif.pinned ? 'pinned' : '';
                const expandedClass = notif.expanded ? 'expanded' : '';
                const unreadEffectClass = (notif.unread && currentUnreadEffect && currentUnreadEffect !== 'none')
                    ? `unread-effect-${currentUnreadEffect}`
                    : '';
                const unreadBounceClass = (notif.unread && unreadBounceConfig.enabled)
                    ? 'unread-bounce-active'
                    : '';

                return `
                    <div class="widget-item priority-${priorityClass} ${pinnedClass} ${expandedClass} ${unreadEffectClass} ${unreadBounceClass}" data-id="${notif.id}" onclick="toggleExpand(${notif.id})" onmouseenter="markNotificationRead(${notif.id}, this)" title="${notif.expanded ? '点击收起详情' : '点击展开查看详情'}">
                        <div class="widget-item-header">
                            <span class="widget-item-title">${escapeHtml(notif.title || 'Gotify 通知')}</span>
                            <div class="widget-item-meta">
                                ${notif.pinned ? '<span class="widget-pin-icon" title="已置顶">📌</span>' : ''}
                                <span class="widget-item-time">${timeAgo}</span>
                            </div>
                        </div>
                        <div class="widget-item-desc" id="widget-msg-${notif.id}">
                            ${notif.expanded ? renderMessage(notif) : escapeHtml((notif.message || '').replace(/<[^>]*>?/gm, ''))}
                        </div>
                        ${notif.expanded ? `
                            <div class="widget-item-actions" onclick="event.stopPropagation()">
                                <button class="widget-mini-btn" onclick="togglePin(${notif.id}, event)" title="${notif.pinned ? '取消置顶' : '置顶'}">
                                    ${notif.pinned ? '📍 取消置顶' : '📌 置顶'}
                                </button>
                                <button class="widget-mini-btn" onclick="copyNotificationText(${notif.id}, event)" title="复制消息内容">
                                    📋 复制
                                </button>
                                <button class="widget-mini-btn delete" onclick="deleteNotification(${notif.id}, event)" title="删除此通知">
                                    🗑️ 删除
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function updateTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.dataset.i18n);
            });
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                el.title = t(el.dataset.i18nTitle);
            });
            updatePinButtonUI(isWindowAlwaysOnTop);
        }

        // 主题管理
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                syncNativeLiquidGlass();
            } else {
                localStorage.setItem('follow-system-theme', 'true');
                detectSystemTheme();
            }
        }

        async function detectSystemTheme() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') {
                document.documentElement.setAttribute('data-theme', 'dark');
                return;
            }
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                const systemTheme = await invoke('get_system_theme');
                document.documentElement.setAttribute('data-theme', systemTheme);
                syncNativeLiquidGlass();
            } catch (error) {
                document.documentElement.setAttribute('data-theme', 'dark');
                syncNativeLiquidGlass();
            }
        }

        async function initSystemThemeListener() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            try {
                const listen = window.__TAURI_LISTEN__;
                if (typeof listen === 'function') {
                    await listen('tauri://theme-changed', (event) => {
                        const newTheme = event.payload.theme;
                        const shouldFollowSystem = localStorage.getItem('follow-system-theme') !== 'false';
                        if (shouldFollowSystem) {
                            document.documentElement.setAttribute('data-theme', newTheme);
                            syncNativeLiquidGlass();
                        }
                    });
                }
            } catch (error) {
                console.error('❌ 初始化系统主题监听器失败:', error);
            }
        }

        function toggleTheme(event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById('contextMenu');
            if (menu) menu.style.display = 'none';

            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', newTheme);
            localStorage.setItem('follow-system-theme', 'false');
            document.documentElement.setAttribute('data-theme', newTheme);
            syncNativeLiquidGlass();
            console.log('🎨 切换主题:', newTheme);
        }

        initTheme();

        // 右键菜单
        function initContextMenu() {
            const menu = document.getElementById('contextMenu');
            document.addEventListener('contextmenu', function (e) {
                if (window.getSelection && window.getSelection().toString().length > 0) return;
                e.preventDefault();
                menu.style.display = 'block';
                const menuW = menu.offsetWidth || 180;
                const menuH = menu.offsetHeight || 180;
                let x = e.clientX, y = e.clientY;
                if (x + menuW > window.innerWidth) x = window.innerWidth - menuW - 8;
                if (y + menuH > window.innerHeight) y = window.innerHeight - menuH - 8;
                if (x < 0) x = 8;
                if (y < 0) y = 8;
                menu.style.left = x + 'px';
                menu.style.top = y + 'px';
            });

            // 捕获阶段拦截 pointerdown，无论哪个子元素阻止冒泡，点击外部都能立即收起菜单
            window.addEventListener('pointerdown', function (e) {
                if (menu && menu.style.display !== 'none' && !menu.contains(e.target)) {
                    menu.style.display = 'none';
                }
            }, { capture: true });

            document.addEventListener('click', function () {
                if (menu) menu.style.display = 'none';
            });

            window.addEventListener('blur', function () {
                if (menu) menu.style.display = 'none';
                const popover = document.getElementById('widgetOpacityPopover');
                if (popover && popover.style.display !== 'none') {
                    popover.style.display = 'none';
                    const btn = document.getElementById('widgetOpacityBtn');
                    if (btn) btn.classList.remove('active');
                }
            });
        }
        initContextMenu();
        updateTranslations();
        initWindowAlwaysOnTop();

        function openSettings() {
            const menu = document.getElementById('contextMenu');
            if (menu) menu.style.display = 'none';
            showSettingsWindow();
        }

        async function openGotifyWeb() {
            const menu = document.getElementById('contextMenu');
            if (menu) menu.style.display = 'none';
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                const config = await invoke('get_config');
                if (config && config.server_url) {
                    await invoke('plugin:shell|open', { path: config.server_url });
                }
            } catch (error) {
                console.error('❌ 打开网页失败:', error);
            }
        }

        // DOM 加载完成与事件监听绑定
        document.addEventListener('DOMContentLoaded', async () => {
            await new Promise(resolve => setTimeout(resolve, 80));

            if (typeof window.__TAURI_INTERNALS__ !== 'undefined') {
                try {
                    let listen = window.__TAURI_LISTEN__;
                    let retries = 0;
                    while (!listen && retries < 10) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        listen = window.__TAURI_LISTEN__;
                        retries++;
                    }

                    if (typeof listen === 'function') {
                        // 1. gotify-message
                        await listen('gotify-message', (event) => {
                            if (event.payload) {
                                addNotification(event.payload);
                            }
                        });

                        // 2. show-settings
                        await listen('show-settings', () => {
                            showSettingsWindow();
                        });

                        // 3. websocket-status
                        await listen('websocket-status', (event) => {
                            updateConnectionStatus(event.payload);
                        });

                        // 4. always-on-top-changed
                        await listen('tauri://always-on-top-changed', (event) => {
                            if (event && event.payload && typeof event.payload.always_on_top === 'boolean') {
                                updatePinButtonUI(event.payload.always_on_top);
                            }
                        });

                        // 5. unread-effect-changed
                        await listen('tauri://unread-effect-changed', (event) => {
                            if (event && event.payload && typeof event.payload.effect === 'string') {
                                setUnreadEffect(event.payload.effect);
                            }
                        });

                        // 6. unread-bounce-changed
                        await listen('tauri://unread-bounce-changed', (event) => {
                            if (event && event.payload) {
                                setUnreadBounce(event.payload.enabled, event.payload.amplitude);
                            }
                        });

                        // 7. native-mouse-hover (全局无焦鼠标滑过标记已阅 + 同步悬停状态 + 液态高光跟随)
                        // 注意：必须显式指定 target 为本窗口，否则 Tauri 对默认 Any 目标的监听器不做过滤，事件会串到应用盒
                        await listen('native-mouse-hover', (event) => {
                            if (!event || !event.payload) return;
                            const { x, y, inside } = event.payload;
                            if (inside) {
                                updateGlassSpecularPoint(x, y);
                            }
                            if (typeof inside === 'boolean' && inside !== isMouseInsideCard) {
                                isMouseInsideCard = inside;
                                keepActive(3000);
                                syncGlassTuning();
                                if (inside === false) {
                                    // 鼠标离开立即沉回桌面底层（与应用盒一致的逻辑）
                                    try {
                                        window.__TAURI_INTERNALS__.invoke('deactivate_widget_window').catch(() => {});
                                    } catch (_) {}
                                }
                            }
                            if (inside === false) return;
                            if (!notifications.some(n => n.unread)) return;
                            const el = document.elementFromPoint(x, y);
                            if (!el) return;
                            const card = el.closest('.widget-item');
                            if (card && card.dataset.id) {
                                const id = parseInt(card.dataset.id, 10);
                                markNotificationRead(id, card);
                            }
                        }, { target: { kind: 'WebviewWindow', label: 'main' } });

                        // 8. widget-focus (后端逐窗口派发的真实窗口焦点变化)
                        await listen('widget-focus', (event) => {
                            const focused = !!(event && event.payload && event.payload.focused);
                            onWindowFocusChanged(focused);
                        }, { target: { kind: 'WebviewWindow', label: 'main' } });
                    }

                    // 加载初始液态玻璃配置
                    updateGlassVariantUI();
                    syncGlassTuning();
                    window.addEventListener('storage', (e) => {
                        if (e.key === 'liquid_glass_variant' && e.newValue !== null) {
                            const v = parseInt(e.newValue, 10);
                            if (!Number.isNaN(v) && v !== currentGlassVariant && GLASS_VARIANTS.some(item => item.id === v)) {
                                currentGlassVariant = v;
                                currentRefract = null;
                                currentBlur = null;
                                currentHighlight = null;
                                currentArcHeight = null;
                                updateGlassVariantUI();
                                syncNativeLiquidGlass();
                                syncGlassTuning();
                            }
                        } else if (e.key === 'liquid_glass_dark' && e.newValue !== null) {
                            isGlassDark = e.newValue === 'true';
                            updateGlassVariantUI();
                            syncNativeLiquidGlass();
                        } else if (e.key === 'liquid_glass_refract' || e.key === 'liquid_glass_blur' || e.key === 'liquid_glass_highlight' || e.key === 'liquid_glass_arc_height') {
                            currentRefract = localStorage.getItem('liquid_glass_refract') !== null ? parseFloat(localStorage.getItem('liquid_glass_refract')) : null;
                            currentBlur = localStorage.getItem('liquid_glass_blur') !== null ? parseFloat(localStorage.getItem('liquid_glass_blur')) : null;
                            currentHighlight = localStorage.getItem('liquid_glass_highlight') !== null ? parseFloat(localStorage.getItem('liquid_glass_highlight')) : null;
                            currentArcHeight = localStorage.getItem('liquid_glass_arc_height') !== null ? parseFloat(localStorage.getItem('liquid_glass_arc_height')) : null;
                            updateGlassVariantUI();
                            syncGlassTuning();
                        }
                    });
                    await initUnreadEffect();
                    await initUnreadBounce();

                    // 加载初始小组件液态玻璃底色叠加浓度 (默认 0.0 = 100% 纯原生 NSGlassEffectView)
                    try {
                        const { invoke } = window.__TAURI_INTERNALS__;
                        const cfg = await invoke('get_widget_config');
                        if (cfg) {
                            if (typeof cfg.floating_opacity === 'number') floatingOpacity = cfg.floating_opacity;
                            if (typeof cfg.desktop_opacity === 'number') desktopOpacity = cfg.desktop_opacity;
                            const savedTint = localStorage.getItem('widget_glass_tint_alpha');
                            const initialOpacity = savedTint !== null ? parseFloat(savedTint) : 0.0;
                            setWidgetOpacity(Number.isNaN(initialOpacity) ? 0.0 : initialOpacity, false);
                        }
                    } catch (e) {
                        console.warn('获取小组件配置失败:', e);
                    }

                    // 检查初始 WebSocket 状态
                    try {
                        const { invoke } = window.__TAURI_INTERNALS__;
                        const status = await invoke('get_connection_status').catch(() => 'connecting');
                        updateConnectionStatus(status);
                    } catch (e) {
                        console.warn('⚠️ 检查初始 WebSocket 状态失败:', e);
                    }

                    // 定期与窗口激活时同步连接状态
                    const syncConnectionStatus = async () => {
                        try {
                            const { invoke } = window.__TAURI_INTERNALS__;
                            if (invoke) {
                                const currentStatus = await invoke('get_connection_status');
                                updateConnectionStatus(currentStatus);
                            }
                        } catch (_) { }
                    };
                    window.addEventListener('focus', syncConnectionStatus);

                    // 获取服务器地址用于解析图片相对路径
                    try {
                        const { invoke } = window.__TAURI_INTERNALS__;
                        const config = await invoke('get_config');
                        if (config && config.server_url) {
                            serverBaseUrl = config.server_url.replace(/\/+$/, '');
                        }
                    } catch (_) {}

                    await initSystemThemeListener();
                    await initWindowAlwaysOnTop();

                } catch (error) {
                    console.error('❌ 注册监听器时出错:', error);
                }
            }
        });

        function formatTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;

            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (days > 0) return `${days}天前`;
            if (hours > 0) return `${hours}小时前`;
            if (minutes > 0) return `${minutes}分钟前`;
            return '刚刚';
        }

        function getPriorityClass(priority) {
            if (priority >= 8) return 'high';
            if (priority >= 5) return 'medium';
            return 'low';
        }

        function toggleExpand(id) {
            if (window.getSelection && window.getSelection().toString().length > 0) return;
            const notif = notifications.find(n => n.id === id);
            if (notif) {
                notif.expanded = !notif.expanded;
                renderWidgetNotifications();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        marked.setOptions({
            headerIds: false,
            mangle: false,
            breaks: true,
            gfm: true
        });

        const renderer = new marked.Renderer();
        renderer.link = (href, title, text) => {
            if (typeof href === 'object') {
                const { href: linkHref, title: linkTitle, text: linkText } = href;
                return `<a href="${linkHref}" title="${linkTitle || ''}" onclick="openUrl('${linkHref}', event)">${linkText}</a>`;
            }
            return `<a href="${href}" title="${title || ''}" onclick="openUrl('${href}', event)">${text}</a>`;
        };
        marked.use({ renderer });

        async function openUrl(url, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') {
                window.open(url, '_blank');
                return;
            }
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('plugin:shell|open', { path: url });
            } catch (error) {
                console.error('Failed to open URL:', error);
                window.open(url, '_blank');
            }
        }

        function renderMessage(notif) {
            const text = notif.message;
            if (!text) return '';

            const isMarkdown = notif.extras &&
                notif.extras['client::display'] &&
                notif.extras['client::display'].contentType === 'text/markdown';

            if (isMarkdown) {
                return marked.parse(notif.message);
            }

            let html = escapeHtml(notif.message).replace(/\n/g, '<br>');
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            html = html.replace(urlRegex, (url) => {
                return `<a href="${url}" onclick="openUrl('${url}', event)">${url}</a>`;
            });
            return html;
        }

        let lastConnectionStatus = null;
        function updateConnectionStatus(status) {
            if (status === lastConnectionStatus) return;
            lastConnectionStatus = status;
            const widgetDot = document.getElementById('widgetStatusDot');
            if (widgetDot) {
                if (status === 'connected') {
                    widgetDot.classList.remove('offline');
                    widgetDot.title = 'Gotify 已连接';
                } else {
                    widgetDot.classList.add('offline');
                    widgetDot.title = '未连接 (点击可重连)';
                }
            }
        }

        function playChimeSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;

                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(587.33, now);
                osc1.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain1.gain.setValueAtTime(0.25, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.4);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(880, now + 0.12);
                gain2.gain.setValueAtTime(0.35, now + 0.12);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.12);
                osc2.stop(now + 0.5);
            } catch (e) {
                console.error('播放音效失败:', e);
            }
        }

        function addNotification(notif) {
            console.log('📨 收到通知:', notif);
            notif.pinned = false;
            notif.expanded = false;
            notif.unread = true;
            notifications.unshift(notif);

            if (notifications.length > 50) {
                notifications = notifications.slice(0, 50);
            }

            renderWidgetNotifications();

            if (notif.should_play_sound !== false) {
                playChimeSound();
            }
        }

        function togglePin(id, event) {
            if (event) event.stopPropagation();
            const notif = notifications.find(n => n.id === id);
            if (notif) {
                notif.pinned = !notif.pinned;
                renderWidgetNotifications();
                console.log(`📌 通知 ${id} ${notif.pinned ? '已置顶' : '取消置顶'}`);
            }
        }

        function deleteNotification(id, event) {
            if (event && typeof event.stopPropagation === 'function') event.stopPropagation();
            const index = notifications.findIndex(n => n.id === id);
            if (index !== -1) {
                notifications.splice(index, 1);
                renderWidgetNotifications();
                console.log(`🗑️ 通知 ${id} 已删除`);
            }
        }

        function clearAllNotifications(event) {
            if (event) {
                if (typeof event.stopPropagation === 'function') event.stopPropagation();
                if (typeof event.preventDefault === 'function') event.preventDefault();
            }
            const pinnedNotifs = notifications.filter(n => n.pinned);
            notifications = pinnedNotifs;
            renderWidgetNotifications();
            console.log('🗑️ 已清除所有非置顶通知');
        }

        async function showSettingsWindow() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('show_settings_window');
            } catch (error) {
                console.error('❌ 显示设置窗口失败:', error);
            }
        }

        async function snapWindowToEdge(edge) {
            const menu = document.getElementById('contextMenu');
            if (menu) menu.style.display = 'none';
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('snap_window_to_edge', { edge });
                console.log(`🧲 窗口已贴靠到屏幕${edge === 'right' ? '右侧' : '左侧'}`);
            } catch (error) {
                console.error('贴边失败:', error);
            }
        }

        setInterval(() => {
            if (notifications && notifications.length > 0) {
                // 仅就地更新时间标签，避免全量重建 DOM 引发显卡合成层刷新
                document.querySelectorAll('.widget-item').forEach(itemEl => {
                    const id = parseInt(itemEl.dataset.id, 10);
                    const notif = notifications.find(n => n.id === id);
                    if (notif) {
                        const timeEl = itemEl.querySelector('.widget-item-time');
                        if (timeEl) {
                            const newTime = formatTime(notif.date);
                            if (timeEl.textContent !== newTime) {
                                timeEl.textContent = newTime;
                            }
                        }
                    }
                });
            }
        }, 60000);

        async function reconnectWebSocket() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('stop_websocket');
                await invoke('start_websocket');
                console.log('🔄 WebSocket 重新连接完成');
            } catch (error) {
                console.error('❌ 重新连接失败:', error);
            }
        }

        window.addEventListener('message', async (event) => {
            if (event.data === 'config-saved') {
                console.log('📝 配置已保存，重新连接...');
                try {
                    const { invoke } = window.__TAURI_INTERNALS__;
                    const config = await invoke('get_config');
                    if (config && config.server_url) {
                        serverBaseUrl = config.server_url.replace(/\/+$/, '');
                    }
                } catch (_) {}
                await reconnectWebSocket();
            }
        });
    </script>
</body>
