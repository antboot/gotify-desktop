<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gotify 通知</title>
    <style>
        :root {
            /* 日间模式颜色变量 */
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #e8ecf1;
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --border-color: #e5e7eb;
            --shadow: rgba(0, 0, 0, 0.05);
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --empty-text: #9ca3af;
        }

        [data-theme="dark"] {
            /* 夜间模式颜色变量 */
            --bg-primary: #0f1419;
            --bg-secondary: #16181d;
            --bg-gradient-start: #0f1419;
            --bg-gradient-end: #1a1d24;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-tertiary: #6b7280;
            --border-color: #2d3748;
            --shadow: rgba(0, 0, 0, 0.3);
            --accent: #6366f1;
            --accent-hover: #7c3aed;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --card-bg: #1a1d24;
            --header-bg: #16181d;
            --empty-text: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 0;
            margin: 0;
            min-height: 100vh;
            overflow: auto;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            padding: 0;
            max-width: 100%;
            position: relative;
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* macOS 统一沉浸式标题栏 */
        .titlebar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 2000;
            user-select: none;
            -webkit-user-select: none;
        }

        .titlebar-drag-region {
            position: absolute;
            top: 0;
            left: 0;
            right: 48px;
            height: 100%;
            display: flex;
            align-items: center;
            -webkit-app-region: drag;
            cursor: default;
        }

        .titlebar-traffic-lights-spacer {
            width: 72px;
            height: 100%;
            flex-shrink: 0;
            -webkit-app-region: drag;
        }

        .titlebar-title {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            pointer-events: none;
            margin-right: 24px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            -webkit-app-region: drag;
        }

        .titlebar-title .title-bell {
            font-size: 14px;
            margin-right: 6px;
        }

        .titlebar-actions {
            position: absolute;
            right: 10px;
            top: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            z-index: 2010;
            -webkit-app-region: no-drag !important;
        }

        .pin-window-btn {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: transparent !important;
            color: #555a64 !important;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: none !important;
            -webkit-app-region: no-drag !important;
            pointer-events: auto !important;
            user-select: none;
        }

        .pin-window-btn svg {
            transition: color 0.2s ease, opacity 0.2s ease;
            opacity: 0.4;
            color: #555a64 !important;
        }

        .pin-window-btn:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: rgba(255, 255, 255, 0.25) !important;
        }

        .pin-window-btn:hover svg {
            opacity: 0.75;
            color: #9ca3af !important;
        }

        .pin-window-btn:active {
            transform: scale(0.95);
        }

        /* 置顶激活状态 - 纯黑白灰高对比：微透底色 + 醒目白色线框 + 亮白图钉，完全符合用户参考图 */
        .pin-window-btn.pinned {
            background: rgba(255, 255, 255, 0.12) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.45) !important;
            color: #ffffff !important;
            box-shadow: none !important;
            opacity: 1 !important;
        }

        .pin-window-btn.pinned svg {
            opacity: 1 !important;
            color: #ffffff !important;
            filter: none !important;
        }

        .pin-window-btn.pinned:hover {
            background: rgba(255, 255, 255, 0.18) !important;
            border-color: rgba(255, 255, 255, 0.65) !important;
            color: #ffffff !important;
            box-shadow: none !important;
        }

        /* 浅色模式下的置顶与未置顶状态 */
        [data-theme="light"] .pin-window-btn {
            border: 1px solid rgba(0, 0, 0, 0.12);
            color: #9ca3af !important;
        }

        [data-theme="light"] .pin-window-btn svg {
            color: #9ca3af !important;
        }

        [data-theme="light"] .pin-window-btn.pinned {
            background: rgba(0, 0, 0, 0.08) !important;
            border: 1.5px solid rgba(0, 0, 0, 0.45) !important;
            color: #111827 !important;
        }

        [data-theme="light"] .pin-window-btn.pinned svg {
            color: #111827 !important;
        }

        .notifications-container {
            display: grid;
            gap: 10px;
            padding: 12px;
            padding-top: 48px;
            padding-bottom: 56px;
            max-height: calc(100vh - 56px);
            overflow-y: auto;
        }

        .theme-toggle {
            position: fixed;
            left: 16px;
            bottom: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px var(--shadow);
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        /* 跟随系统主题时的特殊样式 */
        .theme-toggle.following-system {
            border: 2px solid var(--accent) !important;
            box-shadow: 0 0 8px var(--accent) !important;
            animation: pulse-system-theme 2s infinite;
        }

        @keyframes pulse-system-theme {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        .clear-all-btn {
            position: fixed;
            bottom: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--danger);
            color: white;
            border: 1px solid transparent;
            font-size: 14px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px var(--shadow);
            z-index: 1000;
        }

        .clear-all-btn:hover {
            background: #dc2626;
            transform: scale(1.1);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .clear-all-btn:active {
            transform: scale(0.95);
        }

        .clear-all-btn.visible {
            display: flex;
        }


        .notification-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 1px 3px var(--shadow);
            animation: slideIn 0.3s ease-out;
            position: relative;
            overflow: visible;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .notification-card.pinned {
            background: linear-gradient(135deg, var(--card-bg) 0%, var(--card-bg) 100%);
            border: 2px solid var(--accent);
            box-shadow: 0 2px 8px var(--shadow);
        }

        .notification-card:hover {
            box-shadow: 0 4px 12px var(--shadow);
            transform: translateY(-2px);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .notification-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--accent);
        }

        .notification-card.priority-high::before {
            background: var(--danger);
        }

        .notification-card.priority-medium::before {
            background: var(--warning);
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .notification-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            padding-right: 8px;
            line-height: 1.4;
        }

        .notification-time {
            font-size: 12px;
            color: var(--text-tertiary);
            white-space: nowrap;
        }

        .notification-message {
            color: var(--text-secondary);
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 13px;
            max-height: 200px;
            overflow: hidden;
            position: relative;
            transition: max-height 0.3s ease;
        }

        .notification-message.expanded {
            max-height: none;
        }

        .notification-message img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 8px 0;
            display: block;
        }

        .notification-message p {
            margin-bottom: 8px;
        }

        .notification-message p:last-child {
            margin-bottom: 0;
        }

        .notification-message h1,
        .notification-message h2,
        .notification-message h3 {
            margin: 12px 0 8px 0;
            font-size: 1.1em;
            color: var(--text-primary);
        }

        .notification-message code {
            background: var(--bg-primary);
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
        }

        .notification-message pre {
            background: var(--bg-primary);
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .notification-message blockquote {
            border-left: 4px solid var(--border-color);
            padding-left: 12px;
            color: var(--text-tertiary);
            margin: 8px 0;
        }

        .notification-card.expanded .notification-message {
            max-height: none;
        }

        .read-more-btn {
            display: none;
            width: 100%;
            padding: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0 0 10px 10px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: -10px;
            position: relative;
            z-index: 5;
        }

        .read-more-btn.visible {
            display: block;
        }

        /* 右键菜单 */
        .context-menu {
            display: none;
            position: fixed;
            z-index: 9999;
            background: var(--card-bg, #ffffff);
            border: 1px solid var(--border-color, #e5e7eb);
            border-radius: 8px;
            padding: 4px 0;
            min-width: 180px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .context-menu-item {
            padding: 10px 16px;
            font-size: 13px;
            color: var(--text-primary, #1a1a2e);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }

        .context-menu-item:hover {
            background: var(--bg-primary, #f5f7fa);
        }

        .notification-card.expanded .notification-message {
            max-height: none;
        }

        .notification-meta {
            margin-top: 6px;
            padding-top: 4px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            font-size: 11px;
            color: var(--text-tertiary);
            line-height: 1;
        }

        .notification-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .action-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .action-btn.delete:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .priority-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .priority-badge.high {
            background: var(--danger);
            color: white;
        }

        .priority-badge.medium {
            background: var(--warning);
            color: white;
        }

        .priority-badge.low {
            background: var(--success);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--empty-text);
            user-select: none;
            -webkit-user-select: none;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.6;
            user-select: none;
            -webkit-user-select: none;
        }

        .empty-state-text {
            font-size: 14px;
            font-weight: 500;
            user-select: none;
            -webkit-user-select: none;
        }

        .new-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--danger);
            color: white;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* 响应式布局 - 适配更窄的窗口 */
        @media (max-width: 400px) {
            .header h1 {
                font-size: 14px;
            }

            .theme-toggle {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }

            .notification-card {
                padding: 12px;
            }
        }

        /* 隐藏滚动条但保留滚动功能 */
        .notifications-container::-webkit-scrollbar {
            display: none;
        }

        .notifications-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 掉线/重连提示条 */
        .connection-banner {
            background: #fee2e2;
            color: #991b1b;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 500;
            border-bottom: 1px solid #fca5a5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 38px;
            z-index: 1900;
            animation: slideIn 0.3s ease-out;
        }

        .connection-banner.connecting {
            background: #feefc3;
            color: #713f12;
            border-bottom: 1px solid #fde047;
        }

        .connection-banner.hidden {
            display: none !important;
        }

        .reconnect-btn {
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            color: inherit;
        }

        .reconnect-btn:hover {
            background: rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body>
    <!-- Tauri API 初始化脚本 - 必须在所有脚本之前加载 -->
    <script src="lang.js"></script>
    <script src="tauri-api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Tauri v2 事件 API -->
    <script type="module">
        import { listen } from 'https://cdn.jsdelivr.net/npm/@tauri-apps/api@2/event.js';
        window.__TAURI_LISTEN__ = listen;
    </script>



    <div class="container">
        <!-- macOS 统一沉浸式标题栏 -->
        <header class="titlebar" id="appTitlebar" data-tauri-drag-region onmousedown="onTitlebarMouseDown(event)">
            <div class="titlebar-drag-region" data-tauri-drag-region onmousedown="onTitlebarMouseDown(event)">
                <div class="titlebar-traffic-lights-spacer" data-tauri-drag-region></div>
                <div class="titlebar-title" data-tauri-drag-region>
                    <span class="title-bell">🔔</span>
                    <span class="title-text">Gotify 通知</span>
                </div>
            </div>
            <div class="titlebar-actions" style="-webkit-app-region: no-drag;">
                <button id="pinWindowBtn" class="pin-window-btn" onclick="toggleWindowAlwaysOnTop(event)" onmousedown="event.stopPropagation()" onpointerdown="event.stopPropagation()"
                    title="窗口置顶" style="-webkit-app-region: no-drag;">
                    <svg viewBox="0 0 1024 1024" width="13" height="13" fill="currentColor">
                        <path d="M43.072 974.72l380.864-301.952 151.936 161.6c0 0 63.424 17.28 67.328-30.72l-3.904-163.584 225.088-259.648 98.048-5.696c0 0 76.928-15.488 21.184-82.752l-275.072-276.928c0 0-74.944-9.6-69.248 59.584l0 75.008L383.552 367.104 225.856 376.64c0 0-57.728 19.2-36.608 69.248l148.16 146.176L43.072 974.72 43.072 974.72z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- 掉线/重连状态栏 -->
        <div id="connectionBanner" class="connection-banner hidden">
            <span id="bannerText">⚠️ 未连接到 Gotify 服务器</span>
            <button class="reconnect-btn" onclick="reconnectWebSocket()" data-i18n="reconnect">立即重连</button>
        </div>

        <div id="notifications" class="notifications-container">
            <div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <div class="empty-state-text" data-i18n="emptyState">暂无通知</div>
            </div>
        </div>

        <!-- 右键菜单 -->
        <div id="contextMenu" class="context-menu">
            <div class="context-menu-item" onclick="toggleWindowAlwaysOnTop(event)">
                <span id="contextMenuPinIcon">📌</span> <span id="contextMenuPinText" data-i18n="pinWindow">窗口置顶</span>
            </div>
            <div class="context-menu-item" onclick="openSettings()">⚙️ <span data-i18n="settings">设置</span></div>
            <div class="context-menu-item" onclick="openGotifyWeb()">🌐 <span data-i18n="openGotify">网页打开 Gotify</span>
            </div>
        </div>

        <!-- 主题切换按钮 - 固定在左下角 -->
        <button class="theme-toggle" onclick="toggleTheme()" data-i18n-title="toggleTheme" title="切换主题 (双击跟随系统)"
            ondblclick="toggleSystemThemeFollow()">
            <span id="theme-icon">🌙</span>
        </button>

        <!-- 清除全部按钮 -->
        <button id="clearAllBtn" class="clear-all-btn" onclick="clearAllNotifications()" data-i18n-title="clearAll"
            title="清除所有（保留置顶）">
            🗑️
        </button>

    </div>

    <script>
        // 窗口置顶功能 (类似便签应用的悬浮置顶)
        let isWindowAlwaysOnTop = false;

        function updatePinButtonUI(pinned) {
            isWindowAlwaysOnTop = !!pinned;
            const btn = document.getElementById('pinWindowBtn');
            if (btn) {
                if (isWindowAlwaysOnTop) {
                    btn.classList.add('pinned');
                    btn.setAttribute('aria-pressed', 'true');
                    btn.title = (typeof t === 'function' ? t('unpinWindow') : null) || '取消置顶 (当前已置顶)';
                } else {
                    btn.classList.remove('pinned');
                    btn.setAttribute('aria-pressed', 'false');
                    btn.title = (typeof t === 'function' ? t('pinWindow') : null) || '窗口置顶 (悬浮在其他界面之上)';
                }
            }
            const contextPinText = document.getElementById('contextMenuPinText');
            if (contextPinText) {
                contextPinText.textContent = isWindowAlwaysOnTop ? ((typeof t === 'function' ? t('unpinWindow') : null) || '取消置顶') : ((typeof t === 'function' ? t('pinWindow') : null) || '窗口置顶');
            }
        }

        async function initWindowAlwaysOnTop() {
            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    const pinned = await window.__TAURI_INTERNALS__.invoke('get_window_always_on_top');
                    updatePinButtonUI(pinned);
                    console.log('📌 初始窗口置顶状态:', pinned);
                }
            } catch (e) {
                console.warn('⚠️ 获取初始窗口置顶状态失败:', e);
            }
        }

        async function toggleWindowAlwaysOnTop(event) {
            if (event) {
                if (typeof event.preventDefault === 'function') event.preventDefault();
                if (typeof event.stopPropagation === 'function') event.stopPropagation();
            }
            const menu = document.getElementById('contextMenu');
            if (menu) menu.style.display = 'none';

            // 立即切换 UI 状态（乐观更新，零延迟反馈）
            const targetState = !isWindowAlwaysOnTop;
            updatePinButtonUI(targetState);

            try {

                if (x + menuW > window.innerWidth) x = window.innerWidth - menuW - 8;
                if (y + menuH > window.innerHeight) y = window.innerHeight - menuH - 8;

                menu.style.left = x + 'px';

            if (!position) return false;

            const screenWidth = window.screen?.width || 0;
            const screenHeight = window.screen?.height || 0;

            const offscreenThreshold = -10000;
            const exceedsScreen = screenWidth && screenHeight && (position.x > screenWidth * 2 || position.y > screenHeight * 2);

            return position.x > offscreenThreshold && position.y > offscreenThreshold && !exceedsScreen;
        }

        function formatTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;

            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (days > 0) return `${days}天前`;
            if (hours > 0) return `${hours}小时前`;
            if (minutes > 0) return `${minutes}分钟前`;
            return '刚刚';
        }

        function getPriorityClass(priority) {
            if (priority >= 8) return 'high';
            if (priority >= 5) return 'medium';
            return 'low';
        }

        function getPriorityLabel(priority) {
            if (priority >= 8) return t('priorityHigh');
            if (priority >= 5) return t('priorityMedium');
            return t('priorityLow');
        }

        function renderNotifications() {
            const clearAllBtn = document.getElementById('clearAllBtn');

            if (notifications.length === 0) {
                notificationsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                <div class="empty-state-text" data-i18n="emptyState">暂无通知</div>
                    </div>
                `;
                if (clearAllBtn) clearAllBtn.classList.remove('visible');
                return;
            }

            // 显示清除按钮
            if (clearAllBtn) clearAllBtn.classList.add('visible');

            // 分离置顶和非置顶通知
            const pinnedNotifs = notifications.filter(n => n.pinned);
            const unpinnedNotifs = notifications.filter(n => !n.pinned);
            const sortedNotifs = [...pinnedNotifs, ...unpinnedNotifs];

            const html = sortedNotifs.map((notif, index) => {
                const priorityClass = getPriorityClass(notif.priority);
                const priorityLabel = getPriorityLabel(notif.priority);
                const timeAgo = formatTime(notif.date);
                const isNew = index === 0 && !notif.pinned && notifications.length > 1;
                const pinnedClass = notif.pinned ? 'pinned' : '';
                const expandedClass = notif.expanded ? 'expanded' : '';

                return `
                    <div class="notification-card-wrapper" id="notif-wrapper-${notif.id}">
                        <div class="notification-card priority-${priorityClass} ${pinnedClass} ${expandedClass}" data-id="${notif.id}" onclick="toggleExpand(${notif.id})">
                            ${isNew ? `<div class="new-badge">${t('new')}</div>` : ''}
                            <div class="notification-header">
                                <div class="notification-title">${escapeHtml(notif.title)}</div>
                                <div class="notification-actions">
                                    <button class="action-btn" onclick="togglePin(${notif.id}, event)" title="${notif.pinned ? t('unpin') : t('pin')}">
                                        ${notif.pinned ? '📍' : '📌'}
                                    </button>
                                    <button class="action-btn delete" onclick="deleteNotification(${notif.id}, event)" title="${t('delete')}">
                                        ✖️
                                    </button>
                                </div>
                            </div>
                            <div class="notification-message" id="msg-${notif.id}">${renderMessage(notif)}</div>
                            <div class="notification-meta">
                                <div class="notification-time">${timeAgo}</div>
                            </div>
                        </div>
                        <button class="read-more-btn" id="read-more-${notif.id}" onclick="toggleExpand(${notif.id})">
                            ${notif.expanded ? '∧ ' + t('readLess') : '∨ ' + t('readMore')}
                        </button>
                    </div>
                `;
            }).join('');

            notificationsContainer.innerHTML = html;

            sortedNotifs.forEach(notif => {
                const msgEl = document.getElementById(`msg-${notif.id}`);
                const readMoreBtn = document.getElementById(`read-more-${notif.id}`);
                if (msgEl && readMoreBtn) {
                    if (msgEl.scrollHeight > 200) {
                        readMoreBtn.classList.add('visible');
                    } else if (notif.expanded) {
                        readMoreBtn.classList.add('visible');
                    }
                }
            });
        }

        function toggleExpand(id) {
            // 选中文字时不切换展开状态
            if (window.getSelection && window.getSelection().toString().length > 0) return;
            const notif = notifications.find(n => n.id === id);

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 配置 marked（GitHub Flavored Markdown）
        marked.setOptions({
            headerIds: false,
            mangle: false,
            breaks: true,
            gfm: true
        });

        // 自定义 marked 渲染器来处理链接
        const renderer = new marked.Renderer();
        const originalLink = renderer.link.bind(renderer);
        renderer.link = (href, title, text) => {
            if (typeof href === 'object') {
                const { href: linkHref, title: linkTitle, text: linkText } = href;
                return `<a href="${linkHref}" title="${linkTitle || ''}" onclick="openUrl('${linkHref}', event)">${linkText}</a>`;
            }
            return `<a href="${href}" title="${title || ''}" onclick="openUrl('${href}', event)">${text}</a>`;
        };
        marked.use({ renderer });

        async function openUrl(url, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') {
                window.open(url, '_blank');
                return;
            }
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('plugin:shell|open', { path: url });
            } catch (error) {
                console.error('Failed to open URL:', error);
                window.open(url, '_blank');
            }
        }

        function renderMessage(notif) {
            const text = notif.message;
            if (!text) return '';

            const isMarkdown = notif.extras &&
                notif.extras['client::display'] &&
                notif.extras['client::display'].contentType === 'text/markdown';

            if (isMarkdown) {
                return marked.parse(notif.message);
            }

            let html = escapeHtml(notif.message).replace(/\n/g, '<br>');
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            html = html.replace(urlRegex, (url) => {
                return `<a href="${url}" onclick="openUrl('${url}', event)">${url}</a>`;
            });
            return html;
        }

        function updateConnectionBanner(status) {
            const banner = document.getElementById('connectionBanner');
            const textEl = document.getElementById('bannerText');
            if (!banner || !textEl) return;

            if (status === 'connected') {
                banner.classList.add('hidden');
            } else if (status === 'connecting') {
                banner.className = 'connection-banner connecting';
                textEl.textContent = '⏳ ' + t('connecting');
            } else if (status === 'reconnecting') {
                banner.className = 'connection-banner connecting';
                textEl.textContent = '🔄 ' + t('reconnecting');
            } else {
                banner.className = 'connection-banner';
                textEl.textContent = '⚠️ ' + t('disconnected');
            }
        }

        function playChimeSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;

                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(587.33, now);
                osc1.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain1.gain.setValueAtTime(0.25, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.4);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(880, now + 0.12);
                gain2.gain.setValueAtTime(0.35, now + 0.12);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.12);
                osc2.stop(now + 0.5);
            } catch (e) {
                console.error('播放音效失败:', e);
            }
        }

        function addNotification(notif) {
            console.log('📨 收到通知:', notif);
            // 添加 pinned 属性，默认为 false
            notif.pinned = false;
            notif.expanded = false;
            notifications.unshift(notif);

            // 只保留最近50条
            if (notifications.length > 50) {
                notifications = notifications.slice(0, 50);
            }

            renderNotifications();

            // 播放声音提示音
            if (notif.should_play_sound !== false) {
                playChimeSound();
            }
        }

        // 置顶/取消置顶通知
        function togglePin(id, event) {
            event.stopPropagation();
            const notif = notifications.find(n => n.id === id);
            if (notif) {
                notif.pinned = !notif.pinned;
                renderNotifications();
                console.log(`📌 通知 ${id} ${notif.pinned ? '已置顶' : '取消置顶'}`);
            }
        }

        // 删除单条通知
        function deleteNotification(id, event) {
            event.stopPropagation();
            const index = notifications.findIndex(n => n.id === id);
            if (index !== -1) {
                notifications.splice(index, 1);
                renderNotifications();
                console.log(`🗑️ 通知 ${id} 已删除`);
            }
        }

        // 清除所有通知（保留置顶）
        function clearAllNotifications() {
            const pinnedNotifs = notifications.filter(n => n.pinned);
            notifications = pinnedNotifs;
            renderNotifications();
            console.log('🗑️ 已清除所有非置顶通知');
            return;
        }

        // 显示设置窗口
        async function showSettingsWindow() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') {
                console.warn('⚠️ Tauri API 不可用，无法显示设置窗口');
                return;
            }

            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('show_settings_window');
                console.log('✅ 设置窗口已显示');
            } catch (error) {
                console.error('❌ 显示设置窗口失败:', error);
            }
        }

        // 窗口位置跟踪
        let savePositionTimeout;

        async function initWindowPositionTracking() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;

            try {
                console.log('🪟 初始化窗口位置跟踪...');

                // 使用 Tauri v2 的事件监听 API
                const listen = window.__TAURI_LISTEN__;
                if (typeof listen === 'function') {

                    // 监听窗口移动事件
                    await listen('tauri://move', (event) => {
                        console.log('🪟 窗口移动事件');
                        saveWindowPositionDebounced();
                    });

                    // 监听窗口调整大小事件
                    await listen('tauri://resize', (event) => {
                        console.log('🪟 窗口调整大小事件');
                        saveWindowPositionDebounced();
                    });

                    console.log('✅ 窗口事件监听器已注册');
                } else {
                    console.warn('⚠️ Tauri 事件 API 不可用，仅在关闭时保存');
                }

                // 页面关闭时保存
                window.addEventListener('beforeunload', saveWindowPosition);

                console.log('✅ 窗口位置跟踪已初始化');
            } catch (error) {
                console.error('初始化窗口位置跟踪失败:', error);
            }
        }

        // 防抖保存函数
        function saveWindowPositionDebounced() {
            clearTimeout(savePositionTimeout);
            savePositionTimeout = setTimeout(() => {
                console.log('💾 防抖保存窗口位置');
                saveWindowPosition();
            }, 1000); // 1秒后保存
        }

        async function saveWindowPosition() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;

            try {
                const { invoke } = window.__TAURI_INTERNALS__;

                console.log('💾 自动保存窗口位置...');

                // 让后端直接获取窗口位置
                await invoke('save_window_position_auto');

                console.log('✅ 窗口位置保存完成');
            } catch (error) {
                console.error('❌ 保存窗口位置失败:', error);
            }
        }

        // 每分钟更新一次时间显示
        setInterval(() => {
            const timeElements = document.querySelectorAll('.notification-time');
            notifications.forEach((notif, index) => {
                if (timeElements[index]) {
                    timeElements[index].textContent = formatTime(notif.date);
                }
            });
        }, 60000);

        // 重新连接WebSocket
        async function reconnectWebSocket() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;

            try {
                const { invoke } = window.__TAURI_INTERNALS__;

                // 停止当前连接
                await invoke('stop_websocket');

                // 重新启动连接
                await invoke('start_websocket');

                console.log('🔄 WebSocket 重新连接完成');
            } catch (error) {
                console.error('❌ 重新连接失败:', error);
            }
        }

        // 监听配置保存事件
        window.addEventListener('message', async (event) => {
            if (event.data === 'config-saved') {
                console.log('📝 配置已保存，重新连接...');
                // 刷新服务器地址
                try {
                    const { invoke } = window.__TAURI_INTERNALS__;
                    const config = await invoke('get_config');
                    if (config && config.server_url) {
                        serverBaseUrl = config.server_url.replace(/\/+$/, '');
                    }
                } catch (e) {
                    console.warn('⚠️ 刷新服务器地址失败:', e);
                }
                await reconnectWebSocket();
            }
        });
    </script>
</body>
