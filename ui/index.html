<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gotify 通知</title>
    <style>
        :root {
            /* 日间模式颜色变量 */
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #e8ecf1;
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --border-color: #e5e7eb;
            --shadow: rgba(0, 0, 0, 0.05);
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --empty-text: #9ca3af;
        }

        [data-theme="dark"] {
            /* 夜间模式颜色变量 */
            --bg-primary: #0f1419;
            --bg-secondary: #16181d;
            --bg-gradient-start: #0f1419;
            --bg-gradient-end: #1a1d24;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-tertiary: #6b7280;
            --border-color: #2d3748;
            --shadow: rgba(0, 0, 0, 0.3);
            --accent: #6366f1;
            --accent-hover: #7c3aed;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --card-bg: #1a1d24;
            --header-bg: #16181d;
            --empty-text: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 0;
            margin: 0;
            min-height: 100vh;
            overflow: auto;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            padding: 0;
            max-width: 100%;
            position: relative;
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* macOS 统一沉浸式标题栏 */
        .titlebar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 2000;
            user-select: none;
            -webkit-user-select: none;
        }

        .titlebar-drag-region {
            position: absolute;
            top: 0;
            left: 0;
            right: 48px;
            height: 100%;
            display: flex;
            align-items: center;
            -webkit-app-region: drag;
            cursor: default;
        }

        .titlebar-traffic-lights-spacer {
            width: 72px;
            height: 100%;
            flex-shrink: 0;
            -webkit-app-region: drag;
        }

        .titlebar-title {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            pointer-events: none;
            margin-right: 24px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            -webkit-app-region: drag;
        }

        .titlebar-title .title-bell {
            font-size: 14px;
            margin-right: 6px;
        }

        .titlebar-actions {
            position: absolute;
            right: 10px;
            top: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            z-index: 2010;
            -webkit-app-region: no-drag !important;
        }

        .pin-window-btn {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: transparent !important;
            color: #555a64 !important;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: none !important;
            -webkit-app-region: no-drag !important;
            pointer-events: auto !important;
            user-select: none;
        }

        .pin-window-btn svg {
            transition: color 0.2s ease, opacity 0.2s ease;
            opacity: 0.4;
            color: #555a64 !important;
        }

        .pin-window-btn:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: rgba(255, 255, 255, 0.25) !important;
        }

        .pin-window-btn:hover svg {
            opacity: 0.75;
            color: #9ca3af !important;
        }

        .pin-window-btn:active {
            transform: scale(0.95);
        }

        /* 置顶激活状态 - 纯黑白灰高对比：微透底色 + 醒目白色线框 + 亮白图钉，完全符合用户参考图 */
        .pin-window-btn.pinned {
            background: rgba(255, 255, 255, 0.12) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.45) !important;
            color: #ffffff !important;
            box-shadow: none !important;
            opacity: 1 !important;
        }

        .pin-window-btn.pinned svg {
            opacity: 1 !important;
            color: #ffffff !important;
            filter: none !important;
        }

        .pin-window-btn.pinned:hover {
            background: rgba(255, 255, 255, 0.18) !important;
            border-color: rgba(255, 255, 255, 0.65) !important;
            color: #ffffff !important;
            box-shadow: none !important;
        }

        /* 浅色模式下的置顶与未置顶状态 */
        [data-theme="light"] .pin-window-btn {
            border: 1px solid rgba(0, 0, 0, 0.12);
            color: #9ca3af !important;
        }

        [data-theme="light"] .pin-window-btn svg {
            color: #9ca3af !important;
        }

        [data-theme="light"] .pin-window-btn.pinned {
            background: rgba(0, 0, 0, 0.08) !important;
            border: 1.5px solid rgba(0, 0, 0, 0.45) !important;
            color: #111827 !important;
        }

        [data-theme="light"] .pin-window-btn.pinned svg {
            color: #111827 !important;
        }

        .notifications-container {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 10px;
            padding: 12px;
            padding-top: 48px;
            padding-bottom: 56px;
            max-height: calc(100vh - 56px);
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
            box-sizing: border-box;
        }

        /* Windows 专属布局优化：彻底折叠前端自定义标题栏 */
        /* height:0 + overflow:hidden 折叠容器，position:fixed 子元素不受影响，仍正常显示 */
        .os-windows .titlebar {
            height: 0 !important;
            min-height: 0 !important;
            overflow: hidden !important;
            padding: 0 !important;
            margin: 0 !important;
            border: none !important;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        /* 置顶按钮：无清除按钮时停靠在右下角（与左下角主题按钮两端对称）；有清除按钮时平滑滑向正中间居中 */
        .os-windows .titlebar-actions {
            position: fixed;
            top: auto;
            right: auto;
            bottom: 16px;
            left: calc(100% - 16px);
            transform: translateX(-100%);
            z-index: 1000;
            pointer-events: auto;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), bottom 0.2s ease;
        }

        /* 当清除按钮显示时（有通知），置顶按钮自动平滑滑动至正中间居中 */
        .os-windows:has(#clearAllBtn.visible) .titlebar-actions,
        html.has-clear-all.os-windows .titlebar-actions,
        html.has-clear-all .os-windows .titlebar-actions {
            left: 50%;
            transform: translateX(-50%);
        }

        /* Windows 下置顶按钮风格：32x32 圆形，与主题按钮及清除按钮完全一致 */
        html.os-windows .pin-window-btn,
        html.os-windows [data-theme="light"] .pin-window-btn {
            width: 32px !important;
            height: 32px !important;
            border-radius: 50% !important;
            border: 1px solid var(--border-color) !important;
            background: var(--card-bg) !important;
            color: var(--text-secondary) !important;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px var(--shadow) !important;
            -webkit-app-region: no-drag !important;
            pointer-events: auto !important;
            user-select: none;
            padding: 0;
            opacity: 1 !important;
        }

        html.os-windows .pin-window-btn svg,
        html.os-windows [data-theme="light"] .pin-window-btn svg {
            width: 14px;
            height: 14px;
            opacity: 0.8;
            color: var(--text-secondary) !important;
            transition: all 0.2s ease;
        }

        html.os-windows .pin-window-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px var(--shadow) !important;
            background: var(--card-bg) !important;
            border-color: var(--border-color) !important;
        }

        html.os-windows .pin-window-btn:hover svg {
            opacity: 1;
            color: var(--text-primary) !important;
        }

        html.os-windows .pin-window-btn:active {
            transform: scale(0.95);
        }

        /* Windows 置顶激活状态：使用主题主色（Accent）高亮显示，与主题效果和谐统一 */
        html.os-windows .pin-window-btn.pinned,
        html.os-windows [data-theme="light"] .pin-window-btn.pinned {
            background: var(--accent) !important;
            border-color: var(--accent) !important;
            color: #ffffff !important;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.45) !important;
            opacity: 1 !important;
        }

        html.os-windows .pin-window-btn.pinned svg,
        html.os-windows [data-theme="light"] .pin-window-btn.pinned svg {
            opacity: 1 !important;
            color: #ffffff !important;
        }

        html.os-windows .pin-window-btn.pinned:hover {
            background: var(--accent-hover) !important;
            border-color: var(--accent-hover) !important;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.55) !important;
            transform: scale(1.1);
        }

        html.os-windows .pin-window-btn.pinned:active {
            transform: scale(0.95);
        }

        /* Windows 下内容紧贴原生标题栏，去掉多余顶部空白 */
        .os-windows .notifications-container {
            padding-top: 12px;
        }

        .theme-toggle {
            position: fixed;
            left: 16px;
            bottom: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px var(--shadow);
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        /* 跟随系统主题时的特殊样式 */
        .theme-toggle.following-system {
            border: 2px solid var(--accent) !important;
            box-shadow: 0 0 8px var(--accent) !important;
            animation: pulse-system-theme 2s infinite;
        }

        @keyframes pulse-system-theme {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        /* 清除全部按钮：保持与主题按钮、置顶按钮完全一致的 32x32 圆形卡片风格，带平滑淡入淡出及缩放过渡 */
        .clear-all-btn {
            position: fixed;
            bottom: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.6);
            transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 2px 8px var(--shadow);
            z-index: 1000;
        }

        .clear-all-btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .clear-all-btn.visible:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .clear-all-btn.visible:active {
            transform: scale(0.95);
        }


        .notification-card-wrapper {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        .notification-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 1px 3px var(--shadow);
            animation: slideIn 0.3s ease-out;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            cursor: pointer;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .notification-card.pinned {
            background: linear-gradient(135deg, var(--card-bg) 0%, var(--card-bg) 100%);
            border: 2px solid var(--accent);
            box-shadow: 0 2px 8px var(--shadow);
        }

        .notification-card:hover {
            box-shadow: 0 4px 12px var(--shadow);
            transform: translateY(-2px);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .notification-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--accent);
        }

        .notification-card.priority-high::before {
            background: var(--danger);
        }

        .notification-card.priority-medium::before {
            background: var(--warning);
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 8px;
            min-width: 0;
            width: 100%;
        }

        .notification-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            min-width: 0;
            padding-right: 4px;
            line-height: 1.4;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .notification-time {
            font-size: 12px;
            color: var(--text-tertiary);
            white-space: nowrap;
        }

        .notification-message {
            color: var(--text-secondary);
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: anywhere;
            font-size: 13px;
            max-height: 200px;
            overflow: hidden;
            position: relative;
            transition: max-height 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .notification-message a {
            color: var(--accent);
            text-decoration: underline;
            word-break: break-all;
            overflow-wrap: anywhere;
        }

        .notification-message.expanded {
            max-height: none;
        }

        .notification-message img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 8px 0;
            display: block;
        }

        .notification-message p {
            margin-bottom: 8px;
        }

        .notification-message p:last-child {
            margin-bottom: 0;
        }

        .notification-message h1,
        .notification-message h2,
        .notification-message h3 {
            margin: 12px 0 8px 0;
            font-size: 1.1em;
            color: var(--text-primary);
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .notification-message code {
            background: var(--bg-primary);
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
            word-break: break-all;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .notification-message pre {
            background: var(--bg-primary);
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
            max-width: 100%;
            box-sizing: border-box;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .notification-message blockquote {
            border-left: 4px solid var(--border-color);
            padding-left: 12px;
            color: var(--text-tertiary);
            margin: 8px 0;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .notification-card.expanded .notification-message {
            max-height: none;
        }

        .read-more-btn {
            display: none;
            width: 100%;
            padding: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0 0 10px 10px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: -10px;
            position: relative;
            z-index: 5;
        }

        .read-more-btn.visible {
            display: block;
        }

        /* 右键菜单 */
        .context-menu {
            display: none;
            position: fixed;
            z-index: 9999;
            background: var(--card-bg, #ffffff);
            border: 1px solid var(--border-color, #e5e7eb);
            border-radius: 8px;
            padding: 4px 0;
            min-width: 180px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .context-menu-item {
            padding: 10px 16px;
            font-size: 13px;
            color: var(--text-primary, #1a1a2e);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }

        .context-menu-item:hover {
            background: var(--bg-primary, #f5f7fa);
        }

        .notification-card.expanded .notification-message {
            max-height: none;
        }

        .notification-meta {
            margin-top: 6px;
            padding-top: 4px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            font-size: 11px;
            color: var(--text-tertiary);
            line-height: 1;
        }

        .notification-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            align-items: center;
        }

        .action-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .action-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .action-btn.delete:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .priority-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .priority-badge.high {
            background: var(--danger);
            color: white;
        }

        .priority-badge.medium {
            background: var(--warning);
            color: white;
        }

        .priority-badge.low {
            background: var(--success);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--empty-text);
            user-select: none;
            -webkit-user-select: none;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.6;
            user-select: none;
            -webkit-user-select: none;
        }

        .empty-state-text {
            font-size: 14px;
            font-weight: 500;
            user-select: none;
            -webkit-user-select: none;
        }

        .new-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--danger);
            color: white;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* 响应式布局 - 适配窄窗口及最小窗口模式 (minWidth: 260px) */
        @media (max-width: 400px) {
            .header h1 {
                font-size: 14px;
            }

            .notification-card {
                padding: 12px;
            }
        }

        @media (max-width: 320px) {
            .notifications-container {
                padding-left: 8px;
                padding-right: 8px;
                padding-bottom: 54px;
                gap: 8px;
            }

            .os-windows .notifications-container {
                padding-top: 8px;
            }

            .notification-card {
                padding: 10px 10px 8px 10px;
                border-radius: 8px;
            }

            .notification-header {
                margin-bottom: 8px;
                gap: 6px;
            }

            .notification-title {
                font-size: 13px;
                line-height: 1.35;
            }

            .notification-message {
                font-size: 12px;
                line-height: 1.45;
            }

            .action-btn {
                padding: 2px 4px;
                font-size: 11px;
            }

            .notification-meta {
                margin-top: 4px;
                padding-top: 4px;
                font-size: 10px;
            }

            .theme-toggle {
                left: 10px;
                bottom: 12px;
            }

            .os-windows .titlebar-actions {
                bottom: 12px;
                left: calc(100% - 10px);
                transform: translateX(-100%);
            }

    <script>
        // 窗口置顶功能 (类似便签应用的悬浮置顶)
        let isWindowAlwaysOnTop = false;

        function updatePinButtonUI(pinned) {
            isWindowAlwaysOnTop = !!pinned;
            const btn = document.getElementById('pinWindowBtn');
            if (btn) {
                if (isWindowAlwaysOnTop) {
                    btn.classList.add('pinned');
                    btn.setAttribute('aria-pressed', 'true');
                    btn.title = (typeof t === 'function' ? t('unpinWindow') : null) || '取消置顶 (当前已置顶)';
                } else {
                    btn.classList.remove('pinned');
                    btn.setAttribute('aria-pressed', 'false');
                    btn.title = (typeof t === 'function' ? t('pinWindow') : null) || '窗口置顶 (悬浮在其他界面之上)';
                }
            }
            const contextPinText = document.getElementById('contextMenuPinText');
            if (contextPinText) {
                contextPinText.textContent = isWindowAlwaysOnTop ? ((typeof t === 'function' ? t('unpinWindow') : null) || '取消置顶') : ((typeof t === 'function' ? t('pinWindow') : null) || '窗口置顶');
            }
        }

        async function initWindowAlwaysOnTop() {
            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    const pinned = await window.__TAURI_INTERNALS__.invoke('get_window_always_on_top');
                    updatePinButtonUI(pinned);
                    console.log('📌 初始窗口置顶状态:', pinned);
                }
            } catch (e) {
                console.warn('⚠️ 获取初始窗口置顶状态失败:', e);
            }
        }

        async function toggleWindowAlwaysOnTop(event) {
            if (event) {
                if (typeof event.preventDefault === 'function') event.preventDefault();
                if (typeof event.stopPropagation === 'function') event.stopPropagation();
            }
            const menu = document.getElementById('contextMenu');
            if (menu) menu.style.display = 'none';

            // 立即切换 UI 状态（乐观更新，零延迟反馈）
            const targetState = !isWindowAlwaysOnTop;
            updatePinButtonUI(targetState);

            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    const result = await window.__TAURI_INTERNALS__.invoke('set_window_always_on_top', { alwaysOnTop: targetState });
                    updatePinButtonUI(result);
                    console.log('📌 窗口置顶状态已设置:', result);
                }
            } catch (e) {
                console.error('❌ 切换窗口置顶失败:', e);
                updatePinButtonUI(!targetState);
            }
        }

        // 桌面小组件模式 (Desktop Widget Mode)
        let isDesktopWidgetMode = false;

        async function updateActivePresetPill() {
            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    const cfg = await window.__TAURI_INTERNALS__.invoke('get_widget_config');
                    const w = cfg.widget_width || window.innerWidth;
                    document.querySelectorAll('.size-pill').forEach(el => el.classList.remove('active'));
                    if (w <= 300) {
                        document.getElementById('pillSizeS')?.classList.add('active');
                    } else if (w <= 380) {
                        document.getElementById('pillSizeM')?.classList.add('active');
                    } else {
                        document.getElementById('pillSizeL')?.classList.add('active');
                    }
                }
            } catch (e) {
                console.warn(e);
            }
        }

        async function changeWidgetPresetSize(preset) {
            let w = 340, h = 240;
            if (preset === 's') { w = 280; h = 160; }
            else if (preset === 'm') { w = 340; h = 240; }
            else if (preset === 'l') { w = 420; h = 360; }

            document.querySelectorAll('.size-pill').forEach(el => el.classList.remove('active'));
            const pill = document.getElementById(`pillSize${preset.toUpperCase()}`);
            if (pill) pill.classList.add('active');

            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    await window.__TAURI_INTERNALS__.invoke('set_widget_size', { width: w, height: h });
                }
            } catch (e) {

        let resizeRafId = null;

        function initWidgetResize() {
            const handle = document.getElementById('widgetResizeHandle');
            if (!handle) return;

            handle.addEventListener('mousedown', async (e) => {
                if (e.button !== 0) return;
                e.preventDefault();
                e.stopPropagation();

                isResizingWidget = true;
                resizeStartX = e.screenX;
                resizeStartY = e.screenY;

                try {
                    if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                        const cfg = await window.__TAURI_INTERNALS__.invoke('get_widget_config');
                        resizeStartWidth = cfg.widget_width || window.innerWidth;
                        resizeStartHeight = cfg.widget_height || window.innerHeight;
                    } else {
                        resizeStartWidth = window.innerWidth;
                        resizeStartHeight = window.innerHeight;
                    }
                } catch {
                    resizeStartWidth = window.innerWidth;
                    resizeStartHeight = window.innerHeight;
                }

                document.addEventListener('mousemove', onWidgetResizeMouseMove);
                document.addEventListener('mouseup', onWidgetResizeMouseUp);
            });
        }

        function onWidgetResizeMouseMove(e) {
            if (!isResizingWidget) return;
            const deltaX = e.screenX - resizeStartX;
            const deltaY = e.screenY - resizeStartY;

            const newW = Math.max(240, Math.min(900, Math.round(resizeStartWidth + deltaX)));
            const newH = Math.max(140, Math.min(900, Math.round(resizeStartHeight + deltaY)));

            // 自由调节时清除预设尺寸的活跃标记
            document.querySelectorAll('.size-pill').forEach(el => el.classList.remove('active'));

            if (resizeRafId) cancelAnimationFrame(resizeRafId);
            resizeRafId = requestAnimationFrame(async () => {
                try {
                    if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                        await window.__TAURI_INTERNALS__.invoke('set_widget_size', { width: newW, height: newH });
                    }
                } catch (err) {
                    console.warn('调整尺寸失败:', err);
                }
            });
        }

        function onWidgetResizeMouseUp() {
            if (!isResizingWidget) return;
            isResizingWidget = false;
            document.removeEventListener('mousemove', onWidgetResizeMouseMove);
            document.removeEventListener('mouseup', onWidgetResizeMouseUp);
        }

        function isSavedPositionValid(position) {
            if (!position) return false;

            const screenWidth = window.screen?.width || 0;
            const screenHeight = window.screen?.height || 0;

            const offscreenThreshold = -10000;
            const exceedsScreen = screenWidth && screenHeight && (position.x > screenWidth * 2 || position.y > screenHeight * 2);

            return position.x > offscreenThreshold && position.y > offscreenThreshold && !exceedsScreen;
        }

                    console.log('✅ v1 监听器已设置');
                } catch (error) {
                    console.error('❌❌❌ 注册监听器时出错 (v1):', error);
                }
            } else {
                console.error('❌❌❌ Tauri API 完全不可用！');
                console.error('这不应该发生，请检查是否在浏览器中打开了文件');
            }
        });

        function formatTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;

            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (days > 0) return `${days}天前`;
            if (hours > 0) return `${hours}小时前`;
            if (minutes > 0) return `${minutes}分钟前`;
            return '刚刚';
        }

        function getPriorityClass(priority) {
            if (priority >= 8) return 'high';
            if (priority >= 5) return 'medium';
            return 'low';
        }

        function getPriorityLabel(priority) {
            if (priority >= 8) return t('priorityHigh');
            if (priority >= 5) return t('priorityMedium');
            return t('priorityLow');
        }

        function renderNotifications() {
            const clearAllBtn = document.getElementById('clearAllBtn');

            if (notifications.length === 0) {
                notificationsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                <div class="empty-state-text" data-i18n="emptyState">暂无通知</div>
                    </div>
                `;
                if (clearAllBtn) clearAllBtn.classList.remove('visible');
                document.documentElement.classList.remove('has-clear-all');
                renderWidgetNotifications();
                return;
            }

            // 显示清除按钮
            if (clearAllBtn) clearAllBtn.classList.add('visible');
            document.documentElement.classList.add('has-clear-all');

            // 分离置顶和非置顶通知
            const pinnedNotifs = notifications.filter(n => n.pinned);
            const unpinnedNotifs = notifications.filter(n => !n.pinned);
            const sortedNotifs = [...pinnedNotifs, ...unpinnedNotifs];

            const html = sortedNotifs.map((notif, index) => {
                const priorityClass = getPriorityClass(notif.priority);
                const priorityLabel = getPriorityLabel(notif.priority);
                const timeAgo = formatTime(notif.date);
                const isNew = index === 0 && !notif.pinned && notifications.length > 1;
                const pinnedClass = notif.pinned ? 'pinned' : '';
                const expandedClass = notif.expanded ? 'expanded' : '';

                return `
                    <div class="notification-card-wrapper" id="notif-wrapper-${notif.id}">
                        <div class="notification-card priority-${priorityClass} ${pinnedClass} ${expandedClass}" data-id="${notif.id}" onclick="toggleExpand(${notif.id})">
                            ${isNew ? `<div class="new-badge">${t('new')}</div>` : ''}
                            <div class="notification-header">
                                <div class="notification-title">${escapeHtml(notif.title)}</div>
                                <div class="notification-actions">
                                    <button class="action-btn" onclick="togglePin(${notif.id}, event)" title="${notif.pinned ? t('unpin') : t('pin')}">
                                        ${notif.pinned ? '📍' : '📌'}
                                    </button>
                                    <button class="action-btn delete" onclick="deleteNotification(${notif.id}, event)" title="${t('delete')}">
                                        ✖️
                                    </button>
                                </div>
                            </div>
                            <div class="notification-message" id="msg-${notif.id}">${renderMessage(notif)}</div>
                            <div class="notification-meta">
                                <div class="notification-time">${timeAgo}</div>
                            </div>
                        </div>
                        <button class="read-more-btn" id="read-more-${notif.id}" onclick="toggleExpand(${notif.id})">
                            ${notif.expanded ? '∧ ' + t('readLess') : '∨ ' + t('readMore')}
                        </button>
                    </div>
                `;
            }).join('');

            notificationsContainer.innerHTML = html;

            sortedNotifs.forEach(notif => {
                const msgEl = document.getElementById(`msg-${notif.id}`);
                const readMoreBtn = document.getElementById(`read-more-${notif.id}`);
                if (msgEl && readMoreBtn) {
                    if (msgEl.scrollHeight > 200) {
                        readMoreBtn.classList.add('visible');
                    } else if (notif.expanded) {
                        readMoreBtn.classList.add('visible');
                    }
                }
            });

            renderWidgetNotifications();
        }

        function toggleExpand(id) {
            // 选中文字时不切换展开状态
            if (window.getSelection && window.getSelection().toString().length > 0) return;
            const notif = notifications.find(n => n.id === id);
            if (notif) {
                notif.expanded = !notif.expanded;
                renderNotifications();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 配置 marked（GitHub Flavored Markdown）
        marked.setOptions({
            headerIds: false,
            mangle: false,
            breaks: true,
            gfm: true
        });

        // 自定义 marked 渲染器来处理链接
        const renderer = new marked.Renderer();
        const originalLink = renderer.link.bind(renderer);
        renderer.link = (href, title, text) => {
            if (typeof href === 'object') {
                const { href: linkHref, title: linkTitle, text: linkText } = href;
                return `<a href="${linkHref}" title="${linkTitle || ''}" onclick="openUrl('${linkHref}', event)">${linkText}</a>`;
            }
            return `<a href="${href}" title="${title || ''}" onclick="openUrl('${href}', event)">${text}</a>`;
        };
        marked.use({ renderer });

        async function openUrl(url, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') {
                window.open(url, '_blank');
                return;
            }
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('plugin:shell|open', { path: url });
            } catch (error) {
                console.error('Failed to open URL:', error);
                window.open(url, '_blank');
            }
        }

        function renderMessage(notif) {
            const text = notif.message;
            if (!text) return '';

            const isMarkdown = notif.extras &&
                notif.extras['client::display'] &&
                notif.extras['client::display'].contentType === 'text/markdown';

            if (isMarkdown) {
                return marked.parse(notif.message);
            }

            let html = escapeHtml(notif.message).replace(/\n/g, '<br>');
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            html = html.replace(urlRegex, (url) => {
                return `<a href="${url}" onclick="openUrl('${url}', event)">${url}</a>`;
            });
            return html;
        }

        function updateConnectionBanner(status) {
            const banner = document.getElementById('connectionBanner');
            const textEl = document.getElementById('bannerText');
            if (!banner || !textEl) return;

            if (status === 'connected') {
                banner.classList.add('hidden');
            } else if (status === 'connecting') {
                banner.className = 'connection-banner connecting';
                textEl.textContent = '⏳ ' + t('connecting');
            } else if (status === 'reconnecting') {
                banner.className = 'connection-banner connecting';
                textEl.textContent = '🔄 ' + t('reconnecting');
            } else {
                banner.className = 'connection-banner';
                textEl.textContent = '⚠️ ' + t('disconnected');
            }

            const widgetDot = document.getElementById('widgetStatusDot');
            if (widgetDot) {
                if (status === 'connected') {
                    widgetDot.classList.remove('offline');
                } else {
                    widgetDot.classList.add('offline');
                }
            }
        }

        function playChimeSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;

                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(587.33, now);
                osc1.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain1.gain.setValueAtTime(0.25, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.4);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(880, now + 0.12);
                gain2.gain.setValueAtTime(0.35, now + 0.12);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.12);
                osc2.stop(now + 0.5);
            } catch (e) {
                console.error('播放音效失败:', e);
            }
        }

        function addNotification(notif) {
            console.log('📨 收到通知:', notif);
            // 添加 pinned 属性，默认为 false
            notif.pinned = false;
            notif.expanded = false;
            notifications.unshift(notif);

            // 只保留最近50条
            if (notifications.length > 50) {
                notifications = notifications.slice(0, 50);
            }

            renderNotifications();

            // 播放声音提示音
            if (notif.should_play_sound !== false) {
                playChimeSound();
            }
        }

        // 置顶/取消置顶通知
        function togglePin(id, event) {
            event.stopPropagation();
            const notif = notifications.find(n => n.id === id);
            if (notif) {
                notif.pinned = !notif.pinned;
                renderNotifications();
                console.log(`📌 通知 ${id} ${notif.pinned ? '已置顶' : '取消置顶'}`);
            }
        }

        // 删除单条通知
        function deleteNotification(id, event) {
            event.stopPropagation();
            const index = notifications.findIndex(n => n.id === id);
            if (index !== -1) {
                notifications.splice(index, 1);
                renderNotifications();
                console.log(`🗑️ 通知 ${id} 已删除`);
            }
        }

        // 清除所有通知（保留置顶）
        function clearAllNotifications() {
            const pinnedNotifs = notifications.filter(n => n.pinned);
            notifications = pinnedNotifs;
            renderNotifications();
            console.log('🗑️ 已清除所有非置顶通知');
            return;
        }

        // 显示设置窗口
        async function showSettingsWindow() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') {
                console.warn('⚠️ Tauri API 不可用，无法显示设置窗口');
                return;
            }

            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('show_settings_window');
                console.log('✅ 设置窗口已显示');
            } catch (error) {
                console.error('❌ 显示设置窗口失败:', error);
            }
        }

        // 窗口位置跟踪
        let savePositionTimeout;

        // 是否正在拖动窗口（用于判断是否应触发贴边吸附）
        let isWindowDragging = false;

        async function initWindowPositionTracking() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;

            try {
                console.log('🪟 初始化窗口位置跟踪...');

                // 使用 Tauri v2 的事件监听 API
                const listen = window.__TAURI_LISTEN__;
                if (typeof listen === 'function') {

                    // 监听窗口移动事件：只标记"正在拖动"，清掉旧定时器
                    // 不在拖动过程中触发磁性吸附，防止窗口在拖动途中跳动
                    await listen('tauri://move', () => {
                        isWindowDragging = true;
                        clearTimeout(savePositionTimeout);
                    });

                    // 监听窗口调整大小事件（不是拖动，正常防抖保存）
                    await listen('tauri://resize', () => {
                        console.log('🪟 窗口调整大小事件');
                        saveWindowPositionDebounced();
                    });

                    console.log('✅ 窗口事件监听器已注册');
                } else {
                    console.warn('⚠️ Tauri 事件 API 不可用，仅在关闭时保存');
                }

                // 松开鼠标时触发贴边 & 保存（真正的拖动结束信号）
                // capture:true 确保在任意元素上松手都能被捕获
                window.addEventListener('mouseup', () => {
                    if (isWindowDragging) {
                        isWindowDragging = false;
                        // 等 80ms 让 OS 稳定窗口最终位置，再执行磁性贴边
                        savePositionTimeout = setTimeout(() => {
                            console.log('🧲 拖动松手，触发磁性贴边 & 保存位置');
                            saveWindowPosition();
                        }, 80);
                    }
                }, { capture: true });

                // 页面关闭时保存
                window.addEventListener('beforeunload', saveWindowPosition);

                console.log('✅ 窗口位置跟踪已初始化');
            } catch (error) {
                console.error('初始化窗口位置跟踪失败:', error);
            }
        }

        // 贴靠屏幕边缘 (左/右)
        async function snapWindowToEdge(edge) {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('snap_window_to_edge', { edge });
                console.log(`🧲 窗口已贴靠到屏幕${edge === 'right' ? '右侧' : '左侧'}`);
            } catch (error) {
                console.error('贴边失败:', error);
            }
        }

        // resize 事件专用防抖（不含贴边触发，仅保存新尺寸）
        function saveWindowPositionDebounced() {
            clearTimeout(savePositionTimeout);
            savePositionTimeout = setTimeout(() => {
                console.log('💾 防抖保存窗口尺寸');
                saveWindowPosition();
            }, 300);
        }

        async function saveWindowPosition() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;

            try {
                const { invoke } = window.__TAURI_INTERNALS__;

                console.log('💾 自动保存窗口位置...');

                // 让后端直接获取窗口位置
                await invoke('save_window_position_auto');

                console.log('✅ 窗口位置保存完成');
            } catch (error) {
                console.error('❌ 保存窗口位置失败:', error);
            }
        }

        // 每分钟更新一次时间显示
        setInterval(() => {
            const timeElements = document.querySelectorAll('.notification-time');
            notifications.forEach((notif, index) => {
                if (timeElements[index]) {
                    timeElements[index].textContent = formatTime(notif.date);
                }
            });
        }, 60000);

        // 重新连接WebSocket
        async function reconnectWebSocket() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;

            try {
                const { invoke } = window.__TAURI_INTERNALS__;

                // 停止当前连接
                await invoke('stop_websocket');

                // 重新启动连接
                await invoke('start_websocket');

                console.log('🔄 WebSocket 重新连接完成');
            } catch (error) {
                console.error('❌ 重新连接失败:', error);
            }
        }

        // 监听配置保存事件
        window.addEventListener('message', async (event) => {
            if (event.data === 'config-saved') {
                console.log('📝 配置已保存，重新连接...');
                // 刷新服务器地址
                try {
                    const { invoke } = window.__TAURI_INTERNALS__;
                    const config = await invoke('get_config');
                    if (config && config.server_url) {
                        serverBaseUrl = config.server_url.replace(/\/+$/, '');
                    }
                } catch (e) {
                    console.warn('⚠️ 刷新服务器地址失败:', e);
                }
                await reconnectWebSocket();
            }
        });
    </script>
