<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gotify 设置</title>
    <style>
        :root {
            --bg-page: #f5f7fa;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --border: #e2e8f0;
            --input-border: #e5e7eb;
            --section-bg: #f8fafc;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --danger: #ef4444;
            --success: #10b981;
        }

        [data-theme="dark"] {
            --bg-page: #0f1419;
            --bg-card: #1a1d24;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-tertiary: #6b7280;
            --border: #2d3748;
            --input-border: #2d3748;
            --section-bg: #16181d;
            --accent: #6366f1;
            --accent-hover: #7c3aed;
            --danger: #f87171;
            --success: #34d399;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, sans-serif;
            background: var(--bg-page);
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s ease;
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-group input.error {
            border-color: var(--danger);
        }

        .error-message {
            color: var(--danger);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .form-group.error .error-message {
            display: block;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-primary:disabled {
            background: var(--text-tertiary);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--section-bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--input-border);
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .status.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        .connection-test {
            background: var(--section-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .connection-test h3 {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-tertiary);
        }

        .status-dot.connected {
            background: var(--success);
        }

        .status-dot.disconnected {
            background: var(--danger);
        }

        /* 开关样式 */
        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: var(--section-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-top: 16px;
        }

        .toggle-group label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
        }

        .toggle-group .toggle-desc {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #d1d5db;
            border-radius: 24px;
            transition: 0.3s;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            left: 2px; bottom: 2px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle-switch input:checked + .toggle-slider {
            background: var(--accent);
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(20px);
        }
    </style>
</head>

<body>
    <!-- Tauri API 初始化脚本 -->
    <script src="tauri-api.js"></script>

    <div class="container">
        <div class="header">
            <h1>🔔 Gotify 服务器设置</h1>
            <p>配置 Gotify 服务器连接信息</p>
        </div>

        <div id="status" class="status"></div>

        <div class="connection-test">
            <h3>连接状态</h3>
            <div class="connection-status">
                <div id="statusDot" class="status-dot disconnected"></div>
                <span id="statusText">未连接</span>
            </div>
        </div>

        <form id="settingsForm">
            <div class="form-group">
                <label for="serverUrl">服务器地址</label>
                <input type="url" id="serverUrl" placeholder="http://your-gotify-server:8080" required>
                <div class="error-message">请输入有效的服务器地址</div>
            </div>

            <div class="form-group">
                <label for="clientToken">客户端Token(Clients token)</label>
                <input type="password" id="clientToken" placeholder="输入你的客户端 token(Clients token)" required>
                <div class="error-message">请输入客户端 token(Clients token)</div>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-secondary" onclick="testConnection()">测试连接</button>
                <button type="submit" class="btn btn-primary">保存设置</button>
            </div>
        </form>

        <div class="toggle-group">
            <div>
                <label for="autoLaunch">开机自启动</label>
                <div class="toggle-desc">登录 Mac 时自动启动 Gotify</div>
            </div>
            <label class="toggle-switch">
                <input type="checkbox" id="autoLaunch" onchange="toggleAutoLaunch(this.checked)">
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>

    <script>
        let currentConfig = null;

        // 初始化设置页面
        async function initSettings() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') {
                showStatus('Tauri API 不可用', 'error');
                return;
            }

            try {
                // 同步主题
                await syncTheme();

                const { invoke } = window.__TAURI_INTERNALS__;

                // 获取当前配置
                const config = await invoke('get_config');
                currentConfig = config;

                if (config) {
                    document.getElementById('serverUrl').value = config.server_url;
                    document.getElementById('clientToken').value = config.client_token;
                }

                // 检查实际的 WebSocket 连接状态
                try {
                    const isRunning = await invoke('is_websocket_running');
                    updateConnectionStatus(isRunning);
                } catch {
                    updateConnectionStatus(false);
                }
            } catch (error) {
                console.error('获取配置失败:', error);
                showStatus('获取配置失败', 'error');
            }
        }

        // 显示状态消息
        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';

            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 3000);
        }

        // 更新连接状态显示
        function updateConnectionStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            if (connected) {
                statusDot.className = 'status-dot connected';
                statusText.textContent = '已连接';
            } else {
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = '未连接';
            }
        }

        // 测试连接
        async function testConnection() {
            const serverUrl = document.getElementById('serverUrl').value.trim();
            const clientToken = document.getElementById('clientToken').value.trim();

            if (!serverUrl || !clientToken) {
                showStatus('请填写完整的服务器信息', 'error');
                return;
            }

            // 基本URL验证
            try {
                new URL(serverUrl);
            } catch {
                showStatus('请输入有效的服务器地址', 'error');
                return;
            }

            showStatus('正在测试连接...', 'info');
            updateConnectionStatus(false);

            try {
                const { invoke } = window.__TAURI_INTERNALS__;

                // 使用新的 test_connection 命令
                const result = await invoke('test_connection', {
                    serverUrl,
                    clientToken
                });

                console.log('✅ 连接测试成功:', result);
                showStatus('✅ ' + result, 'success');
                updateConnectionStatus(true);

                // 3秒后重置状态
                setTimeout(() => {
                    updateConnectionStatus(false);
                }, 3000);

            } catch (error) {
                console.error('❌ 连接测试失败:', error);
                showStatus('❌ ' + error, 'error');
                updateConnectionStatus(false);
            }
        }

        // 保存设置
        async function saveSettings() {
            const serverUrl = document.getElementById('serverUrl').value.trim();
            const clientToken = document.getElementById('clientToken').value.trim();

            // 表单验证
            let hasError = false;

            const urlInput = document.getElementById('serverUrl');
            const tokenInput = document.getElementById('clientToken');

            // 重置错误状态
            urlInput.classList.remove('error');
            tokenInput.classList.remove('error');
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');

            // 验证服务器地址
            if (!serverUrl) {
                urlInput.classList.add('error');
                hasError = true;
            } else {
                try {
                    new URL(serverUrl);
                } catch {
                    urlInput.classList.add('error');
                    hasError = true;
                }
            }

            // 验证Token
            if (!clientToken) {
                tokenInput.classList.add('error');
                hasError = true;
            }

            if (hasError) {
                showStatus('请检查输入信息', 'error');
                return;
            }

            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('save_config_to_file', { serverUrl, clientToken });

                showStatus('设置已保存！', 'success');

                // 通知主窗口重新加载配置
                if (window.opener) {
                    window.opener.postMessage('config-saved', '*');
                }

                // 3秒后关闭窗口
                setTimeout(() => {
                    window.close();
                }, 1500);

            } catch (error) {
                console.error('保存设置失败:', error);
                showStatus('保存设置失败', 'error');
            }
        }

        // 表单提交
        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await saveSettings();
        });

        // 加载开机启动状态
        async function loadAutoLaunch() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                const enabled = await invoke('get_auto_launch');
                document.getElementById('autoLaunch').checked = enabled;
            } catch (error) {
                console.error('获取开机启动状态失败:', error);
            }
        }

        // 切换开机启动
        async function toggleAutoLaunch(enabled) {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('set_auto_launch', { enabled });
                showStatus(enabled ? '已开启开机自启动' : '已关闭开机自启动', 'success');
            } catch (error) {
                console.error('设置开机启动失败:', error);
                showStatus('设置开机启动失败: ' + error, 'error');
                document.getElementById('autoLaunch').checked = !enabled;
            }
        }

        // 同步主题
        async function syncTheme() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                const theme = await invoke('get_system_theme');
                document.documentElement.setAttribute('data-theme', theme);
            } catch {
                // 忽略
            }
        }

        // 监听连接状态事件
        function listenConnectionStatus() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            const { listen } = window.__TAURI_INTERNALS__;
            if (listen) {
                listen('websocket-status', (event) => {
                    updateConnectionStatus(event.payload === 'connected');
                });
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            initSettings();
            loadAutoLaunch();
            listenConnectionStatus();
        });

        // 监听来自主窗口的消息
        window.addEventListener('message', (event) => {
            if (event.data === 'config-saved') {
                // 重新加载配置
                initSettings();
            }
        });
    </script>
</body>

</html>
