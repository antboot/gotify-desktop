<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gotify 设置</title>
    <style>
        :root {
            --bg-page: #f5f7fa;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --border: #e2e8f0;
            --input-border: #e5e7eb;
            --section-bg: #f8fafc;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --danger: #ef4444;
            --success: #10b981;
        }

        [data-theme="dark"] {
            --bg-page: #0f1419;
            --bg-card: #1a1d24;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-tertiary: #6b7280;
            --border: #2d3748;
            --input-border: #2d3748;
            --section-bg: #16181d;
            --accent: #6366f1;
            --accent-hover: #7c3aed;
            --danger: #f87171;
            --success: #34d399;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, sans-serif;
            background: var(--bg-page);
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .header h1 {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 13px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 13px;
            transition: border-color 0.2s ease;
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-group input.error {
            border-color: var(--danger);
        }

        .error-message {
            color: var(--danger);
            font-size: 11px;
            margin-top: 2px;
            display: none;
        }

        .form-group.error .error-message {
            display: block;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-primary:disabled {
            background: var(--text-tertiary);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--section-bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--input-border);
        }

        .status {
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .status.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        .connection-test {
            background: var(--section-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 14px;
        }

        .connection-test h3 {
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .connection-inline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: var(--section-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-primary);
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-tertiary);
        }

        .status-dot.connected {
            background: var(--success);
        }

        .status-dot.disconnected {
            background: var(--danger);
        }

        /* 开关样式 */
        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: var(--section-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .toggle-group:last-child {
            margin-bottom: 0;
        }

        .toggle-group label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
        }

        .toggle-group .toggle-desc {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #d1d5db;
            border-radius: 24px;
            transition: 0.3s;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            left: 2px; bottom: 2px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle-switch input:checked + .toggle-slider {
            background: var(--accent);
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(20px);
        }

        /* 设置区域 */
        .settings-section {
            margin-bottom: 14px;
        }

        .settings-section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .toggle-group {
            margin-bottom: 8px;
        }

        .toggle-group:last-child {
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <!-- Tauri API 初始化脚本 -->
    <script src="lang.js"></script>
    <script src="tauri-api.js"></script>

    <div class="container">
        <div id="status" class="status"></div>

        <!-- 服务器配置 -->
        <div class="settings-section">
            <div class="connection-inline">
                <span data-i18n="connectionStatus">连接状态</span>
                <div class="connection-status">
                    <div id="statusDot" class="status-dot disconnected"></div>
                    <span id="statusText" data-i18n="disconnected">未连接</span>
                </div>
            </div>
        </div>

        <div class="settings-section">
            <div class="form-group">
                <label for="serverUrl" data-i18n="serverAddress">服务器地址</label>
                <input type="url" id="serverUrl" data-i18n-placeholder="serverAddressPlaceholder" placeholder="http://your-gotify-server:8080" required>
                <div class="error-message" data-i18n="enterValidUrl">请输入有效的服务器地址</div>
            </div>

            <div class="form-group">
                <label for="clientToken" data-i18n="clientToken">客户端Token(Clients token)</label>
                <input type="password" id="clientToken" data-i18n-placeholder="clientTokenPlaceholder" placeholder="输入你的客户端 token" required>
                <div class="error-message">请输入客户端 token(Clients token)</div>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-secondary" onclick="testConnection()" data-i18n="testConnection">测试连接</button>
                <button type="button" class="btn btn-primary" onclick="saveSettings()" data-i18n="saveSettings">保存设置</button>
            </div>
        </div>

        <!-- 应用设置 -->
        <div class="settings-section">
            <div class="settings-section-title" data-i18n="appSettings">应用设置</div>

            <div class="toggle-group">
                <div>
                    <label for="showInDock" data-i18n="showInDock">在 Dock 中显示</label>
                    <div class="toggle-desc" data-i18n="showInDockDesc">在 Dock 栏显示应用图标</div>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="showInDock" onchange="toggleShowInDock(this.checked)">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="toggle-group">
                <div>
                    <label for="autoLaunch" data-i18n="autoLaunch">开机自启动</label>
                    <div class="toggle-desc" data-i18n="autoLaunchDesc">登录 Mac 时自动启动 Gotify</div>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="autoLaunch" onchange="toggleAutoLaunch(this.checked)">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>

        <!-- 声音设置 -->
        <div class="settings-section">
            <div class="settings-section-title" data-i18n="soundSettings">声音设置</div>

            <div class="toggle-group">
                <div>
                    <label for="soundEnabled" data-i18n="enableSound">开启通知声音</label>
                    <div class="toggle-desc" data-i18n="enableSoundDesc">收到 Gotify 通知时播放提示音</div>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="soundEnabled" onchange="saveSoundSettings()">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="form-group" style="margin-top: 10px;">
                <label for="minPriority" data-i18n="soundThreshold">声音触发门槛</label>
                <select id="minPriority" onchange="saveSoundSettings()" style="width: 100%; padding: 8px; border: 2px solid var(--input-border); border-radius: 8px; background: var(--bg-card); color: var(--text-primary); font-size: 13px;">
                    <option value="0" data-i18n="allPriorities">所有通知 (优先级 >= 0)</option>
                    <option value="5" data-i18n="mediumHighPriorities">中高优先级 (优先级 >= 5)</option>
                    <option value="8" data-i18n="highOnly">仅高优先级 (优先级 >= 8)</option>
                </select>
            </div>

            <div class="button-group" style="margin-top: 10px;">
                <button type="button" class="btn btn-secondary" onclick="testNotificationSound()" data-i18n="testSound">🔊 测试声音</button>
            </div>
        </div>
    </div>

    <script>
        let currentConfig = null;

        // 更新翻译
        function updateTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.dataset.i18n);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.dataset.i18nPlaceholder);
            });
        }

        // 初始化设置页面
        async function initSettings() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') {
                showStatus(t('tauriUnavailable'), 'error');
                return;
            }

            try {
                // 同步主题
                await syncTheme();

                const { invoke } = window.__TAURI_INTERNALS__;

                // 获取当前配置
                const config = await invoke('get_config');
                currentConfig = config;

                if (config) {
                    document.getElementById('serverUrl').value = config.server_url;
                    document.getElementById('clientToken').value = config.client_token;
                }

                // 检查实际的 WebSocket 连接状态
                try {
                    const isRunning = await invoke('is_websocket_running');
                    updateConnectionStatus(isRunning);
                } catch {
                    updateConnectionStatus(false);
                }
            } catch (error) {
                console.error('获取配置失败:', error);
                showStatus(t('configLoadFailed'), 'error');
            }
        }

        // 显示状态消息
        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';

            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 3000);
        }

        // 更新连接状态显示
        function updateConnectionStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            if (connected) {
                statusDot.className = 'status-dot connected';
                statusText.textContent = t('connected');
            } else {
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = t('disconnected');
            }
        }

        // 测试连接
        async function testConnection() {
            const serverUrl = document.getElementById('serverUrl').value.trim();
            const clientToken = document.getElementById('clientToken').value.trim();

            if (!serverUrl || !clientToken) {
                showStatus(t('fillServerInfo'), 'error');
                return;
            }

            // 基本URL验证
            try {
                new URL(serverUrl);
            } catch {
                showStatus(t('enterValidUrl'), 'error');
                return;
            }

            showStatus(t('testingConnection'), 'info');
            updateConnectionStatus(false);

            try {
                const { invoke } = window.__TAURI_INTERNALS__;

                // 使用新的 test_connection 命令
                const result = await invoke('test_connection', {
                    serverUrl,
                    clientToken
                });

                console.log('✅ 连接测试成功:', result);
                showStatus('✅ ' + result, 'success');
                updateConnectionStatus(true);

                // 3秒后重置状态
                setTimeout(() => {
                    updateConnectionStatus(false);
                }, 3000);

            } catch (error) {
                console.error('❌ 连接测试失败:', error);
                showStatus('❌ ' + error, 'error');
                updateConnectionStatus(false);
            }
        }

        // 保存设置
        async function saveSettings() {
            const serverUrl = document.getElementById('serverUrl').value.trim();
            const clientToken = document.getElementById('clientToken').value.trim();

            // 表单验证
            let hasError = false;

            const urlInput = document.getElementById('serverUrl');
            const tokenInput = document.getElementById('clientToken');

            // 重置错误状态
            urlInput.classList.remove('error');
            tokenInput.classList.remove('error');
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');

            // 验证服务器地址
            if (!serverUrl) {
                urlInput.classList.add('error');
                hasError = true;
            } else {
                try {
                    new URL(serverUrl);
                } catch {
                    urlInput.classList.add('error');
                    hasError = true;
                }
            }

            // 验证Token
            if (!clientToken) {
                tokenInput.classList.add('error');
                hasError = true;
            }

            if (hasError) {
                showStatus(t('fillServerInfo'), 'error');
                return;
            }

            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('save_config_to_file', { serverUrl, clientToken });

                showStatus(t('settingsSaved'), 'success');

                // 通知主窗口重新加载配置
                if (window.opener) {
                    window.opener.postMessage('config-saved', '*');
                }

                // 3秒后关闭窗口
                setTimeout(() => {
                    window.close();
                }, 1500);

            } catch (error) {
                console.error('保存设置失败:', error);
                showStatus(t('settingsSaveFailed'), 'error');
            }
        }

        // 加载开机启动状态
        async function loadAutoLaunch() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                const enabled = await invoke('get_auto_launch');
                document.getElementById('autoLaunch').checked = enabled;
            } catch (error) {
                console.error('获取开机启动状态失败:', error);
            }
        }

        // 切换开机启动
        async function toggleAutoLaunch(enabled) {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('set_auto_launch', { enabled });
                showStatus(enabled ? t('autoLaunchEnabled') : t('autoLaunchDisabled'), 'success');
            } catch (error) {
                console.error('设置开机启动失败:', error);
                showStatus(t('autoLaunchFailed') + ': ' + error, 'error');
                document.getElementById('autoLaunch').checked = !enabled;
            }
        }

        // 同步主题
        async function syncTheme() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                const theme = await invoke('get_system_theme');
                document.documentElement.setAttribute('data-theme', theme);
            } catch {
                // 忽略
            }
        }

        // 加载 Dock 显示状态
        async function loadShowInDock() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                const enabled = await invoke('get_show_in_dock');
                document.getElementById('showInDock').checked = enabled;
            } catch (error) {
                console.error('获取 Dock 设置失败:', error);
            }
        }

        // 切换 Dock 显示
        async function toggleShowInDock(enabled) {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('set_show_in_dock', { enabled });
                showStatus(enabled ? t('showInDockEnabled') : t('showInDockDisabled'), 'success');
            } catch (error) {
                console.error('设置 Dock 显示失败:', error);
                showStatus(t('showInDockFailed') + ': ' + error, 'error');
                document.getElementById('showInDock').checked = !enabled;
            }
        }

        // 监听连接状态事件
        function listenConnectionStatus() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            const { listen } = window.__TAURI_INTERNALS__;
            if (listen) {
                listen('websocket-status', (event) => {
                    updateConnectionStatus(event.payload === 'connected');
                });
            }
        }

        // 加载声音设置
        async function loadSoundSettings() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                const soundConfig = await invoke('get_sound_config');
                if (soundConfig) {
                    document.getElementById('soundEnabled').checked = soundConfig.sound_enabled;
                    document.getElementById('minPriority').value = soundConfig.min_priority || 0;
                }
            } catch (error) {
                console.error('加载声音设置失败:', error);
            }
        }

        // 保存声音设置
        async function saveSoundSettings() {
            if (typeof window.__TAURI_INTERNALS__ === 'undefined') return;
            const soundEnabled = document.getElementById('soundEnabled').checked;
            const minPriority = parseInt(document.getElementById('minPriority').value, 10) || 0;
            try {
                const { invoke } = window.__TAURI_INTERNALS__;
                await invoke('save_sound_config', { soundEnabled, minPriority });
                showStatus(t('settingsSaved'), 'success');
            } catch (error) {
                console.error('保存声音设置失败:', error);
                showStatus(t('settingsSaveFailed'), 'error');
            }
        }

        // 测试通知声音
        function testNotificationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;

                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(587.33, now);
                osc1.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.4);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(880, now + 0.12);
                gain2.gain.setValueAtTime(0.4, now + 0.12);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.12);
                osc2.stop(now + 0.5);

                showStatus('🔊 音效测试播放成功', 'success');
            } catch (e) {
                console.error('播放音效失败:', e);
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            updateTranslations();
            initSettings();
            loadAutoLaunch();
            loadShowInDock();
            loadSoundSettings();
            listenConnectionStatus();
        });

        // 监听来自主窗口的消息
        window.addEventListener('message', (event) => {
            if (event.data === 'config-saved') {
                // 重新加载配置
                initSettings();
            }
        });
    </script>
</body>

</html>
