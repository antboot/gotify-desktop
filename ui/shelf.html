<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; media-src 'self' data: http: https:; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面应用盒</title>
    <style>
        :root {
            --bg-primary: #0f1419;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-tertiary: #6b7280;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --widget-opacity: 0.45;
        }

        [data-theme="light"] {
            --bg-primary: #f5f7fa;
            --text-primary: #1a1a2e;
            --text-secondary: #4b5563;
            --text-tertiary: #9ca3af;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background: transparent !important;
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, sans-serif;
        }

        .container {
            width: 100vw;
            height: 100vh;
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            background: transparent !important;
            background-color: transparent !important;
            overflow: hidden;
            border: none !important;
            box-shadow: none !important;
        }

        /* 桌面应用盒卡片：26px 连续曲率圆角，100% 释放 macOS 原生 NSGlassEffectView 光学透镜 */
        .desktop-widget-card {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 26px !important;
            overflow: hidden !important;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: transform;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            /* 默认 0 底色遮罩（--glass-tint-alpha: 0），让原生 NSGlassEffectView 100% 原汁原味呈现 */
            background: rgba(10, 14, 24, var(--glass-tint-alpha, 0)) !important;
            border: none !important;
            box-shadow: inset 0 calc(0.06 * var(--glass-arc-height, 20px) * var(--glass-highlight-mul, 1)) 0 rgba(255, 255, 255, calc(0.50 * var(--glass-highlight-mul, 1))),
                        inset 0 calc(-0.05 * var(--glass-arc-height, 20px) * var(--glass-highlight-mul, 1)) 0 rgba(255, 255, 255, calc(0.25 * var(--glass-highlight-mul, 1))),
                        inset 0 0 0 0.5px rgba(255, 255, 255, calc(0.20 * var(--glass-highlight-mul, 1))) !important;
            display: flex !important;
            flex-direction: column !important;
            box-sizing: border-box !important;
            color: #f3f4f6 !important;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto !important;
            cursor: grab;
            transition: background 0.2s ease;
        }

        .desktop-widget-card::before {
            display: none !important;
        }

        .desktop-widget-card.is-active,
        .desktop-widget-card.is-focused {
            background: rgba(10, 14, 24, var(--glass-tint-alpha, 0)) !important;
            border: none !important;
            box-shadow: inset 0 calc(0.06 * var(--glass-arc-height, 20px) * var(--glass-highlight-mul, 1)) 0 rgba(255, 255, 255, calc(0.50 * var(--glass-highlight-mul, 1))),
                        inset 0 calc(-0.05 * var(--glass-arc-height, 20px) * var(--glass-highlight-mul, 1)) 0 rgba(255, 255, 255, calc(0.25 * var(--glass-highlight-mul, 1))),
                        inset 0 0 0 0.5px rgba(255, 255, 255, calc(0.20 * var(--glass-highlight-mul, 1))) !important;
        }

        .desktop-widget-card.is-transitioning {
            transition: background 0.3s ease;
        }

        [data-theme="light"] .desktop-widget-card,
        [data-theme="light"] .desktop-widget-card.is-active,
        [data-theme="light"] .desktop-widget-card.is-focused {
            background: rgba(255, 255, 255, var(--glass-tint-alpha, 0)) !important;
            border: none !important;
            box-shadow: inset 0 calc(0.06 * var(--glass-arc-height, 20px) * var(--glass-highlight-mul, 1)) 0 rgba(255, 255, 255, calc(0.75 * var(--glass-highlight-mul, 1))),
                        inset 0 calc(-0.05 * var(--glass-arc-height, 20px) * var(--glass-highlight-mul, 1)) 0 rgba(0, 0, 0, calc(0.12 * var(--glass-highlight-mul, 1))),
                        inset 0 0 0 0.5px rgba(255, 255, 255, calc(0.40 * var(--glass-highlight-mul, 1))) !important;
            color: #1a1a2e !important;
        }

        .widget-header {
            height: 38px;
            padding: 0 12px 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            pointer-events: auto !important;
            cursor: grab;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .desktop-widget-card.header-hidden .widget-header {
            display: none !important;
        }

        .desktop-widget-card.header-hidden .shelf-content {
            padding: 12px 10px 10px 10px !important;
        }

        [data-theme="light"] .widget-header {
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .widget-status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: -0.2px;
            cursor: grab;
        }

        .shelf-badge {
            font-size: 10.5px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 10px;
            background: rgba(99, 102, 241, 0.25);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .widget-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: default;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 13px;
            transition: all 0.15s ease;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
        }

        .icon-btn.close-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        /* 应用网格区 */
        .shelf-content {
            flex: 1;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px;
            box-sizing: border-box;
            cursor: default;
        }

        .shelf-content::-webkit-scrollbar {
            width: 4px;
        }

        .shelf-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(66px, 1fr));
            gap: 10px 8px;
            align-items: start;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 6px 4px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), background 0.15s ease;
            position: relative;
            text-align: center;
        }

        .app-item:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .app-item:active {
            transform: scale(0.95);
        }

        [data-theme="light"] .app-item:hover {
            background: rgba(0, 0, 0, 0.06);
        }

        .app-icon {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            object-fit: contain;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            margin-bottom: 5px;
            pointer-events: none;
        }

        .app-title {
            font-size: 11px;
            font-weight: 500;
            line-height: 1.25;
            color: var(--text-primary);
            max-width: 62px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] .app-title {
            text-shadow: none;
        }

        /* 空状态 */
        .shelf-empty {
            height: 100%;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            color: var(--text-tertiary);
            padding: 16px;
            border: 1.5px dashed rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            margin: 6px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .shelf-empty:hover {
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(99, 102, 241, 0.05);
            color: var(--text-secondary);
        }

        [data-theme="light"] .shelf-empty {
            border-color: rgba(0, 0, 0, 0.15);
        }

        .shelf-empty-icon {
            font-size: 28px;
            opacity: 0.8;
        }

        .shelf-empty-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .shelf-empty-hint {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* 拖拽浮层 (Dropzone Overlay) */
        .dropzone-overlay {
            position: absolute;
            inset: 0;
            background: rgba(99, 102, 241, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px dashed #818cf8;
            border-radius: 16px;
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            pointer-events: none;
        }

        .dropzone-overlay.active {
            display: flex;
            animation: fadeIn 0.15s ease-out;
        }

        /* 右键菜单 */
        .context-menu {
            position: fixed;
            background: rgba(30, 36, 50, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            padding: 5px;
            min-width: 160px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            display: none;
            animation: fadeIn 0.15s ease-out;
        }

        [data-theme="light"] .context-menu {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.12);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .context-menu-item {
            padding: 7px 10px;
            font-size: 12px;
            color: var(--text-primary);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.12s ease;
        }

        .context-menu-item:hover {
            background: var(--accent);
            color: #ffffff;
        }

        .context-menu-item.danger:hover {
            background: var(--danger);
            color: #ffffff;
        }

        .context-menu-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 4px 0;
        }

        [data-theme="light"] .context-menu-divider {
            background: rgba(0, 0, 0, 0.08);
        }

        /* 液态玻璃风格与透明度调节 Popover */
        /* 液态玻璃风格与光学调优 Popover：精致 macOS 磨砂面板 */
        .widget-opacity-popover {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 1000;
            width: 278px;
            max-width: calc(100% - 16px);
            max-height: calc(100% - 16px);
            overflow-y: auto;
            background: rgba(18, 24, 38, 0.94);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 18px;
            padding: 12px 14px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 9px;
            animation: fadeIn 0.15s ease-out;
        }

        .widget-opacity-popover::-webkit-scrollbar {
            width: 4px;
        }

        .widget-opacity-popover::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
        }

        [data-theme="light"] .widget-opacity-popover {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(0, 0, 0, 0.12);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.05);
        }

        .popover-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding-bottom: 2px;
        }

        .popover-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .opacity-val-badge {
            font-size: 10px;
            font-weight: 700;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.14);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 1px 6px;
            border-radius: 5px;
            white-space: nowrap;
        }

        .glass-nav-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .glass-step-btn {
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: var(--text-primary);
            font-size: 10.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .glass-step-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .glass-style-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .glass-chip {
            padding: 6px 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.15s ease;
        }

        .glass-chip:hover {
            background: rgba(255, 255, 255, 0.16);
            color: var(--text-primary);
        }

        .glass-chip.active {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.92), rgba(99, 102, 241, 0.92));
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.55);
            box-shadow: 0 2px 10px rgba(14, 165, 233, 0.4);
        }

        .glass-desc-bar {
            font-size: 10.5px;
            color: var(--text-secondary);
            text-align: center;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            font-weight: 500;
        }

        .tuning-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .tuning-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tuning-label {
            font-size: 10.5px;
            color: var(--text-primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tuning-hint {
            font-size: 9px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .tuning-val {
            font-size: 10.5px;
            font-weight: 700;
            color: #38bdf8;
            font-family: ui-monospace, SFMono-Regular, monospace;
        }

        .opacity-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
        }

        .opacity-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .preset-row {
            display: flex;
            gap: 4px;
            justify-content: space-between;
        }

        .preset-chip {
            flex: 1;
            padding: 3px 0;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            font-size: 9.5px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .preset-chip:hover {
            background: rgba(255, 255, 255, 0.16);
            color: var(--text-primary);
        }

        .preset-chip.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="desktop-widget-card" id="shelfCard" oncontextmenu="onCardContextMenu(event)" onmousedown="onCardMouseDown(event)">
            <!-- 头部 -->
            <div class="widget-header" id="shelfHeader" onmousedown="onHeaderMouseDown(event)">
                <div class="widget-status">
                    <span>🗂️</span>
                    <span id="shelfTitle">应用盒</span>
                    <span id="shelfBadge" class="shelf-badge">0</span>
                </div>
                <div class="widget-actions" onmousedown="event.stopPropagation()">
                    <button class="icon-btn" onclick="onAddAppClick(event)" title="添加应用...">➕</button>
                    <button class="icon-btn" id="opacityBtn" onclick="toggleOpacityPopover(event)" title="液态玻璃风格与透明度">💧</button>
                    <button class="icon-btn" onclick="toggleTheme(event)" title="切换深/浅主题">🌓</button>
                    <button class="icon-btn" onclick="toggleHeaderBar(event)" title="隐藏顶部栏 (右键菜单可重新显示)">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="18 15 12 9 6 15"></polyline>
                        </svg>
                    </button>
                    <button class="icon-btn close-btn" onclick="closeShelf(event)" title="隐藏应用盒">✕</button>
                </div>
            </div>

            <!-- 应用列表 -->
            <div class="shelf-content" id="shelfContent">
                <div class="app-grid" id="appGrid"></div>
            </div>

            <!-- 拖拽提示浮层 -->
            <div class="dropzone-overlay" id="dropOverlay">
                <span style="font-size: 26px;">📥</span>
                <span>释放以添加到应用盒</span>
            </div>

            <!-- 液态玻璃风格与光学调优弹窗 -->
            <div class="widget-opacity-popover" id="opacityPopover" style="display: none;" onmousedown="event.stopPropagation()">
                <div class="popover-header">
                    <span class="popover-title">💧 液态玻璃 <span class="opacity-val-badge" id="glassVariantBadge">v11</span></span>
                    <div style="display:flex; gap:4px; align-items:center;">
                        <button class="glass-step-btn" id="glassPolarityBtn" onclick="toggleGlassPolarity(event)" title="切换亮色/暗色光学棱镜">☀️亮棱镜</button>
                        <button class="glass-step-btn" onclick="toggleOpacityPopover(event)" title="关闭面板">✕</button>
                    </div>
                </div>

                <!-- 4款精心雕琢的液态玻璃风格（全部基于v11纯正液态透镜引擎衍生） -->
                <div class="glass-style-grid" id="glassStyleGrid">
                    <button class="glass-chip active" data-variant="11" onclick="setGlassVariant(11, event)" title="原生水滴透镜：零模糊纯透折射，保留原生上下高光亮边">💧 晶透水滴</button>
                    <button class="glass-chip" data-variant="13" onclick="setGlassVariant(13, event)" title="深弧透镜：-76 超强折射曲率，28px 光学张力宽弧">🔍 深弧透镜</button>
                    <button class="glass-chip" data-variant="14" onclick="setGlassVariant(14, event)" title="浮光色散：水滴透镜边缘微弱彩虹色散光斑">🌈 浮光色散</button>
                    <button class="glass-chip" data-variant="15" onclick="setGlassVariant(15, event)" title="黑曜水晶：暗调高反差水晶质感，微光边框">💎 黑曜水晶</button>
                </div>

                <div class="glass-desc-bar" id="glassVariantDesc">💧 晶透水滴 · 原生纯正透镜</div>

                <!-- 5项高级光学参数微调 -->
                <div class="tuning-group">
                    <div class="tuning-row">
                        <div class="tuning-label">
                            <span>折射弧度</span>
                            <span class="tuning-hint">(凸透镜曲率)</span>
                        </div>
                        <span class="tuning-val" id="refractValBadge">-50</span>
                    </div>
                    <input type="range" class="opacity-slider" id="refractSlider" min="-90" max="-20" value="-50" step="1"
                        oninput="onRefractSliderInput(event)" onchange="onRefractSliderChange(event)">
                </div>

                <div class="tuning-group">
                    <div class="tuning-row">
                        <div class="tuning-label">
                            <span>反光亮度</span>
                            <span class="tuning-hint">(上下镜面反射)</span>
                        </div>
                        <span class="tuning-val" id="highlightValBadge">100%</span>
                    </div>
                    <input type="range" class="opacity-slider" id="highlightSlider" min="0" max="200" value="100" step="5"
                        oninput="onHighlightSliderInput(event)" onchange="onHighlightSliderChange(event)">
                </div>

                <div class="tuning-group">
                    <div class="tuning-row">
                        <div class="tuning-label">
                            <span>反光厚度</span>
                            <span class="tuning-hint">(光弧纵深高度)</span>
                        </div>
                        <span class="tuning-val" id="arcHeightValBadge">20px</span>
                    </div>
                    <input type="range" class="opacity-slider" id="arcHeightSlider" min="8" max="36" value="20" step="1"
                        oninput="onArcHeightSliderInput(event)" onchange="onArcHeightSliderChange(event)">
                </div>

                <div class="tuning-group">
                    <div class="tuning-row">
                        <div class="tuning-label">
                            <span>磨砂柔焦</span>
                            <span class="tuning-hint">(背景柔和度)</span>
                        </div>
                        <span class="tuning-val" id="blurValBadge">0.0px</span>
                    </div>
                    <input type="range" class="opacity-slider" id="blurSlider" min="0" max="10" value="0" step="0.5"
                        oninput="onBlurSliderInput(event)" onchange="onBlurSliderChange(event)">
                </div>

                <div class="tuning-group">
                    <div class="tuning-row">
                        <div class="tuning-label">
                            <span>底色浓度</span>
                            <span class="tuning-hint">(0%=100%纯原生)</span>
                        </div>
                        <span class="tuning-val" id="opacityBadge">0%</span>
                    </div>
                    <input type="range" class="opacity-slider" id="opacitySlider" min="0" max="75" value="0" step="1"
                        oninput="onOpacityInput(event)" onchange="onOpacityChange(event)">
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
                    <button class="glass-step-btn" style="width:100%; text-align:center;" onclick="resetGlassToDefaults(event)">↺ 恢复当前风格默认值</button>
                </div>
            </div>

            <!-- 右键菜单 -->
            <div class="context-menu" id="contextMenu" onmousedown="event.stopPropagation()">
                <!-- 应用项菜单 -->
                <div id="appMenuSection" style="display: none;">
                    <div class="context-menu-item" onclick="onContextOpenApp()">
                        <span>🚀</span> <span>打开应用</span>
                    </div>
                    <div class="context-menu-item" onclick="onContextShowInFinder()">
                        <span>📂</span> <span>在访达中显示</span>
                    </div>
                    <div class="context-menu-divider"></div>
                    <div class="context-menu-item danger" onclick="onContextRemoveApp()">
                        <span>🗑️</span> <span>从此盒中移除</span>
                    </div>
                    <div class="context-menu-divider"></div>
                </div>
                <!-- 卡片全局菜单 -->
                <div class="context-menu-item" onclick="toggleShelfAlwaysOnTop()">
                    <span id="pinIcon">📌</span> <span id="pinText">悬浮置顶 (前台)</span>
                </div>
                <div class="context-menu-item" onclick="toggleOpacityPopover(event)">
                    <span>💧</span> <span>液态玻璃风格与透明度...</span>
                </div>
                <div class="context-menu-item" onclick="toggleTheme(event)">
                    <span>🌓</span> <span>切换文字深/浅色</span>
                </div>
                <div class="context-menu-item" onclick="toggleHeaderBar(event)">
                    <span id="menuHeaderIcon">🙈</span> <span id="menuHeaderText">隐藏顶部栏</span>
                </div>
                <div class="context-menu-item" onclick="onAddAppClick(event)">
                    <span>➕</span> <span>添加应用程序...</span>
                </div>
                <div class="context-menu-divider"></div>
                <div class="context-menu-item" onclick="closeShelf(event)">
                    <span>✕</span> <span>隐藏此应用盒</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Tauri v2 事件 API -->
    <script type="module">
        import { listen } from './tauri-events.js';
        window.__TAURI_LISTEN__ = listen;
    </script>

    <script>
        let appItems = [];
        let isAlwaysOnTop = false;
        let floatingOpacity = 0.0;
        let desktopOpacity = 0.0;
        let currentOpacity = 0.0;
        let activeContextItemId = null;
        let activeContextItemPath = null;
        let isHeaderHidden = false;

        // 4款精心雕琢的液态玻璃风格（全部基于v11纯正液态透镜引擎衍生）
        const GLASS_VARIANTS = [
            { id: 11, label: '💧 晶透水滴', tag: 'v11 水滴', desc: '原生水滴透镜 · 零模糊纯粹清透 (原汁原味)', defaultRefract: -50, defaultBlur: 0.0, defaultHighlight: 100, defaultArcHeight: 20 },
            { id: 13, label: '🔍 深弧透镜', tag: 'v13 深弧', desc: '-76 强力深弧折射 · 凸透镜光学张力', defaultRefract: -76, defaultBlur: 0.0, defaultHighlight: 120, defaultArcHeight: 28 },
            { id: 14, label: '🌈 浮光色散', tag: 'v14 色散', desc: '水滴透镜 · 边缘微弱彩虹色散光斑', defaultRefract: -58, defaultBlur: 0.0, defaultHighlight: 110, defaultArcHeight: 22 },
            { id: 15, label: '💎 黑曜水晶', tag: 'v15 水晶', desc: '深调水晶质感 · 高对比边缘反光', defaultRefract: -65, defaultBlur: 1.5, defaultHighlight: 130, defaultArcHeight: 24 }
        ];

        let currentGlassVariant = (() => {
            const saved = parseInt(localStorage.getItem('liquid_glass_variant'), 10);
            return (Number.isNaN(saved) || saved < 11 || saved > 15 || saved === 12) ? 11 : saved;
        })();

        // 默认使用 Aqua 亮色光学棱镜（isGlassDark = false），使 v11 呈现晶莹剔透的亮白水滴边缘
        let isGlassDark = localStorage.getItem('liquid_glass_dark') === 'true';

        let currentRefract = (() => {
            const saved = parseFloat(localStorage.getItem('liquid_glass_refract'));
            return Number.isNaN(saved) ? null : saved;
        })();

        let currentBlur = (() => {
            const saved = parseFloat(localStorage.getItem('liquid_glass_blur'));
            return Number.isNaN(saved) ? null : saved;
        })();

        let currentHighlight = (() => {
            const saved = parseFloat(localStorage.getItem('liquid_glass_highlight'));
            return Number.isNaN(saved) ? null : saved;
        })();

        let currentArcHeight = (() => {
            const saved = parseFloat(localStorage.getItem('liquid_glass_arc_height'));
            return Number.isNaN(saved) ? null : saved;
        })();

        const invoke = (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) ?
            window.__TAURI_INTERNALS__.invoke : async () => {};

        // 点击小组件任意区域时，立即将窗口提升至前台并持续保持磨砂半透明状态（至少 3 秒）
        let activeHoldTimer = null;
        let isMouseInsideCard = false;
        let glassEnabled = true;

        function getCurrentVariantInfo() {
            return GLASS_VARIANTS.find(v => v.id === currentGlassVariant) || GLASS_VARIANTS[0];
        }

        function updateGlassVariantUI() {
            const info = getCurrentVariantInfo();
            const badge = document.getElementById('glassVariantBadge');
            if (badge) badge.textContent = `v${info.id}`;
            const desc = document.getElementById('glassVariantDesc');
            if (desc) desc.textContent = info.desc;
            const polBtn = document.getElementById('glassPolarityBtn');
            if (polBtn) polBtn.textContent = isGlassDark ? '🌙暗棱镜' : '☀️亮棱镜';

            document.querySelectorAll('#glassStyleGrid .glass-chip').forEach(btn => {
                const vid = parseInt(btn.getAttribute('data-variant'), 10);
                if (vid === currentGlassVariant) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // 更新滑块显示
            const effectiveRefract = currentRefract !== null ? currentRefract : info.defaultRefract;
            const effectiveBlur = currentBlur !== null ? currentBlur : info.defaultBlur;
            const effectiveHighlight = currentHighlight !== null ? currentHighlight : info.defaultHighlight;
            const effectiveArcHeight = currentArcHeight !== null ? currentArcHeight : (info.defaultArcHeight || 20);

            const rSlider = document.getElementById('refractSlider');
            if (rSlider) rSlider.value = effectiveRefract;
            const rBadge = document.getElementById('refractValBadge');
            if (rBadge) rBadge.textContent = effectiveRefract;

            const bSlider = document.getElementById('blurSlider');
            if (bSlider) bSlider.value = effectiveBlur;
            const bBadge = document.getElementById('blurValBadge');
            if (bBadge) bBadge.textContent = `${effectiveBlur.toFixed(1)}px`;

            const hSlider = document.getElementById('highlightSlider');
            if (hSlider) hSlider.value = effectiveHighlight;
            const hBadge = document.getElementById('highlightValBadge');
            if (hBadge) hBadge.textContent = `${effectiveHighlight}%`;
            document.documentElement.style.setProperty('--glass-highlight-mul', (effectiveHighlight / 100.0).toString());

            const aSlider = document.getElementById('arcHeightSlider');
            if (aSlider) aSlider.value = effectiveArcHeight;
            const aBadge = document.getElementById('arcHeightValBadge');
            if (aBadge) aBadge.textContent = `${effectiveArcHeight}px`;
            document.documentElement.style.setProperty('--glass-arc-height', `${effectiveArcHeight}px`);
        }

        function setGlassVariant(variantId, e) {
            if (e) e.stopPropagation();
            currentGlassVariant = variantId;
            localStorage.setItem('liquid_glass_variant', String(variantId));
            // 切换预设时清空手动覆盖，使预设光学质感完整呈现
            currentRefract = null;
            currentBlur = null;
            currentHighlight = null;
            currentArcHeight = null;
            localStorage.removeItem('liquid_glass_refract');
            localStorage.removeItem('liquid_glass_blur');
            localStorage.removeItem('liquid_glass_highlight');
            localStorage.removeItem('liquid_glass_arc_height');
            updateGlassVariantUI();
            syncNativeLiquidGlass();
            syncGlassTuning();
        }

        function toggleGlassPolarity(e) {
            if (e) e.stopPropagation();
            isGlassDark = !isGlassDark;
            localStorage.setItem('liquid_glass_dark', String(isGlassDark));
            updateGlassVariantUI();
            syncNativeLiquidGlass();
        }

        function onRefractSliderInput(e) {
            currentRefract = parseFloat(e.target.value);
            localStorage.setItem('liquid_glass_refract', String(currentRefract));
            const rBadge = document.getElementById('refractValBadge');
            if (rBadge) rBadge.textContent = currentRefract;
            syncGlassTuning();
        }

        function onRefractSliderChange(e) {
            currentRefract = parseFloat(e.target.value);
            localStorage.setItem('liquid_glass_refract', String(currentRefract));
            syncGlassTuning();
        }

        function onBlurSliderInput(e) {
            currentBlur = parseFloat(e.target.value);
            localStorage.setItem('liquid_glass_blur', String(currentBlur));
            const bBadge = document.getElementById('blurValBadge');
            if (bBadge) bBadge.textContent = `${currentBlur.toFixed(1)}px`;
            syncGlassTuning();
        }

        function onBlurSliderChange(e) {
            currentBlur = parseFloat(e.target.value);
            localStorage.setItem('liquid_glass_blur', String(currentBlur));
            syncGlassTuning();
        }

        function onHighlightSliderInput(e) {
            currentHighlight = parseFloat(e.target.value);
            localStorage.setItem('liquid_glass_highlight', String(currentHighlight));
            const hBadge = document.getElementById('highlightValBadge');
            if (hBadge) hBadge.textContent = `${currentHighlight}%`;
            document.documentElement.style.setProperty('--glass-highlight-mul', (currentHighlight / 100.0).toString());
            syncGlassTuning();
        }

        function onHighlightSliderChange(e) {
            currentHighlight = parseFloat(e.target.value);
            localStorage.setItem('liquid_glass_highlight', String(currentHighlight));
            syncGlassTuning();
        }

        function onArcHeightSliderInput(e) {
            currentArcHeight = parseFloat(e.target.value);
            localStorage.setItem('liquid_glass_arc_height', String(currentArcHeight));
            const aBadge = document.getElementById('arcHeightValBadge');
            if (aBadge) aBadge.textContent = `${currentArcHeight}px`;
            document.documentElement.style.setProperty('--glass-arc-height', `${currentArcHeight}px`);
            syncGlassTuning();
        }

        function onArcHeightSliderChange(e) {
            currentArcHeight = parseFloat(e.target.value);
            localStorage.setItem('liquid_glass_arc_height', String(currentArcHeight));
            syncGlassTuning();
        }

        function resetGlassToDefaults(e) {
            if (e) e.stopPropagation();
            currentRefract = null;
            currentBlur = null;
            currentHighlight = null;
            currentArcHeight = null;
            localStorage.removeItem('liquid_glass_refract');
            localStorage.removeItem('liquid_glass_blur');
            localStorage.removeItem('liquid_glass_highlight');
            localStorage.removeItem('liquid_glass_arc_height');
            updateGlassVariantUI();
            syncNativeLiquidGlass();
            syncGlassTuning();
        }

        // 同步 macOS 原生液态玻璃调优参数（折射曲率、柔焦高斯模糊、高光棱镜强度、光弧厚度）
        const syncGlassTuning = () => {
            const info = getCurrentVariantInfo();
            const r = currentRefract !== null ? currentRefract : info.defaultRefract;
            const b = currentBlur !== null ? currentBlur : info.defaultBlur;
            const h = (currentHighlight !== null ? currentHighlight : info.defaultHighlight) / 100.0;
            const a = currentArcHeight !== null ? currentArcHeight : (info.defaultArcHeight || 20);
            document.documentElement.style.setProperty('--glass-highlight-mul', h.toString());
            document.documentElement.style.setProperty('--glass-arc-height', `${a}px`);
            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    window.__TAURI_INTERNALS__.invoke('tune_widget_glass', {
                        refraction: r,
                        blur: b,
                        highlight: h,
                        arcHeight: a
                    }).catch(() => {});
                }
            } catch (_) {}
        };

        // 同步 macOS 原生液态玻璃（NSGlassEffectView + CABackdropLayer 光学折射参数）
        const syncNativeLiquidGlass = (activeOverride) => {
            const active = typeof activeOverride === 'boolean' ? activeOverride : glassEnabled;
            glassEnabled = active;
            const op = typeof currentOpacity === 'number' ? currentOpacity : 0.0;
            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    window.__TAURI_INTERNALS__.invoke('set_widget_glass', {
                        enabled: active,
                        opacity: op,
                        isDark: isGlassDark,
                        variant: currentGlassVariant
                    }).catch(() => {});
                }
            } catch (_) {}
            syncGlassTuning();
        };

        // 鼠标位置驱动的液态玻璃焦散高光坐标更新
        const updateGlassSpecularPoint = (clientX, clientY) => {
            const card = document.getElementById('shelfCard');
            if (!card) return;
            const rect = card.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) return;
            const xPct = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
            const yPct = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));
            card.style.setProperty('--glass-mouse-x', `${xPct.toFixed(1)}%`);
            card.style.setProperty('--glass-mouse-y', `${yPct.toFixed(1)}%`);
        };

        const setWidgetActiveState = (active) => {
            const card = document.getElementById('shelfCard');
            if (!card) return;
            if (active) {
                card.classList.add('is-active', 'is-focused');
            } else {
                card.classList.remove('is-active', 'is-focused');
                // 空闲后主动沉降回桌面底层（小组件窗口不再成为 key 窗口，依赖不到失焦事件）
                try {
                    if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                        window.__TAURI_INTERNALS__.invoke('deactivate_widget_window').catch(() => {});
                    }
                } catch (_) {}
                // 回到平态时重新下发用户的液态玻璃调优参数（反光亮度等）：
                // 激活瞬间 Apple 会用默认高光覆盖原生玻璃的镜面层，需要在这里写回
                syncGlassTuning();
            }
        };

        const keepActive = (duration = 3000) => {
            setWidgetActiveState(true);
            clearTimeout(activeHoldTimer);
            activeHoldTimer = setTimeout(() => {
                if (!isMouseInsideCard) {
                    setWidgetActiveState(false);
                }
            }, duration);
        };

        const activateWidget = () => {
            keepActive(3000);
            try {
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    window.__TAURI_INTERNALS__.invoke('activate_widget_window').catch(() => {});
                }
            } catch (_) {}
        };

        window.addEventListener('mousedown', activateWidget, true);
        window.addEventListener('pointerdown', activateWidget, true);

        // 鼠标移入小组件时更新焦散光斑
        window.addEventListener('mouseenter', (e) => {
            isMouseInsideCard = true;
            if (e && typeof e.clientX === 'number') {
                updateGlassSpecularPoint(e.clientX, e.clientY);
            }
            keepActive(3000);
        });
        window.addEventListener('mousemove', (e) => {
            if (!isMouseInsideCard) {
                isMouseInsideCard = true;
            }
            if (e && typeof e.clientX === 'number') {
                updateGlassSpecularPoint(e.clientX, e.clientY);
            }
        });
        window.addEventListener('mouseleave', () => {
            isMouseInsideCard = false;
            // 鼠标移出后，再保持 3 秒才恢复平态
            keepActive(3000);
        });

        // 窗口真实焦点变化由后端逐窗口精确派发
        const onWindowFocusChanged = (focused) => {
            if (focused) {
                keepActive(3000);
            } else {
                clearTimeout(activeHoldTimer);
                activeHoldTimer = setTimeout(() => {
                    if (!isMouseInsideCard) {
                        setWidgetActiveState(false);
                    }
                }, 3000);
            }
        };


        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            updateGlassVariantUI();
            initTheme();
            syncGlassTuning();
            await loadShelfConfig();
            await refreshShelfItems();
            setupDragDropListeners();
            window.addEventListener('storage', (e) => {
                if (e.key === 'liquid_glass_variant' && e.newValue !== null) {
                    const v = parseInt(e.newValue, 10);
                    if (!Number.isNaN(v) && v !== currentGlassVariant && GLASS_VARIANTS.some(item => item.id === v)) {
                        currentGlassVariant = v;
                        currentRefract = null;
                        currentBlur = null;
                        currentHighlight = null;
                        currentArcHeight = null;
                        updateGlassVariantUI();
                        syncNativeLiquidGlass();
                        syncGlassTuning();
                    }
                } else if (e.key === 'liquid_glass_dark' && e.newValue !== null) {
                    isGlassDark = e.newValue === 'true';
                    updateGlassVariantUI();
                    syncNativeLiquidGlass();
                } else if (e.key === 'liquid_glass_refract' || e.key === 'liquid_glass_blur' || e.key === 'liquid_glass_highlight' || e.key === 'liquid_glass_arc_height') {
                    currentRefract = localStorage.getItem('liquid_glass_refract') !== null ? parseFloat(localStorage.getItem('liquid_glass_refract')) : null;
                    currentBlur = localStorage.getItem('liquid_glass_blur') !== null ? parseFloat(localStorage.getItem('liquid_glass_blur')) : null;
                    currentHighlight = localStorage.getItem('liquid_glass_highlight') !== null ? parseFloat(localStorage.getItem('liquid_glass_highlight')) : null;
                    currentArcHeight = localStorage.getItem('liquid_glass_arc_height') !== null ? parseFloat(localStorage.getItem('liquid_glass_arc_height')) : null;
                    updateGlassVariantUI();
                    syncGlassTuning();
                }
            });
        });

        // 加载配置
        async function loadShelfConfig() {
            try {
                const cfg = await invoke('get_app_shelf_config');
                if (cfg) {
                    if (typeof cfg.floating_opacity === 'number') floatingOpacity = cfg.floating_opacity;
                    if (typeof cfg.desktop_opacity === 'number') desktopOpacity = cfg.desktop_opacity;
                    isAlwaysOnTop = !!cfg.always_on_top;
                    updatePinUI(isAlwaysOnTop);
                    const savedTint = localStorage.getItem('shelf_glass_tint_alpha');
                    const initOp = savedTint !== null ? parseFloat(savedTint) : 0.0;
                    setShelfOpacity(Number.isNaN(initOp) ? 0.0 : initOp, false, false);

                    if (typeof cfg.hide_header === 'boolean') {
                        isHeaderHidden = cfg.hide_header;
                        applyHeaderVisibility(isHeaderHidden);
                    }
                }
            } catch (e) {
                console.warn('获取应用盒配置失败:', e);
            }
        }

        // 刷新应用列表
        async function refreshShelfItems() {
            try {
                const items = await invoke('get_app_shelf_items');
                appItems = Array.isArray(items) ? items : [];
                renderAppGrid();
            } catch (e) {
                console.error('获取应用列表失败:', e);
            }
        }

        // 渲染网格
        function renderAppGrid() {
            const grid = document.getElementById('appGrid');
            const badge = document.getElementById('shelfBadge');
            if (badge) badge.textContent = appItems.length;

            if (appItems.length === 0) {
                grid.innerHTML = `
                    <div class="shelf-empty" onclick="onAddAppClick(event)">
                        <div class="shelf-empty-icon">🗂️</div>
                        <div class="shelf-empty-title">拖拽应用到此处</div>
                        <div class="shelf-empty-hint">从访达将常用 App 拖入生成快捷方式<br>或点击此处浏览选择</div>
                    </div>
                `;
                grid.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            grid.innerHTML = appItems.map(item => {
                const iconSrc = item.icon_data || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="%236366f1"><rect width="20" height="20" x="2" y="2" rx="5"/></svg>';
                return `
                    <div class="app-item" data-id="${item.id}" data-path="${encodeURIComponent(item.path)}"
                        onclick="onAppItemClick('${encodeURIComponent(item.path)}')"
                        oncontextmenu="onAppItemContextMenu(event, '${item.id}', '${encodeURIComponent(item.path)}')"
                        title="${escapeHtml(item.name)}&#10;${escapeHtml(item.path)}">
                        <img class="app-icon" src="${iconSrc}" alt="${escapeHtml(item.name)}" draggable="false">
                        <span class="app-title">${escapeHtml(item.name)}</span>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            return (text || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[m]);
        }

        // 点击应用打开
        async function onAppItemClick(encodedPath) {
            const path = decodeURIComponent(encodedPath);
            try {
                await invoke('open_app_item', { path });
            } catch (e) {
                console.error('打开应用失败:', e);
            }
        }

        // 添加应用
        async function onAddAppClick(e) {
            if (e) e.stopPropagation();
            closeContextMenu();
            try {
                const items = await invoke('pick_and_add_app');
                if (Array.isArray(items)) {
                    appItems = items;
                    renderAppGrid();
                }
            } catch (e) {
                console.error('选择应用失败:', e);
            }
        }

        async function tauriListen(eventName, cb, targetLabel) {
            const target = targetLabel
                ? { kind: 'WebviewWindow', label: targetLabel }
                : { kind: 'Any' };
            const options = targetLabel ? { target } : undefined;
            if (typeof window.__TAURI_LISTEN__ === 'function') {
                return window.__TAURI_LISTEN__(eventName, cb, options);
            }
            if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke && window.__TAURI_INTERNALS__.transformCallback) {
                return window.__TAURI_INTERNALS__.invoke('plugin:event|listen', {
                    event: eventName,
                    target: target,
                    handler: window.__TAURI_INTERNALS__.transformCallback(cb)
                });
            }
            return null;
        }

        // 拖拽与更新监听
        function setupDragDropListeners() {
            const overlay = document.getElementById('dropOverlay');

            // 监听后端逐窗口派发的真实焦点变化（替代易串扰的 DOM focus/blur）
            // 注意：必须显式指定 target 为本窗口，否则 Tauri 对默认 Any 目标的监听器不做过滤，事件会串到另一个小组件
            tauriListen('widget-focus', (event) => {
                const focused = !!(event && event.payload && event.payload.focused);
                onWindowFocusChanged(focused);
            }, 'app_shelf');

            // 监听后端原生光标轮询：macOS 对失焦/底层窗口会丢失 mouseleave，
            // 这里用原生轮询同步"鼠标是否在卡片内"，确保离开后磨砂能按时消退，并同步光斑坐标
            tauriListen('native-mouse-hover', (event) => {
                const payload = (event && event.payload) || {};
                const inside = !!payload.inside;
                if (inside && typeof payload.x === 'number' && typeof payload.y === 'number') {
                    updateGlassSpecularPoint(payload.x, payload.y);
                }
                if (inside === isMouseInsideCard) return;
                isMouseInsideCard = inside;
                keepActive(3000);
                syncGlassTuning();
                if (inside === false) {
                    // 鼠标离开立即沉回桌面底层（与应用盒一致的逻辑）
                    try {
                        window.__TAURI_INTERNALS__.invoke('deactivate_widget_window').catch(() => {});
                    } catch (_) {}
                }
            }, 'app_shelf');

            // 监听后端派发的实时应用列表更新
            tauriListen('app-shelf-updated', (event) => {
                if (event && Array.isArray(event.payload)) {
                    appItems = event.payload;
                    renderAppGrid();
                }
            });

            // 监听系统原生拖拽进入/移出/放下
            tauriListen('tauri://drag-enter', () => {
                overlay.classList.add('active');
            });
            tauriListen('tauri://drag-leave', () => {
                overlay.classList.remove('active');
            });
            tauriListen('tauri://drag-drop', async (event) => {
                overlay.classList.remove('active');
                if (event && event.payload && Array.isArray(event.payload.paths)) {
                    try {
                        const updated = await invoke('add_apps_to_shelf', { paths: event.payload.paths });
                        if (Array.isArray(updated)) {
                            appItems = updated;
                            renderAppGrid();
                        }
                    } catch (e) {
                        console.error('添加拖拽应用失败:', e);
                    }
                }
            });

            // HTML5 drag fallback
            window.addEventListener('dragover', (e) => {
                e.preventDefault();
                overlay.classList.add('active');
            });
            window.addEventListener('dragleave', (e) => {
                if (e.relatedTarget === null) overlay.classList.remove('active');
            });
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                overlay.classList.remove('active');
            });
        }

        // 拖拽窗口移动：移动超过阈值才判定为拖动，避免普通点击被拖动截断
        let isCardMouseDown = false;
        let cardDragStartX = 0;
        let cardDragStartY = 0;
        const DRAG_MOVE_THRESHOLD = 4;

        function onCardMouseDown(event) {
            if (event.button !== 0) return;
            const target = event.target;
            // 排除应用项自身点击、图标按钮、右键菜单与透明度弹窗
            if (target.closest('.app-item') ||
                target.closest('.icon-btn') ||
                target.closest('.widget-opacity-popover') ||
                target.closest('.context-menu') ||
                target.closest('.shelf-empty')) {
                return;
            }

            activateWidget();
            isCardMouseDown = true;
            cardDragStartX = event.screenX;
            cardDragStartY = event.screenY;
        }

        function onHeaderMouseDown(event) {
            if (event.button !== 0) return;
            const target = event.target;
            if (target.closest('.icon-btn') || target.closest('.widget-opacity-popover')) return;

            activateWidget();
            isCardMouseDown = true;
            cardDragStartX = event.screenX;
            cardDragStartY = event.screenY;
        }

        window.addEventListener('mousemove', (event) => {
            if (!isCardMouseDown) return;
            if ((event.buttons & 1) !== 1) {
                isCardMouseDown = false;
                return;
            }
            const dx = Math.abs(event.screenX - cardDragStartX);
            const dy = Math.abs(event.screenY - cardDragStartY);
            if (dx >= DRAG_MOVE_THRESHOLD || dy >= DRAG_MOVE_THRESHOLD) {
                isCardMouseDown = false;
                if (typeof window.__TAURI_INTERNALS__ !== 'undefined' && window.__TAURI_INTERNALS__.invoke) {
                    window.__TAURI_INTERNALS__.invoke('start_dragging_window').catch(() => {});
                }
            }
        });

        window.addEventListener('mouseup', () => {
            isCardMouseDown = false;
        });

        // 隐藏/显示顶部栏切换
        function toggleHeaderBar(event) {
            if (event) {
                if (typeof event.preventDefault === 'function') event.preventDefault();
                if (typeof event.stopPropagation === 'function') event.stopPropagation();
            }
            closeContextMenu();
            isHeaderHidden = !isHeaderHidden;
            applyHeaderVisibility(isHeaderHidden);
            if (typeof invoke === 'function') {
                invoke('set_app_shelf_hide_header', { hide: isHeaderHidden }).catch(() => {});
            }
        }

        function applyHeaderVisibility(hidden) {
            const card = document.getElementById('shelfCard');
            const menuIcon = document.getElementById('menuHeaderIcon');
            const menuText = document.getElementById('menuHeaderText');

            if (hidden) {
                if (card) card.classList.add('header-hidden');
                if (menuIcon) menuIcon.textContent = '👁️';
                if (menuText) menuText.textContent = '显示顶部栏';
            } else {
                if (card) card.classList.remove('header-hidden');
                if (menuIcon) menuIcon.textContent = '🙈';
                if (menuText) menuText.textContent = '隐藏顶部栏';
            }
        }

        // 右键菜单管理
        function onAppItemContextMenu(e, id, encodedPath) {
            e.preventDefault();
            e.stopPropagation();
            activeContextItemId = id;
            activeContextItemPath = decodeURIComponent(encodedPath);

            const menu = document.getElementById('contextMenu');
            const appSection = document.getElementById('appMenuSection');
            appSection.style.display = 'block';

            showMenuAt(e.clientX, e.clientY);
        }

        function onCardContextMenu(e) {
            e.preventDefault();
            activeContextItemId = null;
            activeContextItemPath = null;

            const menu = document.getElementById('contextMenu');
            const appSection = document.getElementById('appMenuSection');
            appSection.style.display = 'none';

            showMenuAt(e.clientX, e.clientY);
        }

        function showMenuAt(x, y) {
            const menu = document.getElementById('contextMenu');
            menu.style.display = 'block';
            const w = menu.offsetWidth || 160;
            const h = menu.offsetHeight || 150;
            const winW = window.innerWidth;
            const winH = window.innerHeight;

            const posX = (x + w > winW) ? (winW - w - 8) : x;
            const posY = (y + h > winH) ? (winH - h - 8) : y;

            menu.style.left = `${Math.max(8, posX)}px`;
            menu.style.top = `${Math.max(8, posY)}px`;
        }

        function closeContextMenu() {
            const menu = document.getElementById('contextMenu');
            if (menu) menu.style.display = 'none';
        }

        window.addEventListener('pointerdown', (e) => {
            const menu = document.getElementById('contextMenu');
            if (menu && menu.style.display !== 'none' && !menu.contains(e.target)) {
                menu.style.display = 'none';
            }
            const popover = document.getElementById('opacityPopover');
            const btn = document.getElementById('opacityBtn');
            if (popover && popover.style.display !== 'none' && !popover.contains(e.target) && !btn.contains(e.target)) {
                popover.style.display = 'none';
            }
        }, { capture: true });

        // 右键具体操作
        async function onContextOpenApp() {
            closeContextMenu();
            if (activeContextItemPath) {
                await invoke('open_app_item', { path: activeContextItemPath });
            }
        }

        async function onContextShowInFinder() {
            closeContextMenu();
            if (activeContextItemPath) {
                await invoke('show_in_finder', { path: activeContextItemPath });
            }
        }

        async function onContextRemoveApp() {
            closeContextMenu();
            if (activeContextItemId) {
                try {
                    const updated = await invoke('remove_app_from_shelf', { id: activeContextItemId });
                    if (Array.isArray(updated)) {
                        appItems = updated;
                        renderAppGrid();
                    }
                } catch (e) {
                    console.error('移除应用失败:', e);
                }
            }
        }

        // 置顶与常驻切换
        async function toggleShelfAlwaysOnTop() {
            closeContextMenu();
            const targetState = !isAlwaysOnTop;
            try {
                const res = await invoke('set_shelf_always_on_top', { alwaysOnTop: targetState });
                isAlwaysOnTop = !!res;
                updatePinUI(isAlwaysOnTop);
                const targetOpacity = isAlwaysOnTop ? floatingOpacity : desktopOpacity;
                setShelfOpacity(targetOpacity, true, true);
            } catch (e) {
                console.error('切换置顶状态失败:', e);
            }
        }

        function updatePinUI(pinned) {
            const pinIcon = document.getElementById('pinIcon');
            const pinText = document.getElementById('pinText');
            if (pinIcon) pinIcon.textContent = pinned ? '🖥️' : '📌';
            if (pinText) pinText.textContent = pinned ? '常驻桌面 (底层)' : '悬浮置顶 (前台)';
        }

        // 底色叠加浓度管理 (0.0 = 100% 纯原生 NSGlassEffectView)
        function setShelfOpacity(val, persist = true, animate = false) {
            const parsed = parseFloat(val);
            const clamped = Math.max(0.0, Math.min(0.85, Number.isNaN(parsed) ? 0.0 : parsed));
            currentOpacity = clamped;
            if (isAlwaysOnTop) {
                floatingOpacity = clamped;
            } else {
                desktopOpacity = clamped;
            }

            if (animate) {
                const card = document.getElementById('shelfCard');
                if (card) {
                    card.classList.add('is-transitioning');
                    clearTimeout(card._transTimer);
                    card._transTimer = setTimeout(() => {
                        card.classList.remove('is-transitioning');
                    }, 400);
                }
            }

            document.documentElement.style.setProperty('--glass-tint-alpha', clamped.toString());
            document.documentElement.style.setProperty('--widget-opacity', clamped.toString());
            syncNativeLiquidGlass();

            const percent = Math.round(clamped * 100);
            const badge = document.getElementById('opacityBadge');
            if (badge) badge.textContent = `${percent}%`;

            const slider = document.getElementById('opacitySlider');
            if (slider) slider.value = percent;

            document.querySelectorAll('.preset-chip').forEach(btn => {
                const btnVal = parseFloat(btn.textContent) || 0;
                if (Math.abs(btnVal - percent) < 3) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            if (persist) {
                localStorage.setItem('shelf_glass_tint_alpha', String(clamped));
                const mode = isAlwaysOnTop ? 'floating' : 'desktop';
                invoke('set_shelf_mode_opacity', { mode, opacity: clamped }).catch(() => {});
            }
        }

        function toggleOpacityPopover(e) {
            if (e) e.stopPropagation();
            closeContextMenu();
            const popover = document.getElementById('opacityPopover');
            if (!popover) return;
            const isVisible = popover.style.display !== 'none';
            if (!isVisible) {
                updateGlassVariantUI();
            }
            popover.style.display = isVisible ? 'none' : 'flex';
        }

        function onOpacityInput(e) {
            const val = parseInt(e.target.value, 10) / 100;
            setShelfOpacity(val, false, false);
        }

        function onOpacityChange(e) {
            const val = parseInt(e.target.value, 10) / 100;
            setShelfOpacity(val, true, false);
        }

        function setPresetOpacity(val) {
            setShelfOpacity(val, true, true);
        }

        // 主题切换
        function initTheme() {
            const saved = localStorage.getItem('shelf_theme') || localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            syncNativeLiquidGlass();
        }

        function toggleTheme(e) {
            if (e) e.stopPropagation();
            closeContextMenu();
            const cur = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('shelf_theme', next);
            syncNativeLiquidGlass();
        }

        // 关闭/隐藏
        async function closeShelf(e) {
            if (e) e.stopPropagation();
            try {
                await invoke('toggle_app_shelf_window');
            } catch (e) {
                console.error('隐藏应用盒失败:', e);
            }
        }
    </script>
</body>
